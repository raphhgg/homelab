
services:
  autoscan:
    container_name: autoscan
    image: ghcr.io/hotio/autoscan
    env_file:
      - ../../.env
    ports:
      - 3030:3030
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_PATH}/autoscan/config:/config
      - ${MEDIA_PATH}:/data/medias
    restart: unless-stopped
networks: {}