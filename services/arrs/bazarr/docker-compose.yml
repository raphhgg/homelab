services:
  bazarr:
    image: ghcr.io/hotio/bazarr
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
    ports:
      - 6767:6767
    volumes:
      - ${DOCKER_APPDATA_PATH}/bazarr:/config
      - /mnt/data:/data
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_socket_net"
      - "traefik.http.routers.bazarr.rule=Host(`${BAZARR_HOST}`)"
      - "traefik.http.routers.bazarr.entrypoints=websecure"
      - "traefik.http.routers.bazarr.tls.certresolver=cloudflare"
      - "traefik.http.routers.bazarr.middlewares=allow-default-apps@file,tinyauth@file"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - media
      - traefik_socket_net

networks:
  media:
    external: true
  traefik_socket_net:
    external: true
