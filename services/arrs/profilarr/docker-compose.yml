version: '3.8'

services:
  profilarr:
    image: santiagosayshey/profilarr:beta
    container_name: profilarr
    networks:
      - main
    ports:
      - 6868:6868
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - GIT_USER_NAME=${GIT_USER_NAME}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL}
    volumes:
      - ${DOCKER_APPDATA_PATH}/profilarr:/config
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  main:
    external: true