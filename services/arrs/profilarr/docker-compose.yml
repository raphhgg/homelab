services:
  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:develop
    container_name: profilarr
    networks:
      - media
      - traefik_socket_net
      - profilarr_internal
    ports:
      - 6869:6868
    volumes:
      - ${DOCKER_APPDATA_PATH}/profilarr-v2:/config
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PARSER_HOST=profilarr-parser
      - PARSER_PORT=5000
      - ORIGIN=https://${PROFILARR_HOST}
      - AUTH=none
    depends_on:
      - profilarr-parser
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_socket_net"
      - "traefik.http.routers.profilarr.rule=Host(`${PROFILARR_HOST}`)"
      - "traefik.http.routers.profilarr.entrypoints=websecure"
      - "traefik.http.routers.profilarr.tls.certresolver=cloudflare"
      - "traefik.http.routers.profilarr.middlewares=allow-default-apps@file,tinyauth@file"
      - "traefik.http.services.profilarr.loadbalancer.server.port=6868"
      - "com.centurylinklabs.watchtower.enable=true"

  profilarr-parser:
    image: ghcr.io/dictionarry-hub/profilarr-parser:develop
    container_name: profilarr-parser
    networks:
      - profilarr_internal
    expose:
      - "5000"
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  media:
    external: true
  traefik_socket_net:
    external: true
  profilarr_internal:
