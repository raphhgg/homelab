services:
  sonarr:
    image: ghcr.io/hotio/sonarr
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - TP_HOTIO=true
      - TP_THEME=organizr
    networks:
      - media
    volumes:
      - ${DOCKER_APPDATA_PATH}/sonarr:/config:rw
      - ${MEDIAS_PATH}:/data/medias
      - ${DOCKER_APPDATA_PATH}/themepark/98-themepark-sonarr:/etc/cont-init.d/98-themepark
    ports:
      - 8988:8989
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  media:
    external: true
