services:
  sonarr:
    image: ghcr.io/hotio/sonarr
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - TP_HOTIO=true
      - TP_THEME=organizr
    volumes:
      - ${DOCKER_APPDATA_PATH}/sonarr:/config:rw
      - /mnt/data:/data
      - ${DOCKER_APPDATA_PATH}/themepark/98-themepark-sonarr:/etc/cont-init.d/98-themepark
    ports:
      - 127.0.0.1:8988:8989
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_socket_net"
      - "traefik.http.routers.sonarr.rule=Host(`${SONARR_HOST}`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.tls.certresolver=cloudflare"
      - "traefik.http.routers.sonarr.middlewares=allow-default-apps@file,tinyauth@file"
      - "traefik.http.routers.sonarr-internal.rule=Host(`${SONARR_INTERNAL_HOST}`)"
      - "traefik.http.routers.sonarr-internal.entrypoints=websecure"
      - "traefik.http.routers.sonarr-internal.tls.certresolver=cloudflare"
      - "traefik.http.routers.sonarr-internal.middlewares=allow-default-apps@file"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - media
      - traefik_socket_net
networks:
  media:
    external: true
  traefik_socket_net:
    external: true
