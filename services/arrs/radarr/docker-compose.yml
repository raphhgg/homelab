services:
  radarr:
    image: ghcr.io/hotio/radarr
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - TP_HOTIO=true
      - TP_THEME=organizr
    volumes:
      - ${DOCKER_APPDATA_PATH}/radarr:/config
      - /mnt/data:/data
      - ${DOCKER_APPDATA_PATH}/themepark/98-themepark-radarr:/etc/cont-init.d/98-themepark
    ports:
      - 127.0.0.1:7878:7878
    restart: always
    labels:
      - "traefik.http.routers.radarr-api.rule=Host(`${RADARR_HOST}`) && PathPrefix(`/api/v3/`)"
      - "traefik.http.routers.radarr-api.entrypoints=websecure"
      - "traefik.http.routers.radarr-api.tls.certresolver=cloudflare"
      - "traefik.http.routers.radarr-api.middlewares=allow-default-apps@file"
      - "traefik.http.routers.radarr-api.service=radarr"
      - "traefik.http.routers.radarr-api.priority=100"
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_socket_net"
      - "traefik.http.routers.radarr.rule=Host(`${RADARR_HOST}`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls.certresolver=cloudflare"
      - "traefik.http.routers.radarr.middlewares=allow-default-apps@file,tinyauth@file"
      - "traefik.http.routers.radarr-internal.rule=Host(`${RADARR_INTERNAL_HOST}`)"
      - "traefik.http.routers.radarr-internal.entrypoints=websecure"
      - "traefik.http.routers.radarr-internal.tls.certresolver=cloudflare"
      - "traefik.http.routers.radarr-internal.middlewares=allow-default-apps@file"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - media
      - traefik_socket_net

networks:
  media:
    external: true
  traefik_socket_net:
    external: true
