version: '3.8'
services:
  syncthing:
    image: lscr.io/linuxserver/syncthing
    container_name: syncthing
    networks:
      - main
    ports:
      - 8384:8384
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_APPDATA_PATH}/syncthing/config:/config
      - ${DOCUMENTS_PATH}/obsidian:/syncthing/obsidian:rw
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.monitor-only=true"

networks:                      
  main:                        
    external: true 
