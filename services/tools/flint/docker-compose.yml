name: flint

services:
  flint:
    build:
      context: /home/raphh/src/flint/server
      dockerfile: Dockerfile
    image: flint-housing-backend:local
    container_name: flint
    env_file:
      - .env
    environment:
      FLINT_DB_PATH: /data/flint.db
      FLINT_PORT: "8787"
    volumes:
      - ${DOCKER_APPDATA_PATH}/flint:/data
    networks:
      - traefik_socket_net
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

networks:
  traefik_socket_net:
    external: true
