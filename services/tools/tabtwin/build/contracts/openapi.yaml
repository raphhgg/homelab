openapi: 3.1.0
info:
  title: Tabtwin HTTP API
  version: 0.1.0
  description: |
    Cloud source of truth for browser-tab twins. Chrome MV3 (Mac) is the only
    Phase 1 edge. Safari Mac / iOS are not implemented, but this contract is
    written so they can attach later:

    - Identity is always a cloud UUID. Native tab IDs never appear here.
      Native IDs recycle, including on iOS.
    - Devices pull commands. There is no required push channel. An iOS
      extension fetches when it wakes.
    - Commands may finish as unsupported when a browser cannot perform the
      mutation. Close is supported on Chrome Mac. Other mutations are not
      in Phase 1.
    - Close archives the twin first, then asks the device to close the real
      tab. Archive is a first-class operation, not only a side effect of
      close or snapshot. `archive_tabs` parks the twin in the cloud and
      does not enqueue a device command. `close_tab` still archives, then
      queues. Restoring an archived twin into a live browser tab is out of
      scope.

    The Chrome extension speaks this HTTPS API with a device bearer token.
    Agents speak MCP on the same process (`POST /mcp`) and never talk to
    the extension. MCP tools: `list_tabs`, `list_workspaces`,
    `create_workspace`, `set_tab_workspace`, `archive_tabs`, `close_tab`.
    All tab IDs are cloud UUIDs.

    Safety (encoded here even where UI does not exist yet):
    - auto: classify, summarize, duplicates. Listing tabs and workspaces
      is a read and does not block them.
    - confirm: `close_tab` and `archive_tabs`. The MCP call is the
      confirmation. Do not auto-close. Do not auto-archive.
    - explicit: purchase, message, account, auth. Not implemented.

    Out of scope: cookies, passwords, full page HTML, `get_page_content`,
    workspaces UI in the extension. The workspaces API is in.
servers:
  - url: http://127.0.0.1:47821
    description: Local Docker Compose / dev server
tags:
  - name: devices
  - name: tabs
  - name: workspaces
  - name: commands
  - name: audit
  - name: meta
paths:
  /healthz:
    get:
      tags: [meta]
      summary: Liveness and database ping
      operationId: healthz
      responses:
        "200":
          description: Process is up and can reach Postgres
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Process is up but Postgres is not
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /v1/devices/register:
    post:
      tags: [devices]
      summary: Mint a device-scoped bearer token
      operationId: registerDevice
      description: |
        Requires the bootstrap token (`Authorization: Bearer <BOOTSTRAP_TOKEN>`
        or `X-Bootstrap-Token`). Returns a device id and a bearer token shown
        once. Hash-only is stored.
      parameters:
        - $ref: "#/components/parameters/BootstrapAuth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceRequest"
      responses:
        "201":
          description: Device created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterDeviceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/devices/me:
    get:
      tags: [devices]
      summary: Current device
      operationId: getCurrentDevice
      security:
        - deviceBearer: []
      responses:
        "200":
          description: The device bound to this token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/tabs:
    get:
      tags: [tabs]
      summary: List tab twins for this device
      operationId: listTabs
      description: |
        Safety tier auto (read). IDs are cloud UUIDs. Native tab IDs are
        not returned. Filter by `state` (open, archived, all; default open)
        and optional `workspaceId`.
      security:
        - deviceBearer: []
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [open, archived, all]
            default: open
        - name: workspaceId
          in: query
          schema:
            type: string
            format: uuid
          description: If set, only twins in this workspace.
      responses:
        "200":
          description: Tab twins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TabList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/tabs/{tabId}:
    get:
      tags: [tabs]
      summary: Get one tab twin
      operationId: getTab
      security:
        - deviceBearer: []
      parameters:
        - $ref: "#/components/parameters/TabId"
      responses:
        "200":
          description: Tab twin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tab"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/tabs/snapshot:
    post:
      tags: [tabs]
      summary: Full-snapshot reconcile
      operationId: snapshotTabs
      description: |
        The device sends every currently open tab it can see. Each item may
        include a cloudId recovered from local mapping. Missing cloudIds are
        minted. Open twins for this device that are absent from the snapshot
        are archived with cause `snapshot_reconcile`. Snapshot does not write
        `workspace_id`. Snapshot does not reopen agent-held archives
        (`archive_tabs`, `close_tab`) even when that cloudId is still present.

        This is the recovery path when a browser has no background daemon
        (iOS) and when Chrome's service worker slept through events.
      security:
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnapshotRequest"
      responses:
        "200":
          description: Mappings plus archived cloud IDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/tabs/events:
    post:
      tags: [tabs]
      summary: Incremental tab events
      operationId: applyTabEvents
      description: |
        created / updated / moved / removed from chrome.tabs (or a future
        Safari adapter). created without cloudId mints a UUID. removed
        archives. Native tab IDs must not be sent.
      security:
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TabEventsRequest"
      responses:
        "200":
          description: Per-event results with minted cloud IDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TabEventsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/workspaces:
    get:
      tags: [workspaces]
      summary: List workspaces for this device
      operationId: listWorkspaces
      description: Safety tier auto (read). Device-scoped named groups.
      security:
        - deviceBearer: []
      responses:
        "200":
          description: Workspaces, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [workspaces]
      summary: Create a workspace
      operationId: createWorkspace
      description: |
        Mints a cloud UUID. Name is required, 1 to 120 characters after trim.
      security:
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/tabs/workspace:
    post:
      tags: [tabs]
      summary: Assign or unassign a tab workspace
      operationId: setTabWorkspace
      description: |
        Tab and workspace (when not null) must belong to this device.
        `workspaceId: null` unassigns. A tab is in zero or one workspace.
      security:
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTabWorkspaceRequest"
      responses:
        "200":
          description: Updated tab twin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tab"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/tabs/archive:
    post:
      tags: [tabs]
      summary: Archive tab twins in the cloud
      operationId: archiveTabs
      description: |
        Confirm-tier. Archives twins only. Does not enqueue a device command
        and does not close the browser tab. Unknown ids go in `missing`.
        Duplicate idempotency keys return `created: false` with the stored
        classification and current tab rows. Default key is
        `archive_tabs:` plus sha256 of the sorted unique ids.
      security:
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveTabsRequest"
      responses:
        "200":
          description: Existing receipt for this idempotency key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveTabsResponse"
        "201":
          description: New archive operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveTabsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/mcp/archive_tabs:
    post:
      tags: [tabs]
      summary: MCP REST alias for archive_tabs
      operationId: mcpArchiveTabs
      description: Same as POST /v1/tabs/archive, with actor type mcp.
      security:
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveTabsRequest"
      responses:
        "200":
          description: Existing receipt for this idempotency key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveTabsResponse"
        "201":
          description: New archive operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveTabsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/commands:
    get:
      tags: [commands]
      summary: Pull commands for this device
      operationId: listCommands
      description: |
        Pull-only. Poll or fetch on wake. Phase 1 Chrome polls; iOS will
        fetch when the extension wakes. Default status filter is queued.
      security:
        - deviceBearer: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, success, fail, unsupported, stale]
            default: queued
      responses:
        "200":
          description: Commands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [commands]
      summary: Enqueue a command (used by MCP close_tab)
      operationId: enqueueCommand
      description: |
        Safety tier confirm for close_tab. Archives the twin, then enqueues
        an idempotent close for the device. Duplicate idempotency keys
        return the original command.
      security:
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnqueueCommandRequest"
      responses:
        "200":
          description: Existing command for this idempotency key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Command"
        "201":
          description: New command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Command"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/commands/{commandId}:
    get:
      tags: [commands]
      summary: Get one command
      operationId: getCommand
      security:
        - deviceBearer: []
      parameters:
        - $ref: "#/components/parameters/CommandId"
      responses:
        "200":
          description: Command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Command"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/commands/{commandId}/result:
    post:
      tags: [commands]
      summary: Device reports command outcome
      operationId: reportCommandResult
      description: |
        Terminal statuses only. queued is not accepted. A second report for
        an already-terminal command is ignored and the stored row is returned.
      security:
        - deviceBearer: []
      parameters:
        - $ref: "#/components/parameters/CommandId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandResultRequest"
      responses:
        "200":
          description: Updated command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Command"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/audit:
    get:
      tags: [audit]
      summary: Audit log for this device
      operationId: listAudit
      description: |
        Records the chain. Event or command in, what happened, who or what
        initiated it (device, mcp, system).
      security:
        - deviceBearer: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /mcp:
    post:
      tags: [meta]
      summary: MCP Streamable HTTP
      operationId: mcp
      description: |
        Official MCP TypeScript SDK over Streamable HTTP. Same device bearer
        token as the HTTPS API. Tools:

        - list_tabs (auto / read-only). `state` and optional `workspaceId`.
          Cloud UUIDs only.
        - list_workspaces (auto / read-only).
        - create_workspace (name, 1 to 120 characters).
        - set_tab_workspace (tabId, workspaceId or null).
        - archive_tabs (confirm). Cloud archive only. Never auto-called.
          Does not enqueue a device command.
        - close_tab (confirm). Archives then enqueues. Never auto-called.

        GET /mcp is the SSE stream when a client opens one. DELETE /mcp
        ends a session. Phase 1 serves stateless JSON/SSE.
      security:
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: JSON-RPC result or SSE event stream
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [meta]
      summary: MCP SSE stream
      operationId: mcpSse
      security:
        - deviceBearer: []
      responses:
        "200":
          description: Event stream
        "405":
          description: Stateless mode may not open a long-lived GET
    delete:
      tags: [meta]
      summary: MCP session end
      operationId: mcpDelete
      security:
        - deviceBearer: []
      responses:
        "200":
          description: Session closed
        "405":
          description: Stateless mode
components:
  securitySchemes:
    deviceBearer:
      type: http
      scheme: bearer
      description: Device-scoped token from POST /v1/devices/register or DEV_DEVICE_TOKEN.
  parameters:
    BootstrapAuth:
      name: Authorization
      in: header
      required: true
      description: Bearer bootstrap token (BOOTSTRAP_TOKEN). X-Bootstrap-Token is also accepted.
      schema:
        type: string
    TabId:
      name: tabId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Cloud tab UUID. Not a chrome.tabs id.
    CommandId:
      name: commandId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Missing or unknown bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    NotFound:
      description: Unknown id for this device
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    Health:
      type: object
      required: [ok, db]
      properties:
        ok:
          type: boolean
        db:
          type: string
          enum: [up, down]
    Device:
      type: object
      required: [id, name, browserFamily, platform, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        browserFamily:
          type: string
          enum: [chrome, safari]
        platform:
          type: string
          enum: [macos, ios]
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RegisterDeviceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        browserFamily:
          type: string
          enum: [chrome, safari]
          default: chrome
        platform:
          type: string
          enum: [macos, ios]
          default: macos
    RegisterDeviceResponse:
      type: object
      required: [device, token]
      properties:
        device:
          $ref: "#/components/schemas/Device"
        token:
          type: string
          description: Shown once. Store it. The server keeps only a hash.
    Tab:
      type: object
      required:
        - id
        - deviceId
        - url
        - title
        - domain
        - state
        - browserFamily
        - pinned
        - active
        - workspaceId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Cloud UUID. Stable across Chrome restarts.
        deviceId:
          type: string
          format: uuid
        url:
          type: string
        title:
          type: string
        domain:
          type: string
          nullable: true
        state:
          type: string
          enum: [open, archived]
        windowIndex:
          type: integer
          nullable: true
        indexInWindow:
          type: integer
          nullable: true
        browserFamily:
          type: string
          enum: [chrome, safari]
        pinned:
          type: boolean
        active:
          type: boolean
        audible:
          type: boolean
        lastAccessedAt:
          type: string
          format: date-time
          nullable: true
        openedAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          format: date-time
          nullable: true
        workspaceId:
          type: string
          format: uuid
          nullable: true
          description: Workspace membership. Null means unassigned.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TabList:
      type: object
      required: [tabs]
      properties:
        tabs:
          type: array
          items:
            $ref: "#/components/schemas/Tab"
    Workspace:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkspaceList:
      type: object
      required: [workspaces]
      properties:
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
    SetTabWorkspaceRequest:
      type: object
      required: [tabId, workspaceId]
      properties:
        tabId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
          nullable: true
    ArchiveTabsRequest:
      type: object
      required: [tabIds]
      properties:
        tabIds:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
            format: uuid
        idempotencyKey:
          type: string
          maxLength: 200
          description: Defaults to archive_tabs:<sha256 of sorted unique ids>
    ArchiveTabsResponse:
      type: object
      required: [tabs, newlyArchived, alreadyArchived, missing, created]
      properties:
        tabs:
          type: array
          items:
            $ref: "#/components/schemas/Tab"
        newlyArchived:
          type: array
          items:
            type: string
            format: uuid
        alreadyArchived:
          type: array
          items:
            type: string
            format: uuid
        missing:
          type: array
          items:
            type: string
            format: uuid
        created:
          type: boolean
    SnapshotRequest:
      type: object
      required: [tabs]
      properties:
        tabs:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/SnapshotTab"
    SnapshotTab:
      type: object
      properties:
        cloudId:
          type: string
          format: uuid
        url:
          type: string
        title:
          type: string
        windowIndex:
          type: integer
          nullable: true
        indexInWindow:
          type: integer
          nullable: true
        pinned:
          type: boolean
        active:
          type: boolean
        audible:
          type: boolean
        lastAccessedAt:
          type: string
          format: date-time
          nullable: true
        openedAt:
          type: string
          format: date-time
          nullable: true
    SnapshotResponse:
      type: object
      required: [mappings, archived]
      properties:
        mappings:
          type: array
          items:
            $ref: "#/components/schemas/SnapshotMapping"
        archived:
          type: array
          items:
            type: string
            format: uuid
    SnapshotMapping:
      type: object
      required: [index, cloudId]
      properties:
        index:
          type: integer
          description: Index into the request tabs array
        cloudId:
          type: string
          format: uuid
        created:
          type: boolean
    TabEventsRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/TabEvent"
    TabEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [created, updated, removed, moved]
        cloudId:
          type: string
          format: uuid
        url:
          type: string
        title:
          type: string
        windowIndex:
          type: integer
          nullable: true
        indexInWindow:
          type: integer
          nullable: true
        pinned:
          type: boolean
        active:
          type: boolean
        audible:
          type: boolean
        lastAccessedAt:
          type: string
          format: date-time
          nullable: true
    TabEventsResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/TabEventResult"
    TabEventResult:
      type: object
      required: [index, type]
      properties:
        index:
          type: integer
        type:
          type: string
          enum: [created, updated, removed, moved]
        cloudId:
          type: string
          format: uuid
        tab:
          $ref: "#/components/schemas/Tab"
        error:
          type: string
    Command:
      type: object
      required:
        - id
        - deviceId
        - type
        - status
        - idempotencyKey
        - payload
        - safetyTier
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        tabId:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
          enum: [close_tab]
        status:
          type: string
          enum: [queued, success, fail, unsupported, stale]
        idempotencyKey:
          type: string
        payload:
          type: object
          additionalProperties: true
        result:
          type: object
          nullable: true
          additionalProperties: true
        safetyTier:
          type: string
          enum: [auto, confirm, explicit]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CommandList:
      type: object
      required: [commands]
      properties:
        commands:
          type: array
          items:
            $ref: "#/components/schemas/Command"
    EnqueueCommandRequest:
      type: object
      required: [type, tabId]
      properties:
        type:
          type: string
          enum: [close_tab]
