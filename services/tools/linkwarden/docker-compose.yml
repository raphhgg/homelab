services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    env_file: .env
    volumes:
      - ${DOCKER_APPDATA_PATH}/linkwarden/pgdata:/var/lib/postgresql/data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - linkwarden_internal

  meilisearch:
    image: getmeili/meilisearch:v1.12.8
    container_name: meilisearch
    restart: always
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - ${DOCKER_APPDATA_PATH}/linkwarden/meili_data:/meili_data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - linkwarden_internal

  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:latest
    container_name: linkwarden
    restart: always
    ports:
      - 3002:3000
    depends_on:
      - postgres
      - meilisearch
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - NEXT_PUBLIC_AUTHENTIK_ENABLED=${LINKWARDEN_OIDC_ENABLED}
      - AUTHENTIK_CUSTOM_NAME=Pocket ID
      - AUTHENTIK_ISSUER=${LINKWARDEN_OIDC_ISSUER}
      - AUTHENTIK_CLIENT_ID=${LINKWARDEN_OIDC_CLIENT_ID}
      - AUTHENTIK_CLIENT_SECRET=${LINKWARDEN_OIDC_CLIENT_SECRET}
    volumes:
      - ${DOCKER_APPDATA_PATH}/linkwarden/data:/data/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_socket_net"
      - "traefik.http.routers.linkwarden.rule=Host(`${LINKWARDEN_HOST}`)"
      - "traefik.http.routers.linkwarden.entrypoints=websecure"
      - "traefik.http.routers.linkwarden.tls.certresolver=cloudflare"
      - "traefik.http.routers.linkwarden.middlewares=allow-default-apps@file"
      - "traefik.http.services.linkwarden.loadbalancer.server.port=3000"
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - linkwarden_internal
      - traefik_socket_net

networks:
  linkwarden_internal:
  traefik_socket_net:
    external: true
