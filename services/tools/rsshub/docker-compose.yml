services:
  rsshub:
    image: diygod/rsshub:latest
    container_name: rsshub
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - CACHE_TYPE=redis
      - REDIS_URL=redis://rsshub-redis:6379/
      - TWITTER_AUTH_TOKEN=${TWITTER_AUTH_TOKEN}
    depends_on:
      - rsshub-redis
    networks:
      - monitoring
      - rsshub_internal
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  rsshub-redis:
    image: redis:7-alpine
    container_name: rsshub-redis
    restart: always
    networks:
      - rsshub_internal
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  monitoring:
    external: true
  rsshub_internal:
