services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.8.5
    container_name: open-webui
    ports:
      - 8087:8080
    volumes:
      - ${DOCKER_APPDATA_PATH}/open-webui:/app/backend/data
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_URL=${WEBUI_URL}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - DEFAULT_MODELS=${DEFAULT_MODELS}
      - DEFAULT_PINNED_MODELS=${DEFAULT_PINNED_MODELS}
      - ENABLE_MEMORIES=${ENABLE_MEMORIES}
      - ENABLE_FOLDERS=${ENABLE_FOLDERS}
      - ENABLE_NOTES=${ENABLE_NOTES}
      - ENABLE_CHANNELS=${ENABLE_CHANNELS}
      - ENABLE_COMMUNITY_SHARING=${ENABLE_COMMUNITY_SHARING}
      - AIOHTTP_CLIENT_TIMEOUT=${AIOHTTP_CLIENT_TIMEOUT}
      - AIOHTTP_CLIENT_TIMEOUT_MODEL_LIST=${AIOHTTP_CLIENT_TIMEOUT_MODEL_LIST}
      - AIOHTTP_CLIENT_TIMEOUT_OPENAI_MODEL_LIST=${AIOHTTP_CLIENT_TIMEOUT_OPENAI_MODEL_LIST}
      - AIOHTTP_CLIENT_TIMEOUT_TOOL_SERVER=${AIOHTTP_CLIENT_TIMEOUT_TOOL_SERVER}
      - CORS_ALLOW_ORIGIN=${CORS_ALLOW_ORIGIN}
      - ENABLE_OAUTH_SIGNUP=${OPENWEBUI_OAUTH_ENABLED}
      - OAUTH_CLIENT_ID=${OPENWEBUI_OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OPENWEBUI_OAUTH_CLIENT_SECRET}
      - OAUTH_PROVIDER_NAME=Pocket ID
      - OPENID_PROVIDER_URL=${OPENWEBUI_OPENID_PROVIDER_URL}
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true
      - ENABLE_OAUTH_ROLE_MANAGEMENT=true
      - ENABLE_OAUTH_GROUP_MANAGEMENT=true
      - ENABLE_OAUTH_GROUP_CREATION=true
      - OAUTH_ALLOWED_ROLES=${OPENWEBUI_OAUTH_ALLOWED_ROLES}
      - OAUTH_ADMIN_ROLES=${OPENWEBUI_OAUTH_ADMIN_ROLES}
      - OAUTH_ROLES_CLAIM=groups
      - OAUTH_SCOPES=openid email profile groups
      - DEFAULT_USER_ROLE=user
      - ENABLE_LOGIN_FORM=${OPENWEBUI_ENABLE_LOGIN_FORM}
      - OAUTH_UPDATE_PICTURE_ON_LOGIN=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - ${OPENWEBUI_DNS_PRIMARY}
      - ${OPENWEBUI_DNS_SECONDARY}
      - ${OPENWEBUI_DNS_TERTIARY}
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_socket_net"
      - "traefik.http.routers.chat.rule=Host(`${CHAT_HOST}`)"
      - "traefik.http.routers.chat.entrypoints=websecure"
      - "traefik.http.routers.chat.tls.certresolver=cloudflare"
      - "traefik.http.routers.chat.middlewares=allow-default-apps@file"
      - "traefik.http.services.chat.loadbalancer.server.port=8080"
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - traefik_socket_net

networks:
  traefik_socket_net:
    external: true
