services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    environment:
      - TZ=${TZ}
      - DOMAIN=${VAULTWARDEN_DOMAIN}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - SIGNUPS_ALLOWED=${SIGNUPS_ALLOWED}
      - SSO_ENABLED=${SSO_ENABLED:-false}
      - SSO_SIGNUPS_MATCH_EMAIL=${SSO_SIGNUPS_MATCH_EMAIL:-false}
      - SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION=${SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION:-false}
      - SSO_PKCE=${SSO_PKCE:-true}
      - SSO_SCOPES=${SSO_SCOPES:-email profile groups offline_access}
      - SSO_CLIENT_ID=${SSO_CLIENT_ID:-}
      - SSO_CLIENT_SECRET=${SSO_CLIENT_SECRET:-}
      - SSO_AUTHORITY=${SSO_AUTHORITY:-}
    dns:
      - 1.1.1.1
    volumes:
      - ${DOCKER_APPDATA_PATH}/vaultwarden:/data
    networks:
      - traefik_socket_net
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`${VAULTWARDEN_HOST}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.tls.certresolver=cloudflare"
      - "traefik.http.routers.vaultwarden.middlewares=allow-default-apps@file"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  traefik_socket_net:
    external: true
