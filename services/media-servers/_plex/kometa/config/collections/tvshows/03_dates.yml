collections:
  Pre Streaming Shows:
    smart_filter:
      all:
        release.before: 2014-01-01
        collection.not: Anime Shows,Cartoons Shows
      sort_by: year.desc
    sort_title: +030_Pre_Streaming_Collection
    summary: "Shows released before the beginning of the streaming era."
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: true

  Recently Released Shows:
    smart_filter:
      all:
        episode_year: 2025
      sort_by: episode_release.desc
    sort_title: +031_Recently_Released_Shows_Collection
    summary: "A collection of the latest shows with episodes released in 2025, sorted by newest first."
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: true

  Recently Added Shows:
    plex_all: true
    collection_order: added.desc
    sort_title: +032_Recently_Added_Shows_Collection
    summary: "A collection of the latest shows added, sorted by newest first."
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: true

  Recently Released Episodes:
    plex_search:
      all:
        episode_air_date.after: 2025-01-01
        episode_unplayed: true
    collection_order: episode_release.desc
    # builder_level: episode
    sort_title: +033_Recently_Released_Episodes_Collection
    summary: "Unwatched episodes from the latest shows released in 2025, sorted by newest first."
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: true









