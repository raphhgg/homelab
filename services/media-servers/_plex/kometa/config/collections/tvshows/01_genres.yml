templates:
  # Genre mapped from sonarr's root folders (autotags)
  Genre:
    plex_search:
      all:
        label: Sonarr <<tag>>
    collection_order: year.desc
    label: <<collection_name>> Collection
    sort_title: +010_<<tag>>_Shows
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: true

  Pre Streaming:
    smart_filter:
      all:
        collection: <<parent_collection_name>>
        release.before: 2014-01-01
      sort_by: year.desc
    sort_title: +010_<<parent_collection_name>>_<<collection_name>>
    visible_home: false
    visible_shared: false
    visible_library: true
  
  Post Streaming:
    smart_filter:
      all:
        collection: <<parent_collection_name>>
        release.after: 2014-01-01
      sort_by: year.desc
    sort_title: +010_<<parent_collection_name>>_<<collection_name>>
    visible_home: false
    visible_shared: false
    visible_library: true

  Separator:
    smart_label: random
    sync_mode: sync
    imdb_id: tt0411008

# Basic genre collections from Sonarr autotags
collections:
  Favorites Shows:
    template: { name: Genre, tag: Favorite }
    summary: "My All Time Favorites TV Shows."
    visible_home: true
    visible_shared: true
    sort_title: +00_Favorites_Shows
