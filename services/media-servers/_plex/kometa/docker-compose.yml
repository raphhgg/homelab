services:
  kometa:
    image: kometateam/kometa:latest
    container_name: kometa
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - KOMETA_DEBUG=true
      # - KOMETA_CONFIG=./config/config.yml
    volumes:
      - ${DOCKER_APPDATA_PATH}/kometa/config:/config
    restart: always
    networks:
      - main

networks:
  main:
    external: true