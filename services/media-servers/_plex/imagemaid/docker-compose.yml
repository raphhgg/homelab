services:
  imagemaid:
    image: kometateam/imagemaid
    container_name: imagemaid
    # Override entrypoint to keep container running idle
    # ImageMaid will be triggered externally via Cronicle
    entrypoint: ["/bin/sh", "-c", "tail -f /dev/null"]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PLEX_URL=${PLEX_URL}
      - PLEX_TOKEN=${PLEX_TOKEN}
      - MODE=remove
      - EMPTY_TRASH=True
      - CLEAN_BUNDLES=True
      - OPTIMIZE_DB=True
      - PHOTO_TRANSCODER=True
    volumes:
      - ${DOCKER_APPDATA_PATH}/kometa/config:/config
      - ${DOCKER_APPDATA_PATH}/plex/config:/plex
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.monitor-only=true"
    networks:
      - main

networks:
  main:
    external: true