version: '3.8'

services:
  trailarr:
    image: nandyalu/trailarr
    container_name: trailarr
    networks:
      - main
    ports:
      - 7889:7889
    volumes:
      - ${DOCKER_APPDATA_PATH}/trailarr/config:/config
      # Map your Radarr and Sonarr media folder(s)
      - ${MEDIAS_PATH:-/volume1/data/medias}:/data/medias
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_DISABLE_AUTH=true
    restart: unless-stopped

networks:
  main:
    external: true