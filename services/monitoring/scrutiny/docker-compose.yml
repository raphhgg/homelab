services:
  scrutiny:
    image: ghcr.io/analogj/scrutiny:master-omnibus
    container_name: scrutiny
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN  # Required for NVMe drives
    ports:
      - 8092:8080
    volumes:
      - ${DOCKER_APPDATA_PATH}/scrutiny/config:/opt/scrutiny/config
      - ${DOCKER_APPDATA_PATH}/scrutiny/influxdb:/opt/scrutiny/influxdb
      - /run/udev:/run/udev:ro
    devices:
      - /dev/sda:/dev/sda
      # - /dev/sdb:/dev/sdb
      # - /dev/nvme0n1:/dev/nvme0n1
      # - /dev/nvme1n1:/dev/nvme1n1
    environment:
      - TZ=${TZ}
    networks:
      - traefik_socket_net
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_socket_net"
      - "traefik.http.routers.scrutiny.rule=Host(`${SCRUTINY_HOST}`)"
      - "traefik.http.routers.scrutiny.entrypoints=websecure"
      - "traefik.http.routers.scrutiny.tls.certresolver=cloudflare"
      - "traefik.http.routers.scrutiny.middlewares=allow-admin-apps@file,tinyauth@file"
      - "traefik.http.services.scrutiny.loadbalancer.server.port=8080"
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  traefik_socket_net:
    external: true
