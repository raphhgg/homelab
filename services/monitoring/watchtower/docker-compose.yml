version: '3.8'

services:
  watchtower:
    image: nickfedor/watchtower
    container_name: watchtower
    networks:
      - main
      - socket_proxy
    ports:
      - 8082:8080  # HTTP API port
    environment:
      - TZ=${TZ}
      - DOCKER_HOST=${DOCKER_HOST}

      # SCHEDULED MODE - Runs daily at 05:00 (after ImageMaid completes at 04:00)
      - WATCHTOWER_SCHEDULE=0 0 5 * * *

      # Discord notifications via Shoutrrr
      - WATCHTOWER_NOTIFICATION_URL=discord://${WATCHTOWER_DISCORD_TOKEN}@${WATCHTOWER_DISCORD_WEBHOOK_ID}

      # Report mode - send single summary notification instead of per-container
      - WATCHTOWER_NOTIFICATION_REPORT=true

      # HTTP API MODE - Manual trigger via API calls (optional, alongside schedule)
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN}

      # Allow periodic checks alongside HTTP API
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=true

      # Whitelist mode: only check/update containers with enable=true label
      - WATCHTOWER_LABEL_ENABLE=true

      # Cleanup old images after update
      - WATCHTOWER_CLEANUP=true

      # Include stopped/restarting containers in checks
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_INCLUDE_RESTARTING=true

      # Logging
      - WATCHTOWER_LOG_LEVEL=info

    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  main:
    external: true
  socket_proxy:
    external: true
