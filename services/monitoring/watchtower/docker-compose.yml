services:
  watchtower-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: watchtower-proxy
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - POST=1
      - DELETE=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket_net
    restart: always
    labels:
      # The socket proxy is Watchtower's Docker control plane; never update it
      # from the Watchtower process that depends on it.
      - "com.centurylinklabs.watchtower.enable=false"

  watchtower:
    image: nickfedor/watchtower
    container_name: watchtower
    networks:
      - monitoring
      - socket_net
    ports:
      - 127.0.0.1:8082:8080  # HTTP API port
    environment:
      - TZ=${TZ}
      - DOCKER_HOST=tcp://watchtower-proxy:2375

      # SCHEDULED MODE - Runs daily at 05:00 (after ImageMaid completes at 04:00)
      - WATCHTOWER_SCHEDULE=0 0 5 * * *

      # Notifications via Shoutrrr (Discord + Gotify)
      - WATCHTOWER_NOTIFICATION_URL=discord://${WATCHTOWER_DISCORD_TOKEN}@${WATCHTOWER_DISCORD_WEBHOOK_ID} gotify://gotify/${GOTIFY_WATCHTOWER_TOKEN}?priority=5&disabletls=yes

      # Report mode - send single summary notification instead of per-container
      - WATCHTOWER_NOTIFICATION_REPORT=true

      # Custom template: only show updated/failed containers (exclude "Fresh")
      - |
        WATCHTOWER_NOTIFICATION_TEMPLATE=
        {{- if .Report -}}
        {{- with .Report -}}
        {{len .Scanned}} Scanned, {{len .Updated}} Updated, {{len .Failed}} Failed
        {{- range .Updated}}
        - {{.Name}} ({{.ImageName}}): {{.CurrentImageID.ShortID}} updated to {{.LatestImageID.ShortID}}
        {{- end -}}
        {{- range .Failed}}
        - {{.Name}} ({{.ImageName}}): {{.State}}: {{.Error}}
        {{- end -}}
        {{- end -}}
        {{- else -}}
        {{range .Entries -}}{{.Message}}{{"\n"}}{{- end -}}
        {{- end -}}

      # HTTP API MODE - Manual trigger via API calls (optional, alongside schedule)
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN}

      # Allow periodic checks alongside HTTP API
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=true

      # Whitelist mode: only check/update containers with enable=true label
      - WATCHTOWER_LABEL_ENABLE=true

      # Cleanup old images after update
      - WATCHTOWER_CLEANUP=true

      # Include stopped/restarting containers in checks
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_INCLUDE_RESTARTING=true

      # Logging
      - WATCHTOWER_LOG_LEVEL=info

    depends_on:
      - watchtower-proxy
    restart: always
    labels:
      # Keep Watchtower itself outside its own update set.
      - "com.centurylinklabs.watchtower.enable=false"

networks:
  monitoring:
    external: true
  socket_net:
