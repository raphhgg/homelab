services:
  uptime-kuma-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: uptime-kuma-proxy
    environment:
      - CONTAINERS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket_net
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    networks:
      - monitoring
      - socket_net
      - traefik_socket_net
    ports:
      - 3001:3001
    volumes:
      - ${DOCKER_APPDATA_PATH}/uptime-kuma/data:/app/data
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DOCKER_HOST=tcp://uptime-kuma-proxy:2375
    depends_on:
      - uptime-kuma-proxy
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_socket_net"
      - "traefik.http.routers.kuma.rule=Host(`${KUMA_HOST}`)"
      - "traefik.http.routers.kuma.entrypoints=websecure"
      - "traefik.http.routers.kuma.tls.certresolver=cloudflare"
      - "traefik.http.routers.kuma.middlewares=allow-default-apps@file,tinyauth@file"
      - "traefik.http.services.kuma.loadbalancer.server.port=3001"
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  monitoring:
    external: true
  traefik_socket_net:
    external: true
  socket_net:
