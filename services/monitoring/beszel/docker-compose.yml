version: '3.8'

services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    networks:
      - main
    ports:
      - 8091:8090
    volumes:
      - ${DOCKER_APPDATA_PATH}/beszel/data:/beszel_data
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  beszel-agent:
    image: henrygd/beszel-agent:alpine
    container_name: beszel-agent
    privileged: true
    networks:
      - main
      - socket_proxy
    volumes:
      # Monitor only main volumes - accurate filesystem-level usage
      # For directory-level usage (docker, downloads, movies, etc.), use Cronicle scripts
      - /volume3:/extra-filesystems/cachedev_1__Volume3:ro
      - /volume2:/extra-filesystems/cachedev_0__Volume2:ro
    environment:
      - PORT=45876
      - KEY=${BESZEL_AGENT_KEY}
      - DOCKER_HOST=${DOCKER_HOST}
      # Filesystem for Disk Usage panel
      - FILESYSTEM=/extra-filesystems/cachedev_1__Volume3
      # Map the I/O stats to the physical disk to fix "Device not found in diskstats"
      - DISK=/dev/sata1 
      # Explicitly define SMART devices with types for NAS controllers
      - SMART_DEVICES=/dev/sata1:sat,/dev/sata2:sat,/dev/nvme0n1:nvme
    devices:
      - /dev/sata1:/dev/sata1
      - /dev/sata2:/dev/sata2
      - /dev/nvme0n1:/dev/nvme0
    cap_add:
      - SYS_RAWIO 
      - SYS_ADMIN
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  main:
    external: true
  socket_proxy:
    external: true
