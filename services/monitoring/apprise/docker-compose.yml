services:
  apprise:
    image: caronc/apprise:latest
    container_name: apprise
    networks:
      - monitoring
      - media
      - apprise_internal
    ports:
      - 8089:8000  # External:Internal (8000 used by Portainer, 8090 by SABnzbd)
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # Stateful mode - maps keys to files in /config
      - APPRISE_STATEFUL_MODE=simple
      # Lightweight worker count for homelab
      - APPRISE_WORKER_COUNT=1
      # Optional: Set default theme
      - APPRISE_DEFAULT_THEME=dark
    volumes:
      - ./config:/config
      - ${DOCKER_APPDATA_PATH}/apprise/attach:/attach
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  middleware:
    build:
      context: ./middleware
      dockerfile: Dockerfile
    container_name: apprise-middleware
    networks:
      - apprise_internal
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - APPRISE_URL=http://apprise:8000
      - LOG_LEVEL=INFO
    volumes:
      - ./middleware:/app
    restart: unless-stopped
    depends_on:
      - apprise
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

networks:
  monitoring:
    external: true
  media:
    external: true
  apprise_internal:
