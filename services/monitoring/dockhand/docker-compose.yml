services:
  dockhand-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: dockhand-proxy
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - POST=1
      - DELETE=1
      - EXEC=1
      - EVENTS=1
      - INFO=1
      - VERSION=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      socket_net:
        ipv4_address: 172.30.0.2
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    networks:
      - socket_net
    ports:
      - 3000:3000
    volumes:
      - ${DOCKER_APPDATA_PATH}/dockhand/data:/app/data
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DOCKER_HOST=tcp://172.30.0.2:2375
    depends_on:
      - dockhand-proxy
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  socket_net:
    ipam:
      config:
        - subnet: 172.30.0.0/29
