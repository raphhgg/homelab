apiVersion: 1

providers:
  - name: Proxmox Nodes
    orgId: 1
    folder: Proxmox
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/proxmox

  - name: Networking
    orgId: 1
    folder: Networking
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/networking
