version: '3.8'

services:
  dozzle:
    image: amir20/dozzle
    container_name: dozzle
    networks:
      - main
      - socket_proxy
    ports:
      - 8088:8080
    environment:
      - DOCKER_HOST=${DOCKER_HOST}
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"


networks:
  main:
    external: true
  socket_proxy:
    external: true