services:
  dozzle-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: dozzle-proxy
    environment:
      - CONTAINERS=1
      - EVENTS=1
      - INFO=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket_net
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  dozzle:
    image: amir20/dozzle
    container_name: dozzle
    networks:
      - socket_net
    ports:
      - 8088:8080
    environment:
      - DOCKER_HOST=tcp://dozzle-proxy:2375
    depends_on:
      - dozzle-proxy
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  socket_net:
