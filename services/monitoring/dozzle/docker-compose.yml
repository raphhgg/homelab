services:
  dozzle-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: dozzle-proxy
    environment:
      - CONTAINERS=1
      - EVENTS=1
      - INFO=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket_net
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  dozzle:
    image: amir20/dozzle
    container_name: dozzle
    networks:
      - socket_net
      - traefik_socket_net
    ports:
      - 8088:8080
    environment:
      - DOCKER_HOST=tcp://dozzle-proxy:2375
    depends_on:
      - dozzle-proxy
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_socket_net"
      - "traefik.http.routers.dozzle.rule=Host(`${DOZZLE_HOST}`)"
      - "traefik.http.routers.dozzle.entrypoints=websecure"
      - "traefik.http.routers.dozzle.tls.certresolver=cloudflare"
      - "traefik.http.routers.dozzle.middlewares=allow-admin-apps@file,tinyauth@file"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  socket_net:
  traefik_socket_net:
    external: true
