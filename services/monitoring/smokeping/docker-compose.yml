services:
  smokeping:
    image: lscr.io/linuxserver/smokeping:latest
    container_name: smokeping
    networks:
      - monitoring
      - traefik_socket_net
    ports:
      - 8095:80
    volumes:
      - ${DOCKER_APPDATA_PATH}/smokeping/config:/config
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_socket_net"
      - "traefik.http.routers.smokeping.rule=Host(`${SMOKEPING_HOST}`)"
      - "traefik.http.routers.smokeping.entrypoints=websecure"
      - "traefik.http.routers.smokeping.tls.certresolver=cloudflare"
      - "traefik.http.routers.smokeping.middlewares=allow-admin-apps@file,tinyauth@file"
      - "traefik.http.services.smokeping.loadbalancer.server.port=80"
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  monitoring:
    external: true
  traefik_socket_net:
    external: true
