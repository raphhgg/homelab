services:
  netronome:
    image: ghcr.io/autobrr/netronome:latest
    container_name: netronome
    user: 0000:0000
    networks:
      - monitoring
      - traefik_socket_net
    ports:
      - 7575:7575
    volumes:
      - ${DOCKER_APPDATA_PATH}/netronome:/data
    environment:
      - TZ=${TZ}
      - NETRONOME__HOST=0.0.0.0
      - NETRONOME__PORT=7575
      - NETRONOME__DB_TYPE=sqlite
      - NETRONOME__DB_PATH=/data/netronome.db
      - NETRONOME__GEOIP_COUNTRY=/data/GeoLite2-Country.mmdb
      - NETRONOME__GEOIP_ASN=/data/GeoLite2-ASN.mmdb
    cap_add:
      - NET_RAW
      - NET_ADMIN
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_socket_net"
      - "traefik.http.routers.netronome.rule=Host(`${NETRONOME_HOST}`)"
      - "traefik.http.routers.netronome.entrypoints=websecure"
      - "traefik.http.routers.netronome.tls.certresolver=cloudflare"
      - "traefik.http.routers.netronome.middlewares=allow-admin-apps@file,tinyauth@file"
      - "traefik.http.services.netronome.loadbalancer.server.port=7575"
      - "com.centurylinklabs.watchtower.enable=true"

  netronome-agent:
    image: ghcr.io/autobrr/netronome:latest
    container_name: netronome-agent
    hostname: debian-vm
    command: agent --config /config/agent-vm.toml
    networks:
      - monitoring
    ports:
      - 8200:8200
    pid: host
    volumes:
      - ${DOCKER_APPDATA_PATH}/netronome/agent-vm.toml:/config/agent-vm.toml:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /volume2:/volume2:ro
      - /volume3:/volume3:ro
    environment:
      - TZ=${TZ}
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - NETRONOME__AGENT_API_KEY=${NETRONOME_AGENT_API_KEY}
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  monitoring:
    external: true
  traefik_socket_net:
    external: true
