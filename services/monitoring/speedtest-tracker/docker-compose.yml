services:
  speedtest-tracker:
    container_name: speedtest-tracker
    image: lscr.io/linuxserver/speedtest-tracker:latest
    restart: always
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - APP_TIMEZONE=${TZ}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=sqlite
      - SPEEDTEST_SCHEDULE=${SPEEDTEST_SCHEDULE}
    volumes:
      - ${DOCKER_APPDATA_PATH}/speedtest-tracker:/config
    ports:
      - 8076:80
    networks:
      - monitoring
      - traefik_socket_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_socket_net"
      - "traefik.http.routers.speedtest-tracker.rule=Host(`${SPEEDTEST_TRACKER_HOST}`)"
      - "traefik.http.routers.speedtest-tracker.entrypoints=websecure"
      - "traefik.http.routers.speedtest-tracker.tls.certresolver=cloudflare"
      - "traefik.http.routers.speedtest-tracker.middlewares=allow-default-apps@file,tinyauth@file"
      - "traefik.http.services.speedtest-tracker.loadbalancer.server.port=80"
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  monitoring:
    external: true
  traefik_socket_net:
    external: true
