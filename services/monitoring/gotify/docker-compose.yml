version: '3.8'

services:
  gotify:
    image: gotify/server
    container_name: gotify
    networks:
      - main
    ports:
      - 8093:80
    environment:
      - TZ=${TZ}
      - GOTIFY_DEFAULTUSER_NAME=${GOTIFY_DEFAULT_USER}
      - GOTIFY_DEFAULTUSER_PASS=${GOTIFY_DEFAULT_PASS}
    volumes:
      - ${DOCKER_APPDATA_PATH}/gotify/data:/app/data
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # igotify:
  #   image: ghcr.io/androidseb25/igotify-notification-assist
  #   container_name: igotify
  #   networks:
  #     - main
  #   ports:
  #     - 8094:8080
