- type: docker-containers
  title: Arrs
  sock-path: ${DOCKER_HOST}
  running-only: false
  hide-by-default: true
  containers:
    radarr:
      name: Radarr
      description: Movie management
      url: https://radarr.raphh.me
      icon: /assets/icons/radarr.svg
      hide: false
    sonarr:
      name: Sonarr
      description: TV show management
      url: https://sonarr.raphh.me
      icon: /assets/icons/sonarr.svg
      hide: false
    prowlarr:
      name: Prowlarr
      description: Indexer manager
      url: https://prowlarr.raphh.me
      icon: /assets/icons/prowlarr.svg
      hide: false
    bazarr:
      name: Bazarr
      description: Subtitle management
      url: https://bazarr.raphh.me
      icon: /assets/icons/bazarr.svg
      hide: false
    profilarr:
      name: Profilarr
      description: Profile sync for Arrs
      url: https://profilarr.raphh.me
      icon: /assets/icons/profilarr.svg
      hide: false
    seerr:
      name: Seerr
      description: Media request management
      url: https://seerr.raphh.me
      icon: /assets/icons/jellyseerr.svg
      hide: false
