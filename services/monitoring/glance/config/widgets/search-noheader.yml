- type: search
  hide-header: true
  search-engine: google
  new-tab: true
  autofocus: true
  bangs:
  - title: YouTube
    shortcut: "!yt"
    url: https://www.youtube.com/results?search_query={QUERY}
  - title: Letterboxd
    shortcut: "!lt"
    url: https://letterboxd.com/search/{QUERY}/?adult
  - title: Dashboard Icons
    shortcut: "!di"
    url: https://dashboardicons.com/icons?q={QUERY}
  - title: Linkwarden
    shortcut: "!li"
    url: https://links.raphh.me/search?q={QUERY}
  - title: Radarr
    shortcut: "!r"
    url: https://radarr.raphh.me/add/new?term={QUERY}
  - title: Sonarr
    shortcut: "!s"
    url: https://sonarr.raphh.me/add/new?term={QUERY}
  - title: TMDb
    shortcut: "!tm"
    url: https://www.themoviedb.org/search?query={QUERY}