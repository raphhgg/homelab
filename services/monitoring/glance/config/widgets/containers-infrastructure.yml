- type: docker-containers
  title: Infrastructure
  sock-path: ${DOCKER_HOST}
  running-only: false
  hide-by-default: true
  containers:
    cloudflare-ddns:
      name: Cloudflare DDNS
      description: Dynamic DDNS updater
      icon: /assets/icons/cloudflare.svg
      hide: false
    github-actions-runner:
      name: GitHub Runner
      description: Self-hosted Actions runner
      icon: /assets/icons/github-white.svg
      hide: false
    watchtower:
      name: Watchtower
      description: Container auto-updater
      icon: /assets/icons/watchtower.svg
      hide: false
