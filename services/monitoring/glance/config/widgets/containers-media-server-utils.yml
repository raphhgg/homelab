- type: docker-containers
  title: Utils
  sock-path: ${DOCKER_HOST}
  running-only: true
  hide-by-default: true
  containers:
    kometa:
      name: Kometa
      description: Plex metadata manager
      icon: /assets/icons/kometa.png
      hide: false
    imagemaid:
      name: ImageMaid
      description: Plex image cleanup
      icon: /assets/icons/image-maid.png
      hide: false
    plex-auto-languages:
      name: Plex-Auto-Languages
      description: Automatic audio/subtitle selection
      icon: /assets/icons/plex.svg
      hide: false
    autopulse:
      name: Autopulse
      description: Media processing automation
      icon: /assets/icons/github-white.svg
      hide: false
    cross-seed:
      name: Cross-Seed
      description: Download once, seed everywhere
      icon: /assets/icons/png/cross-seed.png
      hide: false
    lettarrboxd:
      name: Lettarrboxd
      icon: /assets/icons/letterboxd-light.svg
      hide: false
    lettarboxd-new-releases:
      name: Lettarrboxd New Releases
      icon: /assets/icons/letterboxd-light.svg
      hide: false
