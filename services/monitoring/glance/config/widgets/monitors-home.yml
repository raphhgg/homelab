- type: group
  widgets:
  - type: monitor
    title: Monitoring
    cache: 5m
    sites:
      - title: Zabbix
        url: https://zabbix.raphh.me/zabbix
        check-url: http://10.10.2.102/zabbix
        timeout: 8s
        icon: di:zabbix
        alt-status-codes:
          - 401
          - 307
      - title: Grafana
        url: https://grafana.raphh.me/d/pve-nodes-hardware
        check-url: http://grafana:3000/
        timeout: 8s
        icon: di:grafana
        alt-status-codes:
          - 401
          - 307
      - title: Home Assistant
