- type: custom-api
  title: qBittorrent
  cache: 10s
  subrequests:
    main_transfer:
      url: http://${QBITTORRENT_MAIN_IP}/api/v2/transfer/info
    main_active:
      url: http://${QBITTORRENT_MAIN_IP}/api/v2/torrents/info
      parameters:
        filter: active
    cross_transfer:
      url: http://${QBITTORRENT_CROSS_IP}/api/v2/transfer/info
    cross_active:
      url: http://${QBITTORRENT_CROSS_IP}/api/v2/torrents/info
      parameters:
        filter: active
    cross_seeding:
      url: http://${QBITTORRENT_CROSS_IP}/api/v2/torrents/info
      parameters:
        filter: seeding
    brr_transfer:
      url: http://${QBITTORRENT_BRR_IP}/api/v2/transfer/info
    brr_active:
      url: http://${QBITTORRENT_BRR_IP}/api/v2/torrents/info
      parameters:
        filter: active
  template: |
    {{ $mainTransfer := .Subrequest "main_transfer" }}
    {{ $mainActive := .Subrequest "main_active" }}
    {{ $crossTransfer := .Subrequest "cross_transfer" }}
    {{ $crossActive := .Subrequest "cross_active" }}
    {{ $crossSeeding := .Subrequest "cross_seeding" }}
    {{ $brrTransfer := .Subrequest "brr_transfer" }}
    {{ $brrActive := .Subrequest "brr_active" }}

    <div class="list" style="--list-gap: 12px;">

      <!-- QBIT-MAIN -->
      <div>
        <div class="size-h5 color-subdue" style="margin-bottom: 6px;">QBIT-MAIN</div>
        {{ if and (eq $mainTransfer.Response.StatusCode 200) (eq $mainActive.Response.StatusCode 200) }}
        <div class="flex justify-between text-center">
          <div>
            {{ $dlSpeed := $mainTransfer.JSON.Float "dl_info_speed" }}
            {{ if lt $dlSpeed 1048576.0 }}
              <div class="color-highlight size-h4">{{ printf "%.0f KiB/s" (div $dlSpeed 1024.0) }}</div>
            {{ else }}
              <div class="color-highlight size-h4">{{ printf "%.1f MiB/s" (div $dlSpeed 1048576.0) }}</div>
            {{ end }}
            <div class="size-h6">DOWNLOADING</div>
          </div>
          <div>
            {{ $ulSpeed := $mainTransfer.JSON.Float "up_info_speed" }}
            {{ if lt $ulSpeed 1048576.0 }}
              <div class="color-highlight size-h4">{{ printf "%.0f KiB/s" (div $ulSpeed 1024.0) }}</div>
            {{ else }}
              <div class="color-highlight size-h4">{{ printf "%.1f MiB/s" (div $ulSpeed 1048576.0) }}</div>
            {{ end }}
            <div class="size-h6">UPLOADING</div>
          </div>
          <div>
            <div class="color-highlight size-h4">{{ len ($mainActive.JSON.Array "") }}</div>
            <div class="size-h6">ACTIVE</div>
          </div>
        </div>
        {{ else }}
        <div class="color-negative size-sm">Error connecting</div>
        {{ end }}
      </div>

      <hr style="border: 0; border-top: 1px solid var(--color-separator); margin: 12px 0;">

      <!-- QBIT-CROSS -->
      <div>
        <div class="size-h5 color-subdue" style="margin-bottom: 6px;">QBIT-CROSS</div>
        {{ if and (eq $crossTransfer.Response.StatusCode 200) (eq $crossActive.Response.StatusCode 200) (eq $crossSeeding.Response.StatusCode 200) }}
        <div class="flex justify-between text-center">
          <div>
            {{ $ulSpeed := $crossTransfer.JSON.Float "up_info_speed" }}
            {{ if lt $ulSpeed 1048576.0 }}
              <div class="color-highlight size-h4">{{ printf "%.0f KiB/s" (div $ulSpeed 1024.0) }}</div>
            {{ else }}
              <div class="color-highlight size-h4">{{ printf "%.1f MiB/s" (div $ulSpeed 1048576.0) }}</div>
            {{ end }}
            <div class="size-h6">UPLOADING</div>
          </div>
          <div>
            <div class="color-highlight size-h4">{{ len ($crossActive.JSON.Array "") }}</div>
            <div class="size-h6">ACTIVE</div>
          </div>
          <div>
            <div class="color-highlight size-h4">{{ len ($crossSeeding.JSON.Array "") }}</div>
            <div class="size-h6">SEEDING</div>
          </div>
        </div>
        {{ else }}
        <div class="color-negative size-sm">Error connecting</div>
        {{ end }}
      </div>

      <hr style="border: 0; border-top: 1px solid var(--color-separator); margin: 12px 0;">

      <!-- QBIT-BRR -->
      <div>
        <div class="size-h5 color-subdue" style="margin-bottom: 6px;">QBIT-BRR</div>
        {{ if and (eq $brrTransfer.Response.StatusCode 200) (eq $brrActive.Response.StatusCode 200) }}
        <div class="flex justify-between text-center">
          <div>
            {{ $dlSpeed := $brrTransfer.JSON.Float "dl_info_speed" }}
            {{ if lt $dlSpeed 1048576.0 }}
              <div class="color-highlight size-h4">{{ printf "%.0f KiB/s" (div $dlSpeed 1024.0) }}</div>
            {{ else }}
              <div class="color-highlight size-h4">{{ printf "%.1f MiB/s" (div $dlSpeed 1048576.0) }}</div>
            {{ end }}
            <div class="size-h6">DOWNLOADING</div>
          </div>
          <div>
            {{ $ulSpeed := $brrTransfer.JSON.Float "up_info_speed" }}
            {{ if lt $ulSpeed 1048576.0 }}
              <div class="color-highlight size-h4">{{ printf "%.0f KiB/s" (div $ulSpeed 1024.0) }}</div>
            {{ else }}
              <div class="color-highlight size-h4">{{ printf "%.1f MiB/s" (div $ulSpeed 1048576.0) }}</div>
            {{ end }}
            <div class="size-h6">UPLOADING</div>
          </div>
          <div>
            <div class="color-highlight size-h4">{{ len ($brrActive.JSON.Array "") }}</div>
            <div class="size-h6">ACTIVE</div>
          </div>
        </div>
        {{ else }}
        <div class="color-negative size-sm">Error connecting</div>
        {{ end }}
      </div>

    </div>
