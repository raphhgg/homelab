- name: Home
  columns:
    # Left Column
    - size: small
      widgets:
        # $include: ../widgets/calendar.yml
        $include: ../widgets/unifi.yml
        $include: ../widgets/speedtest.yml
        $include: ../widgets/qbit-main.yml
        $include: ../widgets/qbit-cross.yml
        # $include: ../widgets/server-stats.yml
        $include: ../widgets/beszel-stats.yml
        $include: ../widgets/drive-health.yml

    # Center Column
    - size: full
      widgets:
        $include: ../widgets/search.yml

        # Media Server & Tools (tabbed)
        - type: group
          widgets:
            - type: monitor
              title: media server
              cache: 1m
              sites:
                - title: plex
                  url: http://10.10.2.2:32400/web/index.html
                  icon: di:plex
                - title: radarr
                  url: http://10.10.2.2:7878
                  icon: di:radarr
                - title: sonarr
                  url: http://10.10.2.2:8988
                  icon: di:sonarr
                - title: qui
                  url: http://10.10.2.2:7476/instances/1
                  icon: di:qui
                - title: daps-ui
                  url: http://10.10.2.2:8001/poster-renamer
                  icon: mdi:image-edit
                - title: profilarr
                  url: http://10.10.2.2:6868
                  icon: di:profilarr

            - type: monitor
              title: tools
              cache: 1m
              sites:
                - title: prowlarr
                  url: http://10.10.2.2:9696
                  icon: di:prowlarr
                - title: jellyseerr
                  url: http://10.10.2.2:5055
                  icon: di:jellyseerr
                - title: autobrr
                  url: http://10.10.2.2:7474
                  icon: di:autobrr
                - title: upload-assistant
                  url: http://10.10.2.2:8086
                  icon: mdi:cloud-upload
                - title: daps
                  url: http://10.10.2.2:8002/
                  icon: mdi:image-multiple
                - title: stash
                  url: http://10.10.2.2:9999
                  icon: di:stash

        # Monitoring 
        - type: monitor
          title: Monitoring
          cache: 1m
          sites:
            - title: tautulli
              url: http://10.10.2.2:8181
              icon: di:tautulli
            - title: beszel
              url: http://10.10.2.2:8091
              icon: di:beszel
            - title: dozzle
              url: http://10.10.2.2:8088
              icon: di:dozzle

        # Other
        - type: monitor
          title: Other
          cache: 1m
          sites:
            - title: dsm
              url: https://10.10.2.2:5001
              icon: di:synology-dsm
              allow-insecure: true
              alt-status-codes:
                - 403
            - title: home assistant
              url: http://10.10.2.2:8123
              icon: di:home-assistant
            - title: syncthing
              url: http://10.10.2.2:8384
              icon: di:syncthing
            - title: the lounge
              url: http://10.10.2.2:9001
              icon: di:thelounge

        # Reddit
        # $include: ../widgets/reddit-homelab.yml
        $include: ../widgets/github-graph.yml

    # Right Column
    - size: small
      widgets:        
        $include: ../widgets/weather.yml
        $include: ../widgets/weather-7days.yml     
        $include: ../widgets/now-playing.yml
        $include: ../widgets/markets.yml
        $include: ../widgets/f1-next-race.yml
        $include: ../widgets/f1-next-race-detailed.yml
        $include: ../widgets/f1-drivers-standings.yml
        $include: ../widgets/f1-constructors-standings.yml
