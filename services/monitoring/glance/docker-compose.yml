services:
  glance-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: glance-proxy
    environment:
      - CONTAINERS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket_net
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  glance:
    container_name: glance
    image: ghcr.io/panonim/dynacat:beta-3f1202b
    restart: always
    dns:
      - 10.10.2.101
      - 1.1.1.1
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./config/assets:/app/assets
      - /volume2:/mnt/volume2:ro
      - /volume3:/mnt/volume3:ro
    ports:
      - 8070:8080
    networks:
      - monitoring
      - media
      - socket_net
      - glance_internal
      - traefik_socket_net
    depends_on:
      - glance-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_socket_net"
      - "traefik.http.routers.glance.rule=Host(`${GLANCE_HOST}`)"
      - "traefik.http.routers.glance.entrypoints=websecure"
      - "traefik.http.routers.glance.tls.certresolver=cloudflare"
      - "traefik.http.routers.glance.middlewares=allow-default-apps@file,tinyauth@file"
      - "traefik.http.services.glance.loadbalancer.server.port=8080"
      - "com.centurylinklabs.watchtower.enable=true"

  f1-api:
    container_name: f1-api
    image: skyallinott/f1_api:latest
    restart: always
    dns:
      - 10.10.2.101
      - 1.1.1.1
    environment:
      - TIMEZONE=${TZ}
      - TRACK_COLOUR=${F1_TRACK_COLOUR}
      - EVENT_DETAIL=main
    ports:
      - 4463:4463
    networks:
      - glance_internal
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  monitoring:
    external: true
  media:
    external: true
  traefik_socket_net:
    external: true
  socket_net:
  glance_internal:
