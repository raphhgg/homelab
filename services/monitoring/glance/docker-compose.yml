services:
  glance-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: glance-proxy
    environment:
      - CONTAINERS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket_net
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  glance:
    container_name: glance
    image: ghcr.io/panonim/dynacat:beta-3f1202b
    restart: always
    dns:
      - 10.10.2.101
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./config/assets:/app/assets
      - /volume2:/mnt/volume2:ro
      - /volume3:/mnt/volume3:ro
    ports:
      - 8070:8080
    networks:
      - monitoring
      - media
      - socket_net
      - glance_internal
    depends_on:
      - glance-proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  f1-api:
    container_name: f1-api
    image: skyallinott/f1_api:latest
    restart: always
    environment:
      - TIMEZONE=${TZ}
      - TRACK_COLOUR=#e10600
      - EVENT_DETAIL=main
    ports:
      - 4463:4463
    networks:
      - glance_internal
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  monitoring:
    external: true
  media:
    external: true
  socket_net:
  glance_internal:
