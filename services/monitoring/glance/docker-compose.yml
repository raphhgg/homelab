services:
  glance:
    container_name: glance
    image: glanceapp/glance
    restart: always
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./config/assets:/app/assets
      - /volume2:/mnt/volume2:ro
      - /volume3:/mnt/volume3:ro
    ports:
      - 8070:8080
    networks:
      - main
      - socket_proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  f1-api:
    container_name: f1-api
    image: skyallinott/f1_api:latest
    restart: always
    environment:
      - TIMEZONE=${TZ}
      - TRACK_COLOUR=#e10600
      - EVENT_DETAIL=main
    ports:
      - 4463:4463
    networks:
      - main
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  main:
    external: true
  socket_proxy:
    external: true
