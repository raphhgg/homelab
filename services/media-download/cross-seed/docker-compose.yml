version: '3.8'

services:
  cross-seed:
    image: ghcr.io/cross-seed/cross-seed
    container_name: cross-seed
    user: ${PUID}:${PGID} # this must match your torrent client (cross-seed does not support using PGID and PUID)
    environment:
      - TZ=${TZ}
    ports:
      - 2468:2468
    networks:
      - main
    volumes:
      - ${DOCKER_APPDATA_PATH}/cross-seed:/config
      - ${DOWNLOAD_PATH}/torrents:/data/torrents
      - ${MEDIAS_PATH:-/volume1/data/medias}:/data/medias
      # You will need at least one extra volume for your media drive if using https://www.cross-seed.org/docs/tutorials/linking
    command: daemon
    restart: unless-stopped

networks:
  main:
    external: true