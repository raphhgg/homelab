version: '3.8'

services:
  cross-seed:
    image: ghcr.io/cross-seed/cross-seed
    container_name: cross-seed
    user: ${PUID}:${PGID} # this must match your torrent client (cross-seed does not support using PGID and PUID)
    environment:
      - TZ=${TZ}
    ports:
      - 2468:2468
    networks:
      main:
        ipv4_address: 172.21.0.130
    volumes:
      - ${DOCKER_APPDATA_PATH}/cross-seed:/config
      - ${MEDIAS_PATH}:/data/medias:rw
    command: daemon
    restart: always

networks:
  main:
    external: true
    ipam:
      driver: default
      config:
        - subnet: 172.21.0.0/16
          ip_range: 172.21.0.128/25  # Reserve .128-.255 for static IPs