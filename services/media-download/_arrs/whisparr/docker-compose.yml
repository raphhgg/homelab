version: '3.8'

services:
  whisparr:
    image: ghcr.io/hotio/whisparr:v3
    container_name: whisparr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=${UMASK}
      - TP_HOTIO=true
      - TP_THEME=organizr
    volumes:
      - ${DOCKER_APPDATA_PATH}/whisparr:/config
      - ${MEDIAS_PATH}:/data/medias
      - ${DOCKER_APPDATA_PATH}/themepark/98-themepark-radarr:/etc/cont-init.d/98-themepark
    ports:
      - 6969:6969
    restart: unless-stopped
    networks:
      - main

networks:
  main:
    external: true