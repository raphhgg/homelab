services:
  upload-assistant:
    image: ghcr.io/audionut/upload-assistant:web-ui
    container_name: upload-assistant
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
      - TORRENT_STORAGE_DIR=/torrents
      - DATA_DIR=/data/medias
    ports:
      - 8086:5000
    networks:
      - media
      - traefik_socket_net
    volumes:
      - ${DOCKER_APPDATA_PATH}/upload-assistant/config.py:/Upload-Assistant/data/config.py:ro
      - ${MEDIAS_PATH}/downloads/torrents/complete:/torrent_storage_dir:ro
      - ${MEDIAS_PATH}:/data/medias:ro
      - ${DOCKER_APPDATA_PATH}/qbit-main/data/BT_backup:/BT_backup:ro
      - ${DOCKER_APPDATA_PATH}/upload-assistant/tmp:/Upload-Assistant/tmp
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_socket_net"
      - "traefik.http.routers.upload-assistant.rule=Host(`${UPLOAD_ASSISTANT_HOST}`)"
      - "traefik.http.routers.upload-assistant.entrypoints=websecure"
      - "traefik.http.routers.upload-assistant.tls.certresolver=cloudflare"
      - "traefik.http.routers.upload-assistant.middlewares=allow-admin-apps@file,tinyauth@file"
      - "traefik.http.services.upload-assistant.loadbalancer.server.port=5000"
      - "com.centurylinklabs.watchtower.enable=true"
    command: tail -f /dev/null

networks:
  media:
    external: true
  traefik_socket_net:
    external: true
