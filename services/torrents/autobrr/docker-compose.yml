services:
  autobrr:
    image: ghcr.io/autobrr/autobrr
    container_name: autobrr
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
      - AUTOBRR__OIDC_ENABLED=${AUTOBRR__OIDC_ENABLED}
      - AUTOBRR__OIDC_ISSUER=${AUTOBRR__OIDC_ISSUER}
      - AUTOBRR__OIDC_CLIENT_ID=${AUTOBRR__OIDC_CLIENT_ID}
      - AUTOBRR__OIDC_CLIENT_SECRET=${AUTOBRR__OIDC_CLIENT_SECRET}
      - AUTOBRR__OIDC_REDIRECT_URL=${AUTOBRR__OIDC_REDIRECT_URL}
      - AUTOBRR__OIDC_DISABLE_BUILT_IN_LOGIN=${AUTOBRR__OIDC_DISABLE_BUILT_IN_LOGIN:-false}
    dns:
      - 1.1.1.1
    ports:
      - 127.0.0.1:7474:7474
    networks:
      - media
      - traefik_socket_net
    volumes:
      - ${DOCKER_APPDATA_PATH}/autobrr:/config
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_socket_net"
      - "traefik.http.routers.autobrr.rule=Host(`${AUTOBRR_HOST}`)"
      - "traefik.http.routers.autobrr.entrypoints=websecure"
      - "traefik.http.routers.autobrr.tls.certresolver=cloudflare"
      - "traefik.http.routers.autobrr.middlewares=allow-admin-apps@file"
      - "traefik.http.services.autobrr.loadbalancer.server.port=7474"
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  media:
    external: true
  traefik_socket_net:
    external: true
