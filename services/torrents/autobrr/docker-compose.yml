services:
  autobrr:
    image: ghcr.io/autobrr/autobrr
    container_name: autobrr
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
    ports:
      - 7474:7474
    networks:
      - media
    volumes:
      - ${DOCKER_APPDATA_PATH}/autobrr:/config
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  media:
    external: true