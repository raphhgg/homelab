services:
  qui:
    image: ghcr.io/autobrr/qui
    container_name: qui
    ports:
      - "127.0.0.1:7476:7476"
    volumes:
      - ${DOCKER_APPDATA_PATH}/qui:/config
      - /mnt/data/media:/data/media:rw
      - /mnt/data/torrents:/data/torrents:rw
      - ${DOWNLOAD_PATH}/torrents:/downloads/torrents:rw
    environment:
      # Server configuration
      # Default: 0.0.0.0 in containers
      #QUI__HOST: "0.0.0.0"
      
      # Port to listen on
      # Default: 7476
      #QUI__PORT: "7476"
      
      # Base URL for serving from subdirectory
      # Example: /qui/ to serve at http://domain.com/qui/
      # Not needed for subdomain or direct port access
      #QUI__BASE_URL: "/qui/"
      
      # Session secret for cookie encryption
      # Auto-generated if not provided
      # Recommended: Set a secure value for production
      #QUI__SESSION_SECRET: "change-me-to-a-secure-secret"
      
      # Logging configuration
      # Options: ERROR, DEBUG, INFO, WARN, TRACE
      # Default: INFO
      QUI__LOG_LEVEL: "INFO"
      
      # Log file path (inside container)
      # If not defined, logs to stdout
      QUI__LOG_PATH: "/config/logs/qui.log"
      # Pocket ID OIDC
      QUI__OIDC_ENABLED: "true"
      QUI__OIDC_ISSUER: "https://id.ext.raphh.me"
      QUI__OIDC_CLIENT_ID: "${QUI_OIDC_CLIENT_ID}"
      QUI__OIDC_CLIENT_SECRET: "${QUI_OIDC_CLIENT_SECRET}"
      QUI__OIDC_REDIRECT_URL: "https://qui.raphh.me/api/auth/oidc/callback"
      QUI__OIDC_DISABLE_BUILT_IN_LOGIN: "false"
    restart: always
    networks:
      - media
      - traefik_socket_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_socket_net"
      - "traefik.http.routers.qui.rule=Host(`${QUI_HOST}`)"
      - "traefik.http.routers.qui.entrypoints=websecure"
      - "traefik.http.routers.qui.tls.certresolver=cloudflare"
      - "traefik.http.routers.qui.middlewares=allow-admin-apps@file"
      - "traefik.http.services.qui.loadbalancer.server.port=7476"
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  media:
    external: true
  traefik_socket_net:
    external: true
