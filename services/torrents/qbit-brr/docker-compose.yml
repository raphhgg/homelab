services:
  qbit-brr:
    container_name: qbit-brr
    image: ghcr.io/hotio/qbittorrent:release-5.1.3
    ports:
      - 127.0.0.1:8085:8085
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
      - VPN_ENABLED=true
      - VPN_CONF=wg0
      - VPN_PROVIDER=pia
      - VPN_LAN_NETWORK=${VPN_LAN_NETWORK}
      - VPN_LAN_LEAK_ENABLED=false
      - VPN_AUTO_PORT_FORWARD=true
      - VPN_KEEP_LOCAL_DNS=true
      - VPN_FIREWALL_TYPE=auto
      - VPN_HEALTHCHECK_ENABLED=true
      - VPN_PIA_USER=${VPN_PIA_USER}
      - VPN_PIA_PASS=${VPN_PIA_PASS}
      - VPN_PIA_PREFERRED_REGION=${VPN_PIA_PREFERRED_REGION}
      - VPN_PIA_DIP_TOKEN=${VPN_PIA_DIP_TOKEN}
      - VPN_PIA_PORT_FORWARD_PERSIST=false
      - PRIVOXY_ENABLED=false
      - UNBOUND_ENABLED=false
      - S6_LOGGING=1
      - LIBTORRENT=v1
      - WEBUI_PORTS=8085/tcp,8085/udp
    dns:
      - 1.1.1.1
      - 1.0.0.1
    volumes:
      - type: bind
        source: ${DOCKER_APPDATA_PATH}/qbit-brr
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ./scripts
        target: /scripts
        read_only: true
      - type: bind
        source: /home/raphh/docker/appdata/stash/config
        target: /stash-config
        read_only: true
      - type: bind
        source: /mnt/data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/data/torrents
        target: /downloads/torrents
        bind:
          create_host_path: false
      - type: bind
        source: ${DOWNLOAD_PATH}/torrents/incomplete
        target: /downloads/torrents/incomplete
        bind:
          create_host_path: false
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=1
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: always
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 1G
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_socket_net"
      - "traefik.http.routers.qbit-brr.rule=Host(`${QBIT_BRR_HOST}`)"
      - "traefik.http.routers.qbit-brr.entrypoints=websecure"
      - "traefik.http.routers.qbit-brr.tls.certresolver=cloudflare"
      - "traefik.http.routers.qbit-brr.middlewares=allow-admin-apps@file,tinyauth@file"
      - "traefik.http.services.qbit-brr.loadbalancer.server.port=8085"
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - media
      - traefik_socket_net

networks:
  media:
    external: true
  traefik_socket_net:
    external: true
