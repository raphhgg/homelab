services:
  thelounge:
    image: ghcr.io/thelounge/thelounge
    container_name: thelounge
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
    ports:
      - 9001:9000
    networks:
      - media
      - traefik_socket_net
    volumes:
      - ${DOCKER_APPDATA_PATH}/thelounge:/var/opt/thelounge
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_socket_net"
      - "traefik.http.routers.thelounge.rule=Host(`${THELOUNGE_HOST}`)"
      - "traefik.http.routers.thelounge.entrypoints=websecure"
      - "traefik.http.routers.thelounge.tls.certresolver=cloudflare"
      - "traefik.http.routers.thelounge.middlewares=allow-admin-apps@file,tinyauth@file"
      - "traefik.http.services.thelounge.loadbalancer.server.port=9000"
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  media:
    external: true
  traefik_socket_net:
    external: true
