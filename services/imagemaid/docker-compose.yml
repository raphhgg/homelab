services:
  imagemaid:
    image: kometateam/imagemaid
    container_name: imagemaid
    env_file:
      - ../../.env
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - SCHEDULE=07:00|weekly(sunday)
      - PLEX_URL=http://10.10.2.2:32400
      - PLEX_TOKEN=${PLEX_TOKEN}
      - EMPTY_TRASH=True
      - CLEAN_BUNDLES=True
      - OPTIMIZE_DB=True
    volumes:
      - ${DOCKER_PATH}/kometa/config:/config
      - ${DOCKER_PATH}/plex:/plex
    restart: unless-stopped
networks: {}