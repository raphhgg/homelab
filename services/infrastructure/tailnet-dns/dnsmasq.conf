# Split DNS for the tailnet. Tailscale sends raphh.me queries here
# (admin console: nameserver 100.105.16.75, restricted to raphh.me).
interface=tailscale0
except-interface=lo
bind-dynamic
no-resolv
no-hosts
server=1.1.1.1
server=9.9.9.9

# Every lab name points at debian-vm, where Traefik serves it.
address=/*.raphh.me/100.105.16.75
address=/*.raphh.me/fd7a:115c:a1e0::d933:104c

# Names served publicly keep their public answers.
server=/raphh.me/1.1.1.1
server=/www.raphh.me/1.1.1.1
server=/playbook.raphh.me/1.1.1.1
server=/overview.raphh.me/1.1.1.1
server=/ext.raphh.me/1.1.1.1
