services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2
    container_name: pocket-id
    environment:
      - APP_URL=${POCKET_ID_APP_URL}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - TRUST_PROXY=true
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${DOCKER_APPDATA_PATH}/pocket-id:/app/data
    networks:
      - traefik_socket_net
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pocket-id.rule=Host(`${POCKET_ID_HOST}`)"
      - "traefik.http.routers.pocket-id.entrypoints=websecure"
      - "traefik.http.routers.pocket-id.tls.certresolver=cloudflare"
      - "traefik.http.routers.pocket-id.middlewares=allow-admin-apps@file"
      - "traefik.http.services.pocket-id.loadbalancer.server.port=1411"
      # Pocket ID is part of the authentication control plane; update it deliberately.
      - "com.centurylinklabs.watchtower.enable=false"

networks:
  traefik_socket_net:
    external: true
