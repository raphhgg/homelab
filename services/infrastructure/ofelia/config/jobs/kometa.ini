[job-exec "kometa-test"]
schedule = * * * * *
container = kometa
command = echo "Kometa scheduled job test at $(date)"

; [job-exec "kometa-full-run"]
; schedule = 0 6 * * *
; container = kometa
; command = python kometa.py --run

; [job-exec "kometa-collections-only"]
; schedule = 0 12 * * *
; container = kometa
; command = python kometa.py --run --collections-only

; [job-exec "kometa-weekly-full"]
; schedule = 0 3 * * 0
; container = kometa
; command = python kometa.py --run --collections --operations