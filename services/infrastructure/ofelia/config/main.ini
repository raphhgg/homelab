# [global]
# Main configuration file

# You need to manually include each job file:
# include = /opt/ofelia/config/jobs/kometa.ini

; [job-exec "kometa-test"]
; schedule = @every 1m
; container = kometa
; command = /bin/sh -c 'echo "Kometa scheduled job test at: $(date)"'

[job-exec "plex-trakt-sync"]
schedule = @every 1m
container = plex-trakt-sync
command = plextraktsync sync

; [job-exec "kometa-full-run"]
; schedule = 0 6 * * *
; container = kometa
; command = python kometa.py --run

; [job-exec "kometa-collections-only"]
; schedule = 0 12 * * *
; container = kometa
; command = python kometa.py --run --collections-only

; [job-exec "kometa-weekly-full"]
; schedule = 0 3 * * 0
; container = kometa
; command = python kometa.py --run --collections --operations