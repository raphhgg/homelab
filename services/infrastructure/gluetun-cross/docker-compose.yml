version: '3.8'

services:
  gluetun-cross:
    image: qmcgaw/gluetun:latest
    container_name: gluetun-cross
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8890:8888/tcp # Gluetun-cross control server
      - 8084:8084 # qbit-cross web UI
    environment:
      # VPN
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard

      # PIA Credentials (used for port forwarding authentication)
      - OPENVPN_USER=${PIA_USERNAME}
      - OPENVPN_PASSWORD=${PIA_PASSWORD}

      # Port Forwarding
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=private internet access
      - SERVER_NAMES=stockholm403
      # Auto-update qBittorrent with forwarded port
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8084/api/v2/app/setPreferences 2>&1'
      - VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh -c 'wget -O- --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8084/api/v2/app/setPreferences 2>&1'

      # General
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DOT_HEALTH_TARGET_ADDRESS=1.1.1.1:53
    volumes:
      - ${DOCKER_APPDATA_PATH}/gluetun-cross:/gluetun
      - ${DOCKER_APPDATA_PATH}/gluetun-cross/wg0.conf:/gluetun/wireguard/wg0.conf:ro
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - main

networks:
  main:
    external: true
