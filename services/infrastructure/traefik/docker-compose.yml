services:
  traefik-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: traefik-proxy
    environment:
      - CONTAINERS=1
      - EVENTS=1
      - NETWORKS=1
      - INFO=1
      - PING=1
      - VERSION=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket_net
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  traefik:
    image: traefik:v3.6.9
    container_name: traefik
    depends_on:
      - traefik-proxy
    environment:
      - DOCKER_HOST=tcp://traefik-proxy:2375
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    ports:
      - 80:80
      - 443:443
    volumes:
      - ${DOCKER_APPDATA_PATH}/traefik/config/traefik.yml:/etc/traefik/traefik.yml:ro
      - ${DOCKER_APPDATA_PATH}/traefik/config/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ${DOCKER_APPDATA_PATH}/traefik/acme:/letsencrypt
    networks:
      - socket_net
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  whoami:
    image: traefik/whoami:v1.11
    container_name: traefik-whoami
    networks:
      - socket_net
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.raphh.me`)"
      - "traefik.http.routers.whoami.entrypoints=websecure"
      - "traefik.http.routers.whoami.tls.certresolver=cloudflare"
      - "traefik.http.routers.whoami.middlewares=allow-default-apps@file"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  socket_net:
