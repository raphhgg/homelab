version: '3.8'

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    security_opt:
      - no-new-privileges:true
    ports:
      - 8888:8000  # Gluetun control server
      - 8090:8080  # SABnzbd web UI
      - 8080:8081  # qbit-main web UI
      # Port forwarding ports are dynamic from PIA
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # VPN
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard

      # PIA Credentials (used for port forwarding authentication)
      - OPENVPN_USER=${PIA_USERNAME}
      - OPENVPN_PASSWORD=${PIA_PASSWORD}

      # Port Forwarding
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=private internet access
      - SERVER_NAMES=zurich406
      # Auto-update qBittorrent with forwarded port (only qbit-main now, qbit-cross moved to gluetun-cross)
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8081/api/v2/app/setPreferences 2>&1'
      - VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh -c 'wget -O- --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8081/api/v2/app/setPreferences 2>&1'
    dns:
      - 1.1.1.1
      - 1.0.0.1
    volumes:
      - ${DOCKER_APPDATA_PATH}/gluetun:/gluetun
      - ${DOCKER_APPDATA_PATH}/gluetun/wg0.conf:/gluetun/wireguard/wg0.conf:ro
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=1
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - main

networks:
  main:
    external: true
