version: '3.8'

services:
  cronicle:
    image: cronicle/cronicle:edge
    container_name: cronicle
    hostname: cronicle
    networks:
      - main
      - socket_proxy
    ports:
      - 3012:3012
    command: manager
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DOCKER_HOST=${DOCKER_HOST}
      - CRONICLE_base_app_url=${SERVER_BASE_URL}:3012
      - TMP=/opt/cronicle/tmp
      - TMPDIR=/opt/cronicle/tmp
    volumes:
      - ${DOCKER_APPDATA_PATH}/cronicle/data:/opt/cronicle/data:rw
      - ${DOCKER_APPDATA_PATH}/cronicle/logs:/opt/cronicle/logs:rw
      - ${DOCKER_APPDATA_PATH}/cronicle/plugins:/opt/cronicle/plugins:rw
      - ${DOCKER_APPDATA_PATH}/cronicle/tmp:/opt/cronicle/tmp:rw
      - /usr/local/bin/docker:/usr/bin/docker:ro
    restart: always

networks:
  main:
    external: true
  socket_proxy:
    external: true
