version: '3.8'

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: docker-proxy
    networks:
      socket_proxy:
        ipv4_address: 172.26.0.22
    ports:
      - 2375:2375
    environment:
      # Essential permissions for GitHub Actions deployment
      - CONTAINERS=1    # Create/manage containers
      - IMAGES=1        # Pull/push/build images
      - BUILD=1         # Docker build operations
      - POST=1          # Create resources
      - DELETE=1        # Delete containers/networks/volumes (CRITICAL for docker-compose)
      - EXEC=1          # Execute commands in containers
      - EVENTS=1        # Read container events
      - SYSTEM=1        # System-level operations

      # Docker Compose requirements
      - NETWORKS=1      # Create/manage networks (CRITICAL for docker-compose)
      - VOLUMES=1       # Create/manage volumes (CRITICAL for docker-compose)

      # Additional permissions that may be needed
      - SERVICES=1      # Docker Swarm services
      - TASKS=1         # Docker Swarm tasks
      - SECRETS=1       # Docker secrets
      - CONFIGS=1       # Docker configs

      # Dockhand permissions
      - INFO=1          # Docker system info
      - VERSION=1       # Docker version info
      - TASKS=1         # Docker Swarm tasks
      
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true
    security_opt:
      - no-new-privileges:true
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  socket_proxy:
    external: true