version: '3.8'
services:
  github-runner:
    image: myoung34/github-runner:latest
    container_name: github-actions-runner
    restart: always
    networks:
      - socket_proxy
    environment:
      PUID: ${PUID} 
      PGID: ${PGID} 
      UMASK: ${UMASK}
      TZ: ${TZ}

      # Repository configuration
      REPO_URL: "https://github.com/raaphhh/dotfiles"
      ACCESS_TOKEN: "${GH_PAT_TOKEN}"

      RUNNER_NAME: "ds423plus-runner-dotfiles"

      # Required for persistence
      CONFIGURED_ACTIONS_RUNNER_FILES_DIR: /runner/data

      # Runner configuration
      LABELS: "synology,dotfiles,self-hosted"
      RUNNER_WORKDIR: "/tmp/runner/work"
      RUNNER_SCOPE: "repo"
      EPHEMERAL: "false"
      DISABLE_AUTOMATIC_DEREGISTRATION: "true"

      # Debug options
      DEBUG: "1"

      # Configure Docker to use the socket proxy
      DOCKER_HOST: "tcp://docker-proxy:2375"
    volumes:
      - ${DOCKER_APPDATA_PATH}/github-runner/data:/tmp/runner/data
      - ${DOCKER_APPDATA_PATH}/github-runner/tmp/runner:/tmp/runner
      - $HOME/github/dotfiles:/github/dotfiles
    security_opt:
      - no-new-privileges:true
    # Logging configuration for better debugging
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  socket_proxy:
    external: true