services:
  pihole:
    container_name: pihole
    hostname: pihole
    image: pihole/pihole
    env_file:
      - ../../.env
    networks:
      dns_network:
        ipv4_address: 172.23.0.7
      main: null
    ports:
      - 53:53/tcp
      - 53:53/udp
      - 85:80/tcp
      - 440:443/tcp
    environment:
      TZ: Europe/Brussels
      WEBPASSWORD: ${PIHOLE_WEBPASSWORD}
      PIHOLE_DNS_: 172.23.0.8#5053
    volumes:
      - ${DOCKER_PATH}/pihole/etc-pihole:/etc/pihole/
      - ${DOCKER_PATH}/pihole/etc-dnsmasq.d:/etc/dnsmasq.d/
    restart: unless-stopped
  unbound:
    container_name: unbound
    image: mvance/unbound
    networks:
      dns_network:
        ipv4_address: 172.23.0.8
    volumes:
      - ${DOCKER_PATH}/unbound:/opt/unbound/etc/unbound
    ports:
      - 5053:53/tcp
      - 5053:53/udp
    healthcheck:
      test:
        - NONE
    restart: unless-stopped
networks:
  dns_network:
    driver: bridge
    name: dns_network
    ipam:
      config:
        - subnet: 172.23.0.0/16
  main:
    external: true
