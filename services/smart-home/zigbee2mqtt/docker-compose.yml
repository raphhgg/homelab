services:
  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt
    container_name: zigbee2mqtt
    networks:
      - smart_home
      - traefik_socket_net
    ports:
      - 127.0.0.1:8090:8080
    volumes:
      - ${DOCKER_APPDATA_PATH}/zigbee2mqtt/data:/app/data
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_socket_net"
      - "traefik.http.routers.zigbee2mqtt.rule=Host(`${ZIGBEE2MQTT_HOST}`)"
      - "traefik.http.routers.zigbee2mqtt.entrypoints=websecure"
      - "traefik.http.routers.zigbee2mqtt.tls.certresolver=cloudflare"
      - "traefik.http.routers.zigbee2mqtt.middlewares=allow-iot-enabled-apps@file,tinyauth@file"
      - "traefik.http.services.zigbee2mqtt.loadbalancer.server.port=8080"
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  smart_home:
    external: true
  traefik_socket_net:
    external: true
