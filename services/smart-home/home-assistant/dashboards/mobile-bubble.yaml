                          ? 'rgba(' + entity.attributes.rgb_color[0] + ',' + entity.attributes.rgb_color[1] + ',' + entity.attributes.rgb_color[2] + ',0.3)'
                          : 'var(--accent-color)')
                        : ''
                    };
                  }

          - type: horizontal-stack
            cards:
              - type: custom:bubble-card
                card_type: button
                button_type: slider
                entity: light.reading
                name: Reading
                icon: mdi:desk-lamp
                show_state: true
                card_layout: large
                styles: |
                  .bubble-button-card-container {
                    background-color: ${
                      state === 'on'
                        ? (entity.attributes.rgb_color
                          ? 'rgba(' + entity.attributes.rgb_color[0] + ',' + entity.attributes.rgb_color[1] + ',' + entity.attributes.rgb_color[2] + ',0.3)'
                          : 'var(--accent-color)')
                        : ''
                    };
                  }

              - type: custom:bubble-card
                card_type: button
                button_type: slider
                entity: light.floor
                name: Floor
                icon: mdi:candle
                show_state: true
                card_layout: large
                styles: |
                  .bubble-button-card-container {
                    background-color: ${
                      state === 'on'
                        ? (entity.attributes.rgb_color
                          ? 'rgba(' + entity.attributes.rgb_color[0] + ',' + entity.attributes.rgb_color[1] + ',' + entity.attributes.rgb_color[2] + ',0.3)'
                          : 'var(--accent-color)')
                        : ''
                    };
                  }

          - type: custom:bubble-card
            card_type: separator
            name: Scenes
            icon: mdi:palette

          - type: custom:bubble-card
            card_type: button
            button_type: name
            entity: scene.home_zone_0_day_time_calm
            name: Day Time Calm
            icon: mdi:white-balance-sunny
            card_layout: large
            tap_action:
              action: call-service
              service: scene.turn_on
              target:
                entity_id: scene.home_zone_0_day_time_calm
            styles: |
              .bubble-button-card-container {
                background-color: rgba(255, 180, 50, 0.15);
              }
              .bubble-icon {
                color: rgb(255, 180, 50) !important;
              }

          - type: custom:bubble-card
            card_type: button
            button_type: name
            entity: scene.living_zone_1_evening_mode
            name: Evening Mode
            icon: mdi:weather-sunset
            card_layout: large
            tap_action:
              action: call-service
              service: scene.turn_on
              target:
                entity_id: scene.living_zone_1_evening_mode
            styles: |
              .bubble-button-card-container {
                background-color: rgba(255, 87, 34, 0.15);
              }
              .bubble-icon {
                color: rgb(255, 87, 34) !important;
              }

      # --- Bedroom Pop-up ---
      - type: vertical-stack
        cards:
          - type: custom:bubble-card
            card_type: pop-up
