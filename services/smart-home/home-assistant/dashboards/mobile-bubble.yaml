                          ? 'rgba(' + entity.attributes.rgb_color[0] + ',' + entity.attributes.rgb_color[1] + ',' + entity.attributes.rgb_color[2] + ',0.3)'
                          : 'var(--accent-color)')
                        : ''
                    };
                  }

              - type: custom:bubble-card
                card_type: button
                button_type: slider
                entity: light.nightstand
                name: Nightstand
                icon: mdi:lamp
                show_state: true
                card_layout: large
                styles: |
                  .bubble-button-card-container {
                    background-color: ${
                      state === 'on'
                        ? (entity.attributes.rgb_color
                          ? 'rgba(' + entity.attributes.rgb_color[0] + ',' + entity.attributes.rgb_color[1] + ',' + entity.attributes.rgb_color[2] + ',0.3)'
                          : 'var(--accent-color)')
                        : ''
                    };
                  }

          - type: horizontal-stack
            cards:
              - type: custom:bubble-card
                card_type: button
                button_type: slider
                entity: light.desk
                name: Desk
                icon: mdi:desk-lamp
                show_state: true
                card_layout: large
                styles: |
                  .bubble-button-card-container {
                    background-color: ${
                      state === 'on'
                        ? (entity.attributes.rgb_color
                          ? 'rgba(' + entity.attributes.rgb_color[0] + ',' + entity.attributes.rgb_color[1] + ',' + entity.attributes.rgb_color[2] + ',0.3)'
                          : 'var(--accent-color)')
                        : ''
                    };
                  }

              - type: custom:bubble-card
                card_type: button
                button_type: name
                name: ""
                styles: |
                  .bubble-button-card-container {
                    opacity: 0;
                  }

          - type: custom:bubble-card
            card_type: separator
            name: Scenes
            icon: mdi:palette

          - type: custom:bubble-card
            card_type: button
            button_type: name
            entity: scene.bedroom_room_1_evening_mode
            name: Evening Mode
            icon: mdi:weather-night
            card_layout: large
            tap_action:
              action: call-service
              service: scene.turn_on
              target:
                entity_id: scene.bedroom_room_1_evening_mode
            styles: |
              .bubble-button-card-container {
                background-color: rgba(156, 39, 176, 0.15);
              }
              .bubble-icon {
                color: rgb(156, 39, 176) !important;
              }

      # --- Kitchen Pop-up ---
      - type: vertical-stack
        cards:
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#kitchen'
            name: Kitchen
            icon: mdi:stove
            entity: light.kitchen
            bg_opacity: 75
            bg_blur: 14
            shadow_opacity: 0

          - type: custom:bubble-card
            card_type: separator
            name: Lights
            icon: mdi:lightbulb-group

          - type: custom:bubble-card
            card_type: button
            button_type: slider
            entity: light.kitchen
            name: Kitchen
            icon: mdi:stove
            show_state: true
            card_layout: large
            styles: |
              .bubble-button-card-container {
                background-color: ${
                  state === 'on'
                    ? (entity.attributes.rgb_color
                      ? 'rgba(' + entity.attributes.rgb_color[0] + ',' + entity.attributes.rgb_color[1] + ',' + entity.attributes.rgb_color[2] + ',0.3)'
                      : 'var(--accent-color)')
                    : ''
                };
              }

      # --- Media Pop-up ---
      - type: vertical-stack
        cards:
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#media'
            name: Media
            icon: mdi:television
            bg_opacity: 75
            bg_blur: 14
            shadow_opacity: 0

          - type: custom:bubble-card
            card_type: media-player
            entity: media_player.media_player
            name: Apple TV 4K
            icon: mdi:apple
            card_layout: large
            styles: |
              .bubble-icon-container {
                animation: ${state === 'playing' ? 'pulse' : 'none'} 2s infinite;
              }
              @keyframes pulse {
                from { transform: scale(1); }
                10% { transform: scale(1.1); }
                20% { transform: scale(1); }
                100% { transform: scale(1); }
              }

          - type: custom:bubble-card
            card_type: separator
            name: Library
            icon: mdi:filmstrip

          # Tautulli - Active Plex streams
          # Requires: Tautulli HA integration
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.tautulli_watching
            name: Plex Streams
            icon: mdi:plex
            show_state: true
            card_layout: large
            styles: |
              .bubble-button-card-container {
                background-color: ${
                  state > 0 ? 'rgba(229, 160, 13, 0.2)' : ''
                };
              }

          # Sonarr - Upcoming episodes
          # Requires: Sonarr HA integration
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.sonarr_upcoming
            name: Upcoming Episodes
            icon: mdi:television-classic
            show_state: true
            card_layout: large

          # Radarr - Upcoming movies
          # Requires: Radarr HA integration
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.radarr_upcoming
            name: Upcoming Movies
            icon: mdi:filmstrip
            show_state: true
            card_layout: large

      # --- Infrastructure Pop-up ---
      - type: vertical-stack
