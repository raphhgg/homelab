            name: Lights
            icon: mdi:lightbulb-group

          - type: custom:bubble-card
            card_type: button
            button_type: slider
            entity: light.living_room
            name: All Lights
            icon: mdi:lightbulb-group
            show_state: true
            card_layout: large
            styles: |
              .bubble-button-card-container {
                background-color: ${
                  state === 'on'
                    ? (entity.attributes.rgb_color
                      ? 'rgba(' + entity.attributes.rgb_color[0] + ',' + entity.attributes.rgb_color[1] + ',' + entity.attributes.rgb_color[2] + ',0.3)'
                      : 'var(--accent-color)')
                    : ''
