            card_type: pop-up
            hash: '#infra'
            name: Infrastructure
            icon: mdi:server
            bg_opacity: 75
            bg_blur: 14
            shadow_opacity: 0

          - type: custom:bubble-card
            card_type: separator
            name: Services
            icon: mdi:check-network

          # Uptime Kuma monitors
          # Requires: Uptime Kuma HA integration
          # Replace entity IDs with your actual Uptime Kuma binary_sensor entities
          - type: horizontal-stack
            cards:
              - type: custom:bubble-card
                card_type: button
                button_type: state
                entity: binary_sensor.uptime_kuma_plex
                name: Plex
                icon: mdi:plex
                show_state: true
                card_layout: large
                styles: |
                  .bubble-button-card-container {
                    background-color: ${
                      state === 'on' ? 'var(--success-color)' : 'var(--error-color)'
                    };
                  }
                  .bubble-icon {
                    color: ${state === 'on' ? 'var(--success-color)' : 'var(--error-color)'} !important;
                    opacity: 0.6 !important;
                  }

              - type: custom:bubble-card
                card_type: button
                button_type: state
                entity: binary_sensor.uptime_kuma_home_assistant
                name: HA
                icon: mdi:home-assistant
                show_state: true
                card_layout: large
                styles: |
                  .bubble-button-card-container {
                    background-color: ${
                      state === 'on' ? 'var(--success-color)' : 'var(--error-color)'
                    };
                  }
                  .bubble-icon {
                    color: ${state === 'on' ? 'var(--success-color)' : 'var(--error-color)'} !important;
                    opacity: 0.6 !important;
                  }

          - type: horizontal-stack
            cards:
              - type: custom:bubble-card
                card_type: button
                button_type: state
                entity: binary_sensor.uptime_kuma_sonarr
                name: Sonarr
                icon: mdi:television-classic
                show_state: true
                card_layout: large
                styles: |
                  .bubble-button-card-container {
                    background-color: ${
                      state === 'on' ? 'var(--success-color)' : 'var(--error-color)'
                    };
                  }
                  .bubble-icon {
                    color: ${state === 'on' ? 'var(--success-color)' : 'var(--error-color)'} !important;
                    opacity: 0.6 !important;
                  }

              - type: custom:bubble-card
                card_type: button
                button_type: state
                entity: binary_sensor.uptime_kuma_radarr
                name: Radarr
                icon: mdi:filmstrip
                show_state: true
                card_layout: large
                styles: |
                  .bubble-button-card-container {
                    background-color: ${
                      state === 'on' ? 'var(--success-color)' : 'var(--error-color)'
                    };
                  }
                  .bubble-icon {
                    color: ${state === 'on' ? 'var(--success-color)' : 'var(--error-color)'} !important;
                    opacity: 0.6 !important;
                  }

          - type: custom:bubble-card
            card_type: separator
            name: Storage
            icon: mdi:harddisk

          # Scrutiny - Disk health
          # Requires: Scrutiny REST sensor
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.scrutiny_disk_health
            name: Disk Health
            icon: mdi:harddisk
            show_state: true
            card_layout: large
            styles: |
              .bubble-button-card-container {
                background-color: ${
                  state === 'passed' ? 'var(--success-color)' :
                  state === 'warning' ? 'var(--warning-color)' :
                  'var(--error-color)'
                };
              }
              .bubble-icon {
                color: ${
                  state === 'passed' ? 'var(--success-color)' :
                  state === 'warning' ? 'var(--warning-color)' :
                  'var(--error-color)'
                } !important;
                opacity: 0.6 !important;
              }

          - type: custom:bubble-card
            card_type: separator
            name: Security
            icon: mdi:shield

          - type: custom:bubble-card
            card_type: button
            button_type: switch
            entity: switch.doorbell
            name: Doorbell
            icon: mdi:bell-ring
            show_state: true
            card_layout: large

      # ============================================================
      # HORIZONTAL BUTTONS STACK (must be last card in view)
      # ============================================================
      - type: custom:bubble-card
        card_type: horizontal-buttons-stack
        auto_order: false
        1_link: '#living'
        1_name: Living
        1_icon: mdi:sofa
        1_entity: light.living_zone
        2_link: '#bedroom'
        2_name: Bedroom
        2_icon: mdi:bed
        2_entity: light.bedroom_lights
        3_link: '#kitchen'
        3_name: Kitchen
        3_icon: mdi:stove
        3_entity: light.kitchen
        4_link: '#media'
        4_name: Media
        4_icon: mdi:television
        4_entity: media_player.media_player
        5_link: '#infra'
        5_name: Infra
        5_icon: mdi:server
