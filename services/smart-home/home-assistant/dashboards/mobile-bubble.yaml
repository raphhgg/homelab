# Bubble Card Mobile Dashboard
# Paste this into HA > Dashboard > Edit > Raw Configuration Editor
#
# Prerequisites:
# - Bubble Card installed via HACS
# - Optional integrations: Tautulli, Sonarr, Radarr, Uptime Kuma, Scrutiny

views:
  - title: Home
    path: home
    cards:
      # ============================================================
      # VISIBLE CARDS (main view - always visible)
      # ============================================================

      # --- Weather ---
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: weather.forecast_home
        name: Weather
        show_state: true
        scrolling_effect: false
        card_layout: large-2-rows
        sub_button:
          - icon: mdi:thermometer-low
            entity: sensor.forecast_low_today
            show_background: false
            show_state: true
            show_icon: true
          - icon: mdi:weather-windy
            entity: weather.forecast_home
            attribute: wind_speed
            show_background: false
            show_attribute: true
            show_icon: true
          - icon: mdi:thermometer-high
            entity: sensor.forecast_high_today
            show_background: false
            show_state: true
            show_icon: true
          - icon: mdi:weather-pouring
            entity: sensor.forecast_precipitation_today
            show_background: false
            show_state: true
            show_icon: true
        styles: |
          .bubble-button-card-container {
            min-height: 80px;
          }
          .bubble-icon-container {
            box-sizing: border-box;
            padding: 8px;
          }
          .bubble-name {
            border-radius: 2px;
            background-color: ${
              hass.states[entity].attributes.temperature < 10
                ? 'var(--info-color)'
                : hass.states[entity].attributes.temperature > 35
                ? 'var(--error-color)'
                : hass.states[entity].attributes.temperature > 28
                ? 'var(--warning-color)'
                : ''
            };
            height: 20px;
            margin-left: -4px;
            padding: 0 4px;
            width: fit-content;
            z-index: 1;
          }
          .bubble-name::after {
            content: " · ${hass.states[entity].attributes.temperature}°C";
          }
          .bubble-state {
            height: 20px;
          }
          .rows-2 .bubble-sub-button-container {
            gap: 4px 8px !important;
          }
          .bubble-sub-button {
            padding: 0 4px;
          }
          .bubble-sub-button-1 {
            background-color: ${
              hass.states['sensor.forecast_low_today'].state < 5
                ? 'var(--info-color)'
                : ''
            };
          }
          .bubble-sub-button-2 {
            background-color: ${
              hass.states[entity].attributes.wind_speed > 50
                ? 'var(--error-color)'
                : hass.states[entity].attributes.wind_speed > 20
                ? 'var(--warning-color)'
                : ''
            };
          }
          .bubble-sub-button-3 {
            background-color: ${
              hass.states['sensor.forecast_high_today'].state > 35
                ? 'var(--error-color)'
                : hass.states['sensor.forecast_high_today'].state > 28
                ? 'var(--warning-color)'
                : ''
            };
          }
          .bubble-sub-button-4 {
            background-color: ${
              hass.states['sensor.forecast_precipitation_today'].state > 0
                ? 'var(--info-color)'
                : ''
            };
          }

      # --- Apple TV ---
      - type: custom:bubble-card
        card_type: media-player
        entity: media_player.media_player
        name: Apple TV 4K
        icon: mdi:apple
        card_layout: large-2-rows
        hide:
          power_button: true
        styles: |
          .bubble-media-player-container {
            min-height: 80px;
            background-color: ${
              state === 'playing'
                ? 'rgba(var(--rgb-accent-color, 230, 145, 56), 0.15)'
                : ''
            };
          }

      # ============================================================
      # POP-UPS (must come after all visible cards)
      # ============================================================

      # --- Living Room Pop-up ---
      - type: vertical-stack
