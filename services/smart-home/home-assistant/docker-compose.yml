services:
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: home-assistant
    network_mode: host
    ports:
      - 8123:8123
    environment:
      - TZ=${TZ}
      - UMASK=${UMASK}
    dns:
      - 10.10.2.101
      - 1.1.1.1
    volumes:
      - ${DOCKER_APPDATA_PATH}/home-assistant:/config
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
