services:
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: home-assistant
    network_mode: host
    ports:
      - 8123:8123
    environment:
      - TZ=${TZ}
      - UMASK=${UMASK}
    dns:
      - ${HOME_ASSISTANT_DNS_PRIMARY}
      - ${HOME_ASSISTANT_DNS_SECONDARY}
    volumes:
      - ${DOCKER_APPDATA_PATH}/home-assistant:/config
      - ${DOCKER_APPDATA_PATH}/plex/config/Preferences.xml:/run/secrets/plex_preferences.xml:ro
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
