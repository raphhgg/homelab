services:
  kometa:
    image: kometateam/kometa:nightly
    container_name: kometa
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - KOMETA_DEBUG=true
      - KOMETA_CONFIG=/config/config.yml
    volumes:
      # Config from dedicated git repo in appdata
      - ${DOCKER_APPDATA_PATH}/kometa/config:/config:rw
      # Runtime data from appdata (logs, overlays, assets, cache)
      - ${DOCKER_APPDATA_PATH}/kometa:/data:rw
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - main

networks:
  main:
    external: true
