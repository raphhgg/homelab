services:
  kometa:
    image: kometateam/kometa:nightly
    container_name: kometa
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - KOMETA_DEBUG=true
      - KOMETA_CONFIG=/config/config.yml
    volumes:
      # Entire appdata directory as /config (git repo with runtime files gitignored)
      - ${DOCKER_APPDATA_PATH}/kometa:/config:rw
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - main

networks:
  main:
    external: true
