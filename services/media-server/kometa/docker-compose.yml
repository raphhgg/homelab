services:
  kometa:
    image: kometateam/kometa:nightly@sha256:a92f2ff823e8e203d9d408ad88cd47ef9de56c25cb475c0579be0ded613a6be6  # 2.5.3-build13, pinned 2026-10-16
    container_name: kometa
    user: "${PUID}:${PGID}"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - KOMETA_DEBUG=true
      - KOMETA_TIMES=05:00|06:00|10:00|19:00
    volumes:
      - ${DOCKER_APPDATA_PATH}/kometa:/config:rw
      - ${DOCKER_APPDATA_PATH}/umtk/kometa:/umtk-collections:ro
    restart: always
    deploy:
      resources:
        reservations:
          memory: 512M
          cpus: "0.5"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - media

  kometa-letterboxd-rss-sync:
    build: ./letterboxd-rss-sync
    container_name: kometa-letterboxd-rss-sync
    network_mode: host
    environment:
      - TZ=${TZ}
      - LETTERBOXD_RSS_URL=https://letterboxd.com/raphh11/rss/
      - KOMETA_CONFIG_PATH=/config/config.yml
      - SYNC_INTERVAL_MINUTES=30
      - PLEX_URL=http://127.0.0.1:32400
    volumes:
      - ${DOCKER_APPDATA_PATH}/kometa:/config:rw
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  media:
    external: true
