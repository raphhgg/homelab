settings:
  run_order:
  - operations
  - metadata
  - collections
  - overlays
  cache: true
  cache_expiration: 60
  asset_directory: data/assets
  asset_folders: true
  asset_depth: 0
  create_asset_folders: true
  prioritize_assets: false
  dimensional_asset_rename: false
  download_url_assets: false
  show_missing_season_assets: false
  show_missing_episode_assets: false
  show_asset_not_needed: true
  sync_mode: sync
  minimum_items: 1
  default_collection_order: year.desc
  delete_below_minimum: true
  delete_not_scheduled: false
  run_again_delay: 2
  missing_only_released: false
  only_filter_missing: false
  show_unmanaged: true
  show_unconfigured: true
  show_filtered: false
  show_options: true
  show_missing: true
  show_missing_assets: true
  save_report: false
  tvdb_language: eng
  ignore_ids:
  ignore_imdb_ids:
  item_refresh_delay: 0
  playlist_sync_to_users: all
  playlist_exclude_users:
  playlist_report: false
  verify_ssl: true
  custom_repo:
  overlay_artwork_filetype: jpg
  overlay_artwork_quality: 75
  show_unfiltered: false

plex:
  url: http://10.10.2.2:32400
  token: 23DyfRJ6SjpxwHMYkN5K
  timeout: 60
  db_cache:
  clean_bundles: false
  empty_trash: false
  optimize: false
  verify_ssl:

# https://kometa.wiki/en/latest/config/sonarr/
sonarr:
  url: http://10.10.2.2:8988
  token: e3d546a29d164cfb9c77e95adf2a2c35

  # Add missing shows from collections.
  add_missing: false
  # Add existing shows from collections (shows that are in Plex but are not already in Sonarr)
  add_existing: false
  # Upgrade existing shows to match collection quality profile.
  upgrade_existing: false
  # Apply monitor settings to existing shows.
  monitor_existing: false

  # Default root folder path for new shows.
  root_folder_path: /data/medias/tvshows/tvshows

  # Monitor setting to apply when adding shows.
  # - first: All episodes of the first season
  monitor: none

  # Quality profile for new shows.
  quality_profile: 2160p Quality (Season Pack Only)
  # Language profile for new shows.
  language_profile: English
  # Series type when adding new shows.
  series_type: standard
  # Whether to use season folders.
  season_folder: true
  # Default tags for new shows.
  tag:

  # Start search for missing episodes when adding shows.
  search: false
  # Start search for unmet cutoff episodes.
  cutoff_search: false

  # When using add_existing or sonarr_add_all (Adds every item in the library to Sonarr) Convert this part of the path to sonarr_path.
  sonarr_path:
  # When using add_existing or sonarr_add_all (Adds every item in the library to Sonarr) Convert the plex_path part of the path to this.
  plex_path:

  ignore_cache: false

