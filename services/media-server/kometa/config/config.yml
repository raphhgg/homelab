libraries:

  ### MOVIE LIBRARY ###
  Movies:
    report_path: /data/missing/Movies_report.yml
    collection_files:
    - file: /config-repo/collections/movies/00_radarr_tags_sync.yml
    - file: /config-repo/collections/movies/01_genres.yml
    - file: /config-repo/collections/movies/02_languages.yml
    - file: /config-repo/collections/movies/03_decades.yml
    - file: /config-repo/collections/movies/04_quality.yml
    - file: /config-repo/collections/movies/05_people.yml
    - file: /config-repo/collections/movies/06_letterboxd_franchises.yml
    - file: /config-repo/collections/movies/07_letterboxd_others.yml

    # MOVIE OVERLAYS 
    remove_overlays: false
    reapply_overlays: true
    overlay_files:
    - default: resolution
    - default: audio_codec
    - default: mediastinger
    - default: runtimes
    - default: ratings
      template_variables:
        rating1: user
        rating1_image: rt_tomato
        rating1_font: /config-repo/custom_fonts/Adlib.ttf
        rating1_font_size: 63

        rating2: critic
        rating2_image: imdb
        rating2_font: /config-repo/custom_fonts/Impact.ttf
        rating2_font_size: 70

        rating3: audience
        rating3_image: letterboxd
        rating3_font: /config-repo/custom_fonts/Impact.ttf
        rating3_font_size: 70
        rating3_style: ''

        horizontal_position: right
    - default: network
    - default: streaming
    - default: studio
    - default: video_format
    - default: languages
      template_variables:
        languages:
        - en
        - fr
        use_subtitles: true
        style: half
        vertical_position: top3

    # MOVIE OPERATIONS
    operations:
      mass_user_rating_update: mdb_tomatoes
      mass_critic_rating_update: imdb
      mass_audience_rating_update: mdb_letterboxd
      split_duplicates: false
      assets_for_all: false
      delete_collections:
        configured: false
        managed: true
    settings:
      asset_directory:
      - /data/assets/movies

  ### TV SHOWS LIBRARY ###
  TV Shows:
    report_path: /data/missing/TV_Shows_report.yml
    collection_files:
    - file: /config-repo/collections/tvshows/00_general.yml
    - file: /config-repo/collections/tvshows/00_sonarr_tags_sync.yml
    - file: /config-repo/collections/tvshows/01_genres.yml
    - file: /config-repo/collections/tvshows/02_languages.yml
    - file: /config-repo/collections/tvshows/03_dates.yml
    - file: /config-repo/collections/tvshows/04_quality.yml
    - file: /config-repo/collections/tvshows/06_favorites.yml


    # TV SHOWS OVERLAYS
    remove_overlays: false
    reapply_overlays: false
    overlay_files:
    - default: resolution
    - default: audio_codec
    - default: mediastinger
    - default: runtimes
      template_variables:
        builder_level: episode
      font: /config-repo/custom_fonts/Inter-Bold.ttf
    - default: ratings
      template_variables:
        rating1: user
        rating1_image: rt_tomato
        rating1_font: /config-repo/custom_fonts/Adlib.ttf
        rating1_font_size: 63

        rating2: critic
        rating2_image: imdb
        rating2_font: /config-repo/custom_fonts/Impact.ttf
        rating2_font_size: 70

        rating3: audience
        rating3_image: tmdb
        rating3_font: /config-repo/custom_fonts/Avenir_95_Black.ttf
        rating3_font_size: 70

        horizontal_position: right
    - default: streaming
    - default: video_format
    - default: languages
      template_variables:
        languages:
        - en
        - fr
        use_subtitles: true
        style: half
        vertical_position: top3

    # SEASON OVERLAYS
    - default: resolution
      template_variables:
        builder_level: season
    - default: audio_codec
      template_variables:
        builder_level: season
    - default: streaming
      template_variables:
        builder_level: season
    - default: video_format
      template_variables:
        builder_level: season
    - default: languages
      template_variables:
        builder_level: season
        languages:
        - en
        - fr
        use_subtitles: true
        style: half

    # EPISODE OVERLAYS
    - default: resolution
      template_variables:
        builder_level: episode
    - default: audio_codec
      template_variables:
        builder_level: episode
    - default: ratings
      template_variables:
        rating1: critic
        rating1_image: imdb
        rating1_font: /config-repo/custom_fonts/Impact.ttf
        rating1_font_size: 70

        rating2: audience
        rating2_image: tmdb
        rating2_font: /config-repo/custom_fonts/Avenir_95_Black.ttf
        rating2_font_size: 70

        horizontal_position: right
        builder_level: episode
    - default: video_format
      template_variables:
        builder_level: episode
    - default: episode_info
      template_variables:
        builder_level: episode
    - default: runtimes
      template_variables:
        builder_level: episode
    - default: languages
      template_variables:
        builder_level: episode
        languages:
        - en
        - fr
        use_subtitles: true
        style: half

    # TV SHOWS OPERATIONS
    operations:
      mass_user_rating_update: mdb_tomatoes
      mass_critic_rating_update: imdb
      mass_audience_rating_update: tmdb
      mass_episode_critic_rating_update: imdb
      mass_episode_audience_rating_update: tmdb
      split_duplicates: false
      assets_for_all: false
      delete_collections:
        configured: false
        managed: true
    settings:
      asset_directory:
      - /data/assets/tvshows

  ### SPORTS LIBRARY
  Sports:
    report_path: /data/missing/Sports_report.yml
    collection_files:
    - file: /config-repo/collections/sports/formula1/2025.yml
    metadata_files:
    - file: /config-repo/metadata/formula1/2025.yml

    # SPORTS OVERLAYS
    remove_overlays: false
    reapply_overlays: false
    overlay_files:
    - default: resolution
    - default: audio_codec
    - default: mediastinger
    - default: streaming
    - default: studio
    - default: video_format

    # SEASON OVERLAYS
    - default: resolution
      template_variables:
        builder_level: season
    - default: audio_codec
      template_variables:
        builder_level: season
    - default: streaming
      template_variables:
        builder_level: season
    - default: video_format
      template_variables:
        builder_level: season
    - default: network
      template_variables:
        builder_level: season
    - default: streaming
      template_variables:
        builder_level: season
    - default: studio
      template_variables:
        builder_level: season


    # EPISODE OVERLAYS
    - default: resolution
      template_variables:
        builder_level: episode
    - default: audio_codec
      template_variables:
        builder_level: episode
    - default: video_format
      template_variables:
        builder_level: episode
    - default: runtimes
      template_variables:
        builder_level: episode
    - default: network
      template_variables:
        builder_level: episode
    - default: streaming
      template_variables:
        builder_level: episode
    - default: studio
      template_variables:
        builder_level: episode

    operations:
      assets_for_all: true
    settings:
      asset_directory:
      - /data/assets/sports

playlist_files:
- default: playlist
  template_variables:
    libraries: Movies, TV Shows, Sports

settings:
  run_order:
  - operations
  - metadata
  - collections
  - overlays
  cache: true
  cache_expiration: 60
  asset_directory: data/assets
  asset_folders: true
  asset_depth: 0
  create_asset_folders: true
  prioritize_assets: false
  dimensional_asset_rename: false
  download_url_assets: false
  show_missing_season_assets: false
  show_missing_episode_assets: false
  show_asset_not_needed: true
  sync_mode: append
  minimum_items: 1
  default_collection_order: year.desc
  delete_below_minimum: true
  delete_not_scheduled: false
  run_again_delay: 2
  missing_only_released: false
  only_filter_missing: false
  show_unmanaged: true
  show_unconfigured: true
  show_filtered: false
  show_options: true
  show_missing: true
  show_missing_assets: true
  save_report: false
  tvdb_language: eng
  ignore_ids:
  ignore_imdb_ids:
  item_refresh_delay: 0
  playlist_sync_to_users: all
  playlist_exclude_users:
  playlist_report: false
  verify_ssl: true
  custom_repo:
  overlay_artwork_filetype: jpg
  overlay_artwork_quality: 75
  show_unfiltered: false

