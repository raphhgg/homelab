sonarr:
  url: http://10.10.2.2:8988
  token: e3d546a29d164cfb9c77e95adf2a2c35

  # Add missing shows from collections.
  add_missing: false
  # Add existing shows from collections (shows that are in Plex but are not already in Sonarr)
  add_existing: false
  # Upgrade existing shows to match collection quality profile.
  upgrade_existing: false
  # Apply monitor settings to existing shows.
  monitor_existing: false

  # Default root folder path for new shows.
  root_folder_path: /data/medias/tvshows/tvshows

  # Monitor setting to apply when adding shows.
  # - first: All episodes of the first season
  monitor: none

  # Quality profile for new shows.
  quality_profile: 2160p Quality (Season Pack Only)
  # Language profile for new shows.
  language_profile: English
  # Series type when adding new shows.
  series_type: standard
  # Whether to use season folders.
  season_folder: true
  # Default tags for new shows.
  tag:

  # Start search for missing episodes when adding shows.
  search: false
  # Start search for unmet cutoff episodes.
  cutoff_search: false

  # When using add_existing or sonarr_add_all (Adds every item in the library to Sonarr) Convert this part of the path to sonarr_path.
  sonarr_path:
  # When using add_existing or sonarr_add_all (Adds every item in the library to Sonarr) Convert the plex_path part of the path to this.
  plex_path:

  ignore_cache: false

