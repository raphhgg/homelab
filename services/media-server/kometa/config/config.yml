libraries:

  ### MOVIE LIBRARY ###
  Movies:
    report_path: /data/missing/Movies_report.yml
    collection_files:
    - file: /config-repo/collections/movies/00_recommended.yml
    - file: /config-repo/collections/movies/00_radarr_tags_sync.yml
    - file: /config-repo/collections/movies/01_genres.yml
    - file: /config-repo/collections/movies/02_languages.yml
    - file: /config-repo/collections/movies/03_decades.yml
    - file: /config-repo/collections/movies/04_quality.yml
    - file: /config-repo/collections/movies/05_directors.yml
    - file: /config-repo/collections/movies/06_actors.yml
    - file: /config-repo/collections/movies/07_franchises.yml
    - file: /config-repo/collections/movies/08_studios.yml
    - file: /config-repo/collections/movies/09_letterboxd_tiers.yml
    - file: /config-repo/collections/movies/10_letterboxd_bestof_year.yml

    # MOVIE OVERLAYS 
    remove_overlays: false
    reapply_overlays: false
    overlay_files:
    - file: /config-repo/custom_overlays/media_info.yml
      template_variables:
        use_gradient_top: true
        use_gradient_bottom: true
    - file: /config-repo/custom_overlays/audience_rating.yml
      template_variables:
        horizontal_offset: 75
        vertical_offset: 55
    - file: /config-repo/custom_overlays/letterboxd_rating.yml
      template_variables:
        horizontal_align: left
        vertical_align: bottom
        vertical_offset: 55
    - file: /config-repo/custom_overlays/runtimes.yml
      template_variables:
        vertical_align: bottom
        horizontal_align: center
        back_width: 240
        vertical_offset: 60
        font_size: 40


    # MOVIE OPERATIONS
    operations:
      mass_critic_rating_update: imdb
      mass_audience_rating_update: mdb_letterboxd
      split_duplicates: false
      assets_for_all: false
      delete_collections:
        configured: false
        managed: false
    settings:
      asset_directory:
      - /data/assets

  ### TV SHOWS LIBRARY ###
  TV Shows:
    report_path: /data/missing/TV_Shows_report.yml
    collection_files:
    - file: /config-repo/collections/tvshows/00_recommended.yml
    - file: /config-repo/collections/tvshows/00_sonarr_tags_sync.yml
    - file: /config-repo/collections/tvshows/01_genres.yml
    - file: /config-repo/collections/tvshows/02_languages.yml
    - file: /config-repo/collections/tvshows/03_dates.yml
    - file: /config-repo/collections/tvshows/04_quality.yml
    - file: /config-repo/collections/tvshows/05_type.yml
    - file: /config-repo/collections/tvshows/06_networks.yml
    - file: /config-repo/collections/tvshows/07_favorites.yml


    # TV SHOWS OVERLAYS
    remove_overlays: false
    reapply_overlays: false
    overlay_files:
    - file: /config-repo/custom_overlays/media_info.yml
      template_variables:
        use_gradient_top: true
        use_gradient_bottom: true
        use_codec: false
    - file: /config-repo/custom_overlays/audience_rating.yml
      template_variables:
        horizontal_offset: 75
        vertical_offset: 55
    - default: streaming
      template_variables:
        vertical_align: top
        horizontal_align: center
        vertical_offset: 115
        back_width: 0
        back_height: 0


    # SEASON OVERLAYS
    - file: /config-repo/custom_overlays/media_info.yml
      template_variables:
        builder_level: season
        use_gradient_top: false
        use_gradient_bottom: false
        

    # EPISODE OVERLAYS
    - file: /config-repo/custom_overlays/media_info.yml
      template_variables:
        builder_level: episode
        use_gradient_top: false
        use_gradient_bottom: false
    - file: /config-repo/custom_overlays/episode_audience_rating.yml
    - default: runtimes
      template_variables:
        builder_level: episode
        text: ""
        horizontal_align: center
        back_width: 300


    # TV SHOWS OPERATIONS
    operations:
      mass_user_rating_update: imdb
      mass_critic_rating_update: tmdb
      mass_audience_rating_update: imdb
      mass_episode_audience_rating_update: plex_imdb
      split_duplicates: false
      assets_for_all: false
      delete_collections:
        configured: false
        managed: false
    settings:
      asset_directory:
      - /data/assets

  ### MUSIC LIBRARY ###
  Music:
    report_path: /data/missing/Movies_report.yml
    collection_files:
    - file: /config-repo/collections/music/00_radarr_tags_sync.yml
    - file: /config-repo/collections/music/01_genres.yml

    operations:
      assets_for_all: true
    settings:
      asset_directory:
      - /data/assets

  ### SPORTS LIBRARY
  Sports:
    report_path: /data/missing/Sports_report.yml
    collection_files:
    - file: /config-repo/collections/sports/formula1/2025.yml
    metadata_files:
    - url: https://raw.githubusercontent.com/s0len/meta-manager-config/refs/heads/main/metadata-files/formula1-2025.yaml
    # - file: /config-repo/metadata/formula1/2025.yml

    # SPORTS OVERLAYS
    remove_overlays: false
    reapply_overlays: false
    overlay_files:
    - default: resolution

    # SEASON OVERLAYS
    - default: resolution
      template_variables:
        builder_level: season


    # EPISODE OVERLAYS
    - default: resolution
      template_variables:
        builder_level: episode
    - default: runtimes
      template_variables:
        builder_level: episode
        text: ""
        horizontal_align: center
        back_width: 300

    operations:
      assets_for_all: true
    settings:
      asset_directory:
      - /data/assets


