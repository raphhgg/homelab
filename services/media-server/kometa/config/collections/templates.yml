templates:
  # Used to map radarr tags to plex labels
  # - tag: the name of the tag in radarr
  radarr_tag:
    radarr_taglist: <<tag>>
    item_label: radarr <<tag>>
    sync_mode: sync
    build_collection: false
  
  # Used to separate collections in the Collections tab
  # - section_number: "02"
  separator:
    blank_collection: true
    sync_mode: sync
    sort_title: +<<section_number>>0_<<collection_name>>_Separator

  # Genre
  # - key: Radarr, Sonarr
  # - value: Horror, Drama etc
  # - section_number: "02"
  genre:
    plex_search:
      all:
        label: <<key>> <<value>>
    collection_order: year.desc
    label: <<collection_name>>
    sort_title: +<<section_number>>1_Genre_<<value>>_Collection
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: false

  # Recently Added In Collection
  # - key: Genre
  # - value: Horror, Drame etc
  # - section_number: "02"
  recently_added_in:
    smart_filter:
      any:
        collection: <<value>> Collection
      sort_by: added.desc
    label: <<collection_name>>
    sort_title: +<<section_number>>2_Recently_Added_in_<<key>>_<<value>>
    summary: "The latest additions in <<value>> <<key>>."
    sync_mode: sync
    visible_home: true
    visible_shared: true
    visible_library: true

  
  unwatched_recommendations_in:
    smart_filter:
      any:
        collection: <<value>> Collection
      sort_by: added.desc
    label: <<collection_name>>
    sort_title: +<<section_number>>2_Recently_Added_in_<<key>>_<<value>>
    sync_mode: sync
    visible_home: true
    visible_shared: true
    visible_library: true