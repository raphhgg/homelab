templates:
  # Recently Released TV Shows
  # - date_after: Date to filter from (format: YYYY-MM-DD or MM/DD/YYYY) (required)
  # - unplayed: true/false (optional, filters for unwatched episodes)
  # - exclude_collection: Collection(s) to exclude (optional)
  # - section_number: For sort_title ordering (default: "00")
  recently_released_shows:
    optional:
      - unplayed
      - exclude_collection
    default:
      section_number: "00"
    conditionals:
      collection_name_suffix:
        conditions:
          - unplayed: true
            value: " (Unwatched)"
        default: ""
    plex_search:
      all:
        episode_air_date.after: <<date_after>>
        episode_unplayed: <<unplayed>>
    filters:
      collection.not: <<exclude_collection>>
    collection_order: episode_release.desc
    label: <<collection_name>>
    summary: Recently Released Shows<<collection_name_suffix>> released after <<date_after>>.
    sort_title: +<<section_number>>_Recently_Released_Shows
    visible_home: true
    visible_shared: true
    visible_library: true
    sync_mode: sync

  # Recently Added TV Shows
  # - date_after: Date to filter from (format: YYYY-MM-DD or MM/DD/YYYY) (required)
  # - unplayed: true/false (optional, filters for unwatched episodes)
  # - exclude_collection: Collection(s) to exclude (optional)
  # - section_number: For sort_title ordering (default: "00")
  recently_added_shows:
    optional:
      - unplayed
      - exclude_collection
    default:
      section_number: "00"
    conditionals:
      collection_name_suffix:
        conditions:
          - unplayed: true
            value: " (Unwatched)"
        default: ""
    plex_search:
      all:
        added.after: <<date_after>>
        episode_unplayed: <<unplayed>>
    filters:
      collection.not: <<exclude_collection>>
    collection_order: added.desc
    label: <<collection_name>>
    summary: Recently Added Shows<<collection_name_suffix>> after <<date_after>>.
    sort_title: +<<section_number>>_Recently_Added_Shows
    visible_home: true
    visible_shared: true
    visible_library: true
    sync_mode: sync

  # Recently Watched TV Shows
  # Shows that were recently watched and are fully caught up (no unwatched episodes)
  # - date_after: Date to filter from (format: YYYY-MM-DD or MM/DD/YYYY) (required)
  # - section_number: For sort_title ordering (default: "00")
  recently_watched_shows:
    default:
      section_number: "00"
    smart_filter:
      all:
        episode_last_played.after: <<date_after>>
        unplayed_episodes: false
      sort_by: viewed.desc
    label: <<collection_name>>
    summary: Recently Watched Shows (fully caught up) after <<date_after>>.
    sort_title: +<<section_number>>_Recently_Watched_Shows
    visible_home: false
    visible_shared: false
    visible_library: true
    sync_mode: sync

  # Continue Watching Shows
  # Shows that have been started (at least some episodes watched)
  # The episode_progress: true filter automatically excludes fully watched shows (100%)
  # - section_number: For sort_title ordering (default: "00")
  continue_watching_shows:
    default:
      section_number: "00"
    smart_filter:
      all:
        episode_progress: true
      sort_by: viewed.desc
    label: <<collection_name>>
    summary: Shows you've started watching (excluding fully watched shows).
    sort_title: +<<section_number>>_Continue_Watching_Shows
    visible_home: false
    visible_shared: false
    visible_library: true
    sync_mode: sync

  # Recommendations - New Shows
  # Shows that haven't been started yet (no episodes watched)
  # - section_number: For sort_title ordering (default: "00")
  # Recently Added In Collection (TV Shows)
  # TV shows recently added within a specific collection
  # - key: Genre
  # - value: Horror, Drama, etc.
  # - unplayed: true/false (optional, filters for unwatched shows)
  # - section_number: For sort_title ordering (default: "02")
  recently_added_in_collection_shows:
    optional:
      - unplayed
    default:
      section_number: "02"
    conditionals:
      collection_name_suffix:
        conditions:
          - unplayed: true
            value: " (Unwatched)"
        default: ""
    plex_search:
      all:
        collection: <<value>> Collection
        episode_unplayed: <<unplayed>>
    collection_order: added.desc
    label: <<collection_name>>
    sort_title: +<<section_number>>2_Recently_Added_in_<<key>>_<<value>>
    summary: "The latest additions<<collection_name_suffix>> in <<value>> <<key>>."
    visible_home: false
    visible_shared: true
    visible_library: true

  recommendations_new_shows:
    default:
      section_number: "00"
    smart_filter:
      all:
        unplayed_episodes: true
      sort_by: random
    label: <<collection_name>>
    summary: Shows you haven't started watching yet.
    sort_title: +<<section_number>>_Recommendations_New_Shows
    visible_home: false
    visible_shared: false
    visible_library: true
    sync_mode: sync
