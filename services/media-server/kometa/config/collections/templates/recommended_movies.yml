templates:
  # Recently Released Movies
  # - date_after: Date to filter from (format: YYYY-MM-DD or MM/DD/YYYY) (required)
  # - unplayed: true/false (optional, filters for unwatched content)
  # - section_number: For sort_title ordering (default: "00")
  recently_released_movies:
    optional:
      - unplayed
    default:
      section_number: "00"
    conditionals:
      collection_name_suffix:
        conditions:
          - unplayed: true
            value: " (Unwatched)"
        default: ""
    smart_filter:
      all:
        release.after: <<date_after>>
        unplayed: <<unplayed>>
      sort_by: release.desc
    label: <<collection_name>>
    summary: Recently Released Movies<<collection_name_suffix>> released after <<date_after>>.
    sort_title: +<<section_number>>_Recently_Released_Movies
    visible_home: true
    visible_shared: true
    visible_library: true
    sync_mode: sync

  # Recently Added Movies
  # - date_after: Date to filter from (format: YYYY-MM-DD or MM/DD/YYYY) (required)
  # - unplayed: true/false (optional, filters for unwatched content)
  # - section_number: For sort_title ordering (default: "00")
  recently_added_movies:
    optional:
      - unplayed
    default:
      section_number: "00"
    conditionals:
      collection_name_suffix:
        conditions:
          - unplayed: true
            value: " (Unwatched)"
        default: ""
    smart_filter:
      all:
        added.after: <<date_after>>
        unplayed: <<unplayed>>
      sort_by: added.desc
    label: <<collection_name>>
    summary: Recently Added Movies<<collection_name_suffix>> after <<date_after>>.
    sort_title: +<<section_number>>_Recently_Added_Movies
    visible_home: true
    visible_shared: true
    visible_library: true
    sync_mode: sync

  # Recently Added In Collection (Movies)
  # - key: Genre
  # - value: Horror, Drama, etc.
  # - unplayed: true/false (optional, filters for unwatched content)
  # - section_number: For sort_title ordering (default: "02")
  recently_added_in_collection_movies:
    optional:
      - unplayed
    default:
      section_number: "02"
    conditionals:
      collection_name_suffix:
        conditions:
          - unplayed: true
            value: " (Unwatched)"
        default: ""
    smart_filter:
      all:
        collection: <<value>> Collection
        unplayed: <<unplayed>>
      sort_by: added.desc
    label: <<collection_name>>
    sort_title: +<<section_number>>2_Recently_Added_in_<<key>>_<<value>>
    summary: "The latest additions<<collection_name_suffix>> in <<value>> <<key>>."
    visible_home: false
    visible_shared: true
    visible_library: true

  # Recommendations - New Movies
  # Movies that haven't been watched yet
  # Uses smart_filter for dynamic, real-time updates without requiring Kometa re-runs
  # - section_number: For sort_title ordering (default: "00")
  recommendations_new_movies:
    default:
      section_number: "00"
    smart_filter:
      all:
        unplayed: true
      sort_by: random
    label: <<collection_name>>
    summary: Movies you haven't watched yet.
    sort_title: +<<section_number>>_Recommendations_New_Movies
    visible_home: false
    visible_shared: false
    visible_library: true
    sync_mode: sync
