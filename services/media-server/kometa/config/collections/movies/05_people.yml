templates:
  Director:
    plex_search:
      all:
        director: <<director_name>>
    collection_order: release.desc
    label: <<collection_name>> Collection
    sort_title: +050_Director_<<director_name>>_Movies
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: false

  Actor:
    plex_search:
      all:
        actor: <<actor_name>>
    collection_order: release.desc
    label: <<collection_name>> Collection
    sort_title: +051_Actor_<<actor_name>>_Movies
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: false

collections:
  # Directors
  Quentin Tarantino's Movies:
