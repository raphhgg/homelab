external_templates:
  - file: /config-repo/collections/templates/base_templates.yml
  - file: /config-repo/collections/templates/recommended_movies.yml

templates:
  decades:
    smart_filter:
      all:
        decade: <<value>>
        label.not:
          - radarr Documentary
          - radarr True-Crime
      sort_by: release.desc
    label: <<collection_name>>
    sort_title: +041_Decade_<<value>>_Movies
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: false

  released_before:
    smart_filter:
      all:
        release.before: <<tag>>-01-01
      sort_by: release.desc
    label: <<collection_name>>
    sort_title: +040_Decade_Before_<<tag>>
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: false

dynamic_collections:
  Decades:
    type: decade
    exclude:
      - 1970
      - 1960
      - 1950
      - 1940
      - 1930
      - 1920
      - 1910
      - 1900
    title_format: <<key_name>> Collection
    template: decades
    sync: true

collections:
  Decade Collections:
    template: { name: separator, section_number: "04" }

  1970s and Before Collection:
    template: { name: released_before, tag: 1980 }