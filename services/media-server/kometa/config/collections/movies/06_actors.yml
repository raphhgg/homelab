external_templates:
  - file: /config-repo/collections/templates.yml

templates:
  actor:
    plex_search:
      all:
        actor: <<actor_name>>
    collection_order: release.desc
    label: <<collection_name>> Collection
    sort_title: +061_Actor_<<actor_name>>_Movies
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: false

collections:
  Actor Collections:
    template: { name: separator, section_number: "06" }

  Leonardo DiCaprio Collection:
    template: { name: actor, actor_name: Leonardo DiCaprio }

  Tom Cruise Collection:
    template: { name: actor, actor_name: Tom Cruise }
  
  Brad Pitt Collection:
    template: { name: actor, actor_name: Brad Pitt }

  Christian Bale Collection:
    template: { name: actor, actor_name: Christian Bale }
  
  Nicolas Cage Collection:
    template: { name: actor, actor_name: Nicolas Cage }
  

