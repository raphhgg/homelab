external_templates:
  - file: /config-repo/collections/templates/base_templates.yml
  - file: /config-repo/collections/templates/recommended_templates.yml

templates:
  Franchise:
    letterboxd_list_details: <<list_url>>
    sync_mode: sync
    sort_title: +071_<<tag>>_Letterboxd_Franchise_Movies
    letterboxd_description: <<list_url>>
    collection_order: custom
    visible_home: false
    visible_shared: false
    visible_library: true

collections:
  Franchise Collections:
    template: { name: separator, section_number: "07" }
    
  The Conjuring Collection:
    template:
      name: Franchise
      list_url: https://letterboxd.com/raphh11/list/franchise-the-conjuring/

  Scream Collection:
    template:
      name: Franchise
      list_url: https://letterboxd.com/raphh11/list/franchise-scream/

  Mission Impossible Collection:
    plex_search:
      all:
        title: "Mission Impossible"
    sort_title: +071_Mission_Impossible_Franchise_Movies
    collection_order: year.asc
    visible_home: false
    visible_shared: false
    visible_library: true