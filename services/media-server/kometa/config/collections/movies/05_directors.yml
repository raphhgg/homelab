external_templates:
  - file: /config-repo/collections/templates.yml

templates:
  director:
    plex_search:
      all:
        director: <<director_name>>
    collection_order: release.desc
    label: <<collection_name>> Collection
    sort_title: +051_Director_<<director_name>>_Movies
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: false

collections:
  Director Collections:
    template: { name: separator, section_number: "05" }

  Quentin Tarantino Collection:
    template: { name: director, director_name: Quentin Tarantino }

  Christopher Nolan Collection:
    template: { name: director, director_name: Christopher Nolan }

  Martin Scorsese Collection:
    template: { name: director, director_name: Martin Scorsese }
  
  Brian De Palma Collection:
    template: { name: director, director_name: Brian De Palma }
  
  Ridley Scott Collection:
    template: { name: director, director_name: Ridley Scott }
  
  Paul Thomas Anderson Collection:
    template: { name: director, director_name: Paul Thomas Anderson }
  
  Denis Villeneuve Collection:
    template: { name: director, director_name: Denis Villeneuve }

  Stanley Kubrick Collection:
    template: { name: director, director_name: Stanley Kubrick }
  
  David Cronenberg Collection:
    template: { name: director, director_name: David Cronenberg }
  
  David Fincher Collection:
    template: { name: director, director_name: David Fincher }
  

