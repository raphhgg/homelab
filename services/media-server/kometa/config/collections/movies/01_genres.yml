external_templates:
  - file: /config-repo/collections/templates/base_templates.yml
  - file: /config-repo/collections/templates/recommended_movies.yml

collections:
  Genre Collections:
    template: { name: separator, section_number: "01" }

  Horror Collection:
    template:
    - name: genre
      section_number: "01"
      key: Radarr
      value: Horror
    summary: "Films designed to evoke fear, tension, and dread through the supernatural, psychological, or visceral."

  Recently Added in Horror:
    template:
    - name: recently_added_in_collection_movies
      section_number: "01"
      key: Genre
      value: Horror
      unplayed: true

  Drama Collection:
    template:
    - name: genre
      section_number: "01"
      key: Radarr
      value: Drama
    summary: "Films that focus on realistic characters, emotional themes, and personal conflicts, exploring the complexities of human experience and relationships."

  Recently Added in Drama:
    template:
    - name: recently_added_in_collection_movies
      section_number: "01"
      key: Genre
      value: Drama
      unplayed: true
  
  Comedy Collection:
    template:
    - name: genre
      section_number: "01"
      key: Radarr
      value: Comedy
    summary: "Films that use humor, wit, and playful situations to entertain, uplift, and make audiences laugh at life’s quirks and absurdities."

  Recently Added in Comedy:
    template:
    - name: recently_added_in_collection_movies
      section_number: "01"
      key: Genre
      value: Comedy
      unplayed: true

  Thriller Collection:
    template:
    - name: genre
      section_number: "01"
      key: Radarr
      value: Thriller
    summary: "Films that build suspense and excitement through high-stakes situations, twists, and psychological tension, keeping viewers on edge until the very end."

  Recently Added in Thriller:
    template:
    - name: recently_added_in_collection_movies
      section_number: "01"
      key: Genre
      value: Thriller
      unplayed: true
  
  Mystery Collection:
    template:
    - name: genre
      section_number: "01"
      key: Radarr
      value: Mystery
    summary: "Films centered on puzzles, secrets, or crimes, where clues unfold gradually as characters—and viewers—work to uncover the truth."

  Recently Added in Mystery:
    template:
    - name: recently_added_in_collection_movies
      section_number: "01"
      key: Genre
      value: Mystery
      unplayed: true
  
  Mafia Collection:
    template:
    - name: genre
      section_number: "01"
      key: Radarr
      value: Mafia
    summary: "Films that delve into the world of organized crime, following mob families, power struggles, and codes of loyalty—and the violent consequences when those codes are broken."

  Recently Added in Mafia:
    template:
    - name: recently_added_in_collection_movies
