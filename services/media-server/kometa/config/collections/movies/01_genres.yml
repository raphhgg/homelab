    summary: "Films that explore imaginative futures, advanced technology, space, or alternate realities, using scientific ideas to ask big ‘what if?’ questions about humanity and the universe."

  Recently Added in Sci-Fi:
    template:
    - name: recently_added_in_collection_movies
