external_templates:
  - file: /config-repo/collections/templates.yml

templates:  
  language:
    plex_all: true
    filters:
      original_language: <<original_languages>>
    label: <<collection_name>>
    sort_title: +021_Language_<<collection_name>>
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: false
  
  not_language:
    plex_all: true
    filters:
      original_language.not: <<excluded_languages>>
    label: <<collection_name>>
    sort_title: +022_Not_Language_<<collection_name>>
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: false

collections:
  Language Collections:
    template: { name: separator, section_number: "02" }

  French Collection:
    template: { name: language, original_languages: "fr" }

  Asian Collection:
    template: { name: language, original_languages: "ja,ko,th" }

  Non-English Collection:
    template: { name: not_language, excluded_languages: "en,fr,ja,ko,th" }