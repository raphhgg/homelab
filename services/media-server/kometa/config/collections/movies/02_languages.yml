external_templates:
  - file: /config-repo/collections/templates.yml

templates:  
  language:
    plex_all: true
    filters:
      original_language: <<original_language>>
      label.not: 
          - radarr Documentary-Music
    collection_order: year.desc
    label: <<collection_name>> Collection
    sort_title: +021_Language_<<collection_name>>
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: false

  # not_language

collections:
  Language Collections:
    template: { name: separator, section_number: "02" }

  Non-English Movies:
    plex_all: true
    filters:
      original_language.not: en,ja,ko,th,fr # Remove languages already in specific collections
    collection_order: year.desc
    label: <<collection_name>> Collection
    sort_title: +022_Language_Non-English_Movies
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: false
  
  French Movies:
    template: { name: language, original_language: fr }
  
  Asian Movies:
    plex_all: true
    filters:
      original_language: ja,ko,th
    collection_order: year.desc
    label: <<collection_name>> Collection
    sort_title: +023_Language_Asian_Movies
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: false