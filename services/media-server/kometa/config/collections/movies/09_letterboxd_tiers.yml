external_templates:
  - file: /config-repo/collections/templates/base_templates.yml

templates:
  letterboxd_ratings:
    letterboxd_list: https://letterboxd.com/raphh11/films/rated/<<letterboxd_rating>>/
    item_user_rating: <<plex_user_rating>>
    collection_order: random
    build_collection: false
    visible_home: false
    visible_shared: false
    visible_library: false

collections:
  Tier Collections:
    template: { name: separator, section_number: "09" }

  # 5 Stars Movies
  # Move to the top
  Favorites Movies:
    template:
    - name: letterboxd_ratings
      letterboxd_rating: "5.0"
      plex_user_rating: "10"
    build_collection: true
    sort_title: +091_Favorites_Movies_Letterboxd
    summary: "All movies I rated 5 stars on Letterboxd. The absolute best of the best — films that define my taste, move me every time, and never lose their magic. These are my personal classics, the ones I'll always come back to."
    visible_library: true
    visible_home: true

  Almost Favorites Movies:
    template:
    - name: letterboxd_ratings
      letterboxd_rating: "4.5"
      plex_user_rating: "9"
    build_collection: true
    sort_title: +092_Almost_Favorites_Movies_Letterboxd
    summary: "All movies I rated 4.5 stars on Letterboxd. Extraordinary films that come close to perfection. Beautifully made and memorable, and just a step below the all-time greats. These are the movies that almost made the Favorites list."
    visible_library: true
    visible_home: true

  Great Movies:
    template:
    - name: letterboxd_ratings
      letterboxd_rating: "4.0"
      plex_user_rating: "8"
    build_collection: true
    sort_title: +093_Great_Movies_Letterboxd
    summary: "All movies I rated 4 stars on Letterboxd. \nConsistently excellent films that deliver every time. Smart, well-crafted, and very enjoyable — the kind of movies I'd recommend without hesitation."
    visible_library: true
    visible_home: true

  3.5_Rated:
    template:
    - name: letterboxd_ratings
      letterboxd_rating: "3.5"
      plex_user_rating: "7"

  3.0_Rated:
    template:
    - name: letterboxd_ratings
      letterboxd_rating: "3.0"
      plex_user_rating: "6"

  2.5_Rated:
    template:
    - name: letterboxd_ratings
      letterboxd_rating: "2.5"
      plex_user_rating: "5"

  2.0_Rated:
    template:
    - name: letterboxd_ratings
      letterboxd_rating: "2.0"
      plex_user_rating: "4"

  1.5_Rated:
    template:
    - name: letterboxd_ratings
      letterboxd_rating: "1.5"
      plex_user_rating: "3"

  1.0_Rated:
    template:
    - name: letterboxd_ratings
      letterboxd_rating: "1.0"
      plex_user_rating: "2"

  0.5_Rated:
    template:
    - name: letterboxd_ratings
      letterboxd_rating: "0.5"
      plex_user_rating: "1"