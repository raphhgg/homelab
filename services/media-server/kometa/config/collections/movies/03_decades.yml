external_templates:
  - file: /config-repo/collections/templates/base_templates.yml
  - file: /config-repo/collections/templates/recommended_templates.yml

templates:
  # Used for Basic Decades Collection
  # Only visible in the Library Tab
  decade:
    plex_search:
      all:
        decade: <<tag>>
        label.not: 
          - radarr Documentary
          - radarr Documentary-Other
          - radarr True-Crime
      sort_by: release.desc
    label: <<collection_name>>
    sort_title: +031_Decade_<<tag>>_Movies
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: false

  released_before:
    plex_search:
      any:
        release.before: 01/01/<<tag>>
      sort_by: release.desc
    label: <<collection_name>>
    sort_title: +031_Decade_+Released_Before_<<tag>>
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: false

collections:
  Decade Collections:
    template: { name: separator, section_number: "03" }

  2020s Collection:
    template: { name: decade, tag: 2020 }

  2010s Collection:
    template: { name: decade, tag: 2010 }

  Recently Added in 2010s Collection:
    template:
    - name: recently_added_in
      section_number: "03"
      key: Decade
      value: 2010s

  2000s Collection:
    template: { name: decade, tag: 2000 }

  Recently Added in 2000s Collection:
    template:
    - name: recently_added_in
      section_number: "03"
      key: Decade
      value: 2000s

  90s Collection:
    template: { name: decade, tag: 1990 }

  Recently Added in 90s Collection:
    template:
    - name: recently_added_in
      section_number: "03"
      key: Decade
      value: 90s

  80s Collection:
    template: { name: decade, tag: 1980 }

  70s and Before Collection:
    template: { name: released_before, tag: 1980 }