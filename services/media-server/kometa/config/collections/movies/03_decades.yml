external_templates:
  - file: /config-repo/collections/templates.yml

templates:
  # Used for Basic Decades Collection
  # Only visible in the Library Tab
  decade:
    plex_search:
      all:
        decade: <<tag>>
        label.not: 
          - radarr Documentary-Music
          # - radarr Documentary-Sport
          - radarr Documentary-Other
          - radarr Live-Music
          - radarr True-Crime
      sort_by: release.desc
    label: <<collection_name>> Collection
    sort_title: +031_<<tag>>_Movies
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: false

  # Visible in the Recommended sections
  recently_added_in_decade:
    smart_filter:
      any:
        collection: <<base_collection>>
      sort_by: added.desc
    label: <<collection_name>> Collection
    sort_title: +032_Recently_Added_in_<<base_collection>>
    sync_mode: sync
    visible_home: true
    visible_shared: true
    visible_library: true

collections:
  Decade Collections:
    template: { name: separator, section_number: "03" }

  2020s Movies:
    template: { name: decade, tag: 2020 }

  2010s Movies:
    template: { name: decade, tag: 2010 }

  2000s Movies:
    template: { name: decade, tag: 2000 }

  Recently Added in 2000s Movies:
    template: { name: recently_added_in_decade, base_collection: 2000s Movies }

  90s Movies:
    template: { name: decade, tag: 1990 }

  Recently Added in 90s Movies:
    template: { name: recently_added_in_decade, base_collection: 90s Movies }

  80s Movies:
    template: { name: decade, tag: 1980 }

  70s and Before Movies:
    plex_search:
      any:
        release.before: 01/01/1980
      sort_by: release.desc
    label: 70s and Before Collection
    sort_title: +033_70s_and_Before_Movies
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: false