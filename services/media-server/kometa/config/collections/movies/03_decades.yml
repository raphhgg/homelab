templates:
  # Used for Basic Decades Collection
  # Only visible in the Library Tab
  Decade:
    plex_search:
      any:
        decade: <<tag>>
        label.isnot: 
          - radarr Documentary-Music
          - radarr Documentary-Sport
          - radarr Documentary-Other
      sort_by: release.desc
    label: <<collection_name>> Collection
    sort_title: +030_<<tag>>_Movies
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: false

  # Visible in the Recommended sections
  Recently Added In Decade:
    smart_filter:
      any:
        collection: <<base_collection>>
      sort_by: added.desc
      limit: 25
    label: <<collection_name>> Collection
    sort_title: +031_Recently_Added_In_<<base_collection>>
    sync_mode: sync
    visible_home: true
    visible_shared: true
    visible_library: true

collections:
  2020s Movies:
    template: { name: Decade, tag: 2020 }

  2010s Movies:
    template: { name: Decade, tag: 2010 }

  2000s Movies:
    template: { name: Decade, tag: 2000 }

  Recently Added in 2000s Movies:
    template: { name: Recently Added In Decade, base_collection: 2000s Movies }

  90s Movies:
    template: { name: Decade, tag: 1990 }

  Recently Added in 90s Movies:
    template: { name: Recently Added In Decade, base_collection: 90s Movies }

  80s Movies:
    template: { name: Decade, tag: 1980 }

  70s and Before Movies:
    plex_search:
      any:
        release.before: 01/01/1980
      sort_by: release.desc
    label: 70s and Before Collection
    sort_title: +030_70s_and_Before_Movies
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: false