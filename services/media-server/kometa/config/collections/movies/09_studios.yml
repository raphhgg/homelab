external_templates:
  - file: /config-repo/collections/templates/base_templates.yml

templates:
  studios:
    smart_filter:
      all:
        studio: <<value>>
      sort_by: year.desc
    sort_title: +091_<<key_name>>_Studio_Movies
    visible_home: false
    visible_shared: false
    visible_library: true

dynamic_collections:
  Studios:
    type: custom
    data:
      A24: A24
      Netflix: Netflix
    title_format: <<key_name>> Collection
    template: studios

collections:
  Studio Collections:
    template: { name: separator, section_number: "09" }
