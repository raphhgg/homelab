external_templates:
  - file: /config-repo/collections/templates/base_templates.yml
  - file: /config-repo/collections/templates/recommended_templates.yml

templates:
  # Only used for Sitcom sub-category
  pre_streaming:
    smart_filter:
      all:
        collection: <<parent_collection_name>>
        release.before: 2014-01-01
      sort_by: year.desc
    sort_title: +011_<<parent_collection_name>>_<<collection_name>>
    visible_home: false
    visible_shared: false
    visible_library: false

  # Only used for Sitcom sub-category
  post_streaming:
    smart_filter:
      all:
        collection: <<parent_collection_name>>
        release.after: 2014-01-01
      sort_by: year.desc
    sort_title: +011_<<parent_collection_name>>_<<collection_name>>
    visible_home: false
    visible_shared: false
    visible_library: false

collections:
  Genre Collections:
    template: { name: separator, section_number: "01" }

  Anime Collection:
    template:
      - name: genre
        section_number: "01"
        key: Sonarr
        value: Anime
    summary: "Japanese animated series across all genres and styles."

  Cartoons Collection:
    template:
      - name: genre
        section_number: "01"
        key: Sonarr
        value: Cartoon
    summary: "Western animated shows, from adult comedy to kids' classics."

  Conspiracy & Espionage Collection:
    template:
      - name: genre
        section_number: "01"
        key: Sonarr
        value: Conspiracy-Espionage
    summary: "Thrillers about spies, conspiracy, and shadowy global plots."

  Recently Added in Conspiracy & Espionage:
    template:
      - name: recently_added_in
        section_number: "01"
        key: Genre
        value: Conspiracy & Espionage
    summary: "The latest additions in Conspiracy & Espionage Genre."

  Crime & Mystery Collection:
    template:
      - name: genre
        section_number: "01"
        key: Sonarr
        value: Crime-Mystery
    summary: "Investigations into murders and crimes where solving the case drives the story."

  Recently Added in Crime & Mystery:
    template:
      - name: recently_added_in
        section_number: "01"
        key: Genre
        value: Crime & Mystery
    summary: "The latest additions in Crime & Mystery Genre."

  Documentary Collection:
    template:
      - name: genre
        section_number: "01"
        key: Sonarr
        value: Documentary
    summary: "Non-fiction series exploring real people, events or ideas."

  Drama Collection:
    template:
      - name: genre
        section_number: "01"
        key: Sonarr
        value: Drama
    summary: "Character-driven, serious storytelling often tackling moral or emotional dilemmas."

  Dramedy Collection:
    template:
      - name: genre
        section_number: "01"
        key: Sonarr
        value: Dramedy
    summary: "Shows blending drama with humor, balancing tension and comedy."

  Horror Collection:
    template:
      - name: genre
        section_number: "01"
        key: Sonarr
        value: Horror
    summary: "Supernatural or psychological tales designed to unsettle and scare."

  Organized Crime Collection:
    template:
      - name: genre
        section_number: "01"
        key: Sonarr
        value: Organized-Crime
    summary: "Stories about the mafia, cartels, and criminal empires from the inside."

  Recently Added in Organized Crime:
    template:
      - name: recently_added_in
        section_number: "01"
        key: Genre
        value: Organized Crime
    summary: "The latest additions in Organized Crime Genre."

  Reality-TV Collection:
    template:
      - name: genre
        section_number: "01"
        key: Sonarr
        value: Reality-TV
    summary: "Competition, lifestyle, or unscripted shows featuring real people."

  Sci-Fi Collection:
    template:
      - name: genre
        section_number: "01"
        key: Sonarr
        value: Sci-Fi
    summary: "Futuristic, space-bound, or speculative worlds exploring science and technology."

  Sitcom Collection:
    template:
      - name: genre
        section_number: "01"
        key: Sonarr
        value: Sitcom
    summary: "Half-hour comedies built around recurring characters and everyday situations."

  Classic Sitcom Collection:
    template:
      - name: pre_streaming
        parent_collection_name: Sitcom Collection
    summary: "Classic sitcoms from the pre-streaming era."

  Modern Sitcom Collection:
    template:
      - name: post_streaming
        parent_collection_name: Sitcom Collection
    summary: "Modern sitcoms from the streaming era."

  Sports Collection:
    template:
      - name: genre
        section_number: "01"
        key: Sonarr
        value: Sports
    summary: "Live competitions, game coverage, and documentaries exploring athletes, teams, and sporting culture."

  Superheroes Collection:
    template:
      - name: genre
        section_number: "01"
        key: Sonarr
        value: Superhero-Mystery
    summary: "Gritty superhero stories with a strong investigative or noir element."

  Supernatural Collection:
    template:
      - name: genre
        section_number: "01"
        key: Sonarr
        value: Supernatural-Mystery
    summary: "Mysteries fueled by the unexplainable, from the otherworldly to the metaphysical."

  Recently Added in Supernatural:
    template:
      - name: recently_added_in
        section_number: "01"
        key: Genre
        value: Supernatural
    summary: "The latest additions in Supernatural & Mystery Genre."

  True Crime Collection:
    template:
      - name: genre
        section_number: "01"
        key: Sonarr
        value: True-Crime
    summary: "Real-life cases of crime, murder, and justice, retold with documentary detail."
