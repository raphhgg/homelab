external_templates:
  - file: /config-repo/collections/templates.yml

templates:
  # Used for Basic Genre Collection - from Sonarr's root folders (autotags)
  # Only visible in the Library Tab
  genre:
    plex_search:
      all:
        label: Sonarr <<tag>>
    collection_order: year.desc
    label: <<collection_name>> Collection
    sort_title: +011_<<tag>>_Shows
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: false

  # Only used for Sitcom sub-category
  pre_streaming:
    smart_filter:
      all:
        collection: <<parent_collection_name>>
        release.before: 2014-01-01
      sort_by: year.desc
    sort_title: +011_<<parent_collection_name>>_<<collection_name>>
    visible_home: false
    visible_shared: false
    visible_library: false
  
  # Only used for Sitcom sub-category
  post_streaming:
    smart_filter:
      all:
        collection: <<parent_collection_name>>
        release.after: 2014-01-01
      sort_by: year.desc
    sort_title: +011_<<parent_collection_name>>_<<collection_name>>
    visible_home: false
    visible_shared: false
    visible_library: false

  # Visible in the Recommended sections
  recently_added_in_genre:
    smart_filter:
      any:
        collection: <<tag>> Shows
      sort_by: added.desc
      limit: 15
    label: <<collection_name>> Collection
    sort_title: +012_Recently_Added_In_<<tag>>_Shows
    sync_mode: sync
    visible_home: true # weekly(wednesday)
    visible_shared: true # weekly(wednesday)
    visible_library: true # weekly(wednesday)

    # Some kind of random reco section
    # visible_shared: weekly(wednesday)
    # smart_filter:
    #   sort_by: random
    #   limit: 200
    #   validate: false
    #   all:
    #     audience_rating.gte: 7.0
    #     genre: action

collections:
  Genre Collections:
    template: { name: separator, section_number: "01" }

  Anime Shows:
    template: { name: genre, tag: Anime }
    summary: "Japanese animated series across all genres and styles."

  Cartoons Shows:
    template: { name: genre, tag: Cartoon }
    summary: "Western animated shows, from adult comedy to kids’ classics."

  Conspiracy & Espionage Shows:
    template: { name: genre, tag: Conspiracy-Espionage }
    summary: "Thrillers about spies, conspiracy, and shadowy global plots."

  Recently Added in Conspiracy & Espionage Shows:
    template: { name: recently_added_in_genre, tag: Conspiracy & Espionage }
    summary: "The 10 latest additions in Conspiracy & Espionage Genre."

  Crime & Mystery Shows:
    template: { name: genre, tag: Crime-Mystery }
    summary: "Investigations into murders and crimes where solving the case drives the story."

  Recently Added in Crime & Mystery Shows:
    template: { name: recently_added_in_genre, tag: Crime & Mystery }
    summary: "The 10 latest additions in Crime & Mystery Genre."

  Documentary Shows:
    template: { name: genre, tag: Documentary }
    summary: "Non-fiction series exploring real people, events or ideas."

  Drama Shows:
    template: { name: genre, tag: Drama }
    summary: "Character-driven, serious storytelling often tackling moral or emotional dilemmas."

  Dramedy Shows:
    template: { name: genre, tag: Dramedy }
    summary: "Shows blending drama with humor, balancing tension and comedy."

  Horror Shows:
    template: { name: genre, tag: Horror }
    summary: "Supernatural or psychological tales designed to unsettle and scare."

  Organized Crime Shows:
    template: { name: genre, tag: Organized-Crime }
    summary: "Stories about the mafia, cartels, and criminal empires from the inside."
  
  Recently Added in Organized Crime Shows:
    template: { name: recently_added_in_genre, tag: Organized Crime }
    summary: "The 10 latest additions in Organized Crime Genre."

  Reality-TV Shows:
    template: { name: genre, tag: Reality-TV }
    summary: "Competition, lifestyle, or unscripted shows featuring real people."

  Sci-Fi Shows:
    template: { name: genre, tag: Sci-Fi }
    summary: "Futuristic, space-bound, or speculative worlds exploring science and technology."

  Sitcom Shows:
    template: { name: genre, tag: Sitcom }
    summary: "Half-hour comedies built around recurring characters and everyday situations."
  
  Classic Sitcom Shows:
    template: { name: pre_streaming
, parent_collection_name: Sitcom Shows }
    summary: "Classic sitcoms from the pre-streaming era."

  Modern Sitcom Shows:
    template: { name: post_streaming, parent_collection_name: Sitcom Shows }
    summary: "Modern sitcoms from the streaming era."

  Sports Shows:
    template: { name: genre, tag: Sports }
    summary: "Live competitions, game coverage, and documentaries exploring athletes, teams, and sporting culture."

  Superheroes Shows:
    template: { name: genre, tag: Superhero-Mystery }
    summary: "Gritty superhero stories with a strong investigative or noir element."

  Supernatural Shows:
    template: { name: genre, tag: Supernatural-Mystery }
    summary: "Mysteries fueled by the unexplainable, from the otherworldly to the metaphysical."

  Recently Added in Supernatural Shows:
    template: { name: recently_added_in_genre, tag: Supernatural }
    summary: "The 10 latest additions in Supernatural & Mystery Genre."

  True Crime Shows:
    template: { name: genre, tag: True-Crime }
    summary: "Real-life cases of crime, murder, and justice, retold with documentary detail."