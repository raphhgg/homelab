templates:
  # Used for Basic Genre Collection - from Sonarr's root folders (autotags)
  # Only visible in the Library Tab
  Genre:
    plex_search:
      all:
        label: Sonarr <<tag>>
    collection_order: year.desc
    label: <<collection_name>> Collection
    sort_title: +010_<<tag>>_Shows
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: false

  # Only used for Sitcom sub-category
  Pre Streaming:
    smart_filter:
      all:
        collection: <<parent_collection_name>>
        release.before: 2014-01-01
      sort_by: year.desc
    sort_title: +010_<<parent_collection_name>>_<<collection_name>>
    visible_home: false
    visible_shared: false
    visible_library: false
  
  # Only used for Sitcom sub-category
  Post Streaming:
    smart_filter:
      all:
        collection: <<parent_collection_name>>
        release.after: 2014-01-01
      sort_by: year.desc
    sort_title: +010_<<parent_collection_name>>_<<collection_name>>
    visible_home: false
    visible_shared: false
    visible_library: false

  # Not working
  Separator:
    smart_label: random
    sync_mode: sync
    imdb_id: tt0411008
  
  # Visible in the Recommended sections
  Recently Added In Genre:
    smart_filter:
      any:
        collection: <<tag>> Shows Collection
      sort_by: added.desc
      limit: 10
    label: <<collection_name>> Collection
    sort_title: +011_Recently_Added_In_<<tag>>_TV_Shows
    sync_mode: sync
    visible_home: true # weekly(wednesday)
    visible_shared: true # weekly(wednesday)
    visible_library: true # weekly(wednesday)

