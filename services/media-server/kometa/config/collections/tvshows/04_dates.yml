external_templates:
  - file: /config-repo/collections/templates/base_templates.yml

collections:
  Date Collections:
    template: { name: separator, section_number: "04" }

  Pre Streaming Shows:
    smart_filter:
      all:
        release.before: 2014-01-01
        collection.not: Anime Collection,Cartoons Collection
      sort_by: year.desc
    sort_title: +041_Pre_Streaming_Collection
    summary: "Shows released before the beginning of the streaming era."
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: false

  # Decades like movies?