external_templates:
  - file: /config-repo/collections/templates/base_templates.yml
  - file: /config-repo/collections/templates/recommended_tvshows.yml

collections:
  Genre Collections:
    template: { name: separator, section_number: "02" }

  Anime Collection:
    template:
      - name: genre
        section_number: "02"
        key: Sonarr
        value: Anime
    summary: "Japanese animated series across all genres and styles."

  Cartoons Collection:
    template:
      - name: genre
        section_number: "02"
        key: Sonarr
        value: Cartoon
    summary: "Western animated shows, from adult comedy to kids' classics."

  Conspiracy & Espionage Collection:
    template:
      - name: genre
        section_number: "02"
        key: Sonarr
        value: Conspiracy-Espionage
    summary: "Thrillers about spies, conspiracy, and shadowy global plots."

  Crime & Mystery Collection:
    template:
      - name: genre
        section_number: "02"
        key: Sonarr
        value: Crime-Mystery
    summary: "Investigations into murders and crimes where solving the case drives the story."

  Documentary Collection:
    template:
      - name: genre
        section_number: "02"
        key: Sonarr
        value: Documentary
    summary: "Non-fiction series exploring real people, events or ideas."

  Drama Collection:
    template:
      - name: genre
        section_number: "02"
        key: Sonarr
        value: Drama
    summary: "Character-driven, serious storytelling often tackling moral or emotional dilemmas."

  Dramedy Collection:
    template:
      - name: genre
        section_number: "02"
        key: Sonarr
        value: Dramedy
    summary: "Shows blending drama with humor, balancing tension and comedy."

  Horror Collection:
    template:
      - name: genre
        section_number: "02"
        key: Sonarr
        value: Horror
    summary: "Supernatural or psychological tales designed to unsettle and scare."

  Organized Crime Collection:
    template:
      - name: genre
        section_number: "02"
        key: Sonarr
        value: Organized-Crime
    summary: "Stories about the mafia, cartels, and criminal empires from the inside."

  Reality-TV Collection:
    template:
      - name: genre
        section_number: "02"
        key: Sonarr
        value: Reality-TV
    summary: "Competition, lifestyle, or unscripted shows featuring real people."

  Sci-Fi Collection:
    template:
      - name: genre
        section_number: "02"
        key: Sonarr
        value: Sci-Fi
    summary: "Futuristic, space-bound, or speculative worlds exploring science and technology."

  Classic Sitcom Collection:
    template:
      - name: genre
        section_number: "02"
        key: Sonarr
        value: Sitcom
    filters:
      release.before: 2014-01-01
    sort_title: +021_Sitcom_Classic_Collection
    summary: "Classic sitcoms from the pre-streaming era (before 2014)."

  Modern Sitcom Collection:
    template:
      - name: genre
        section_number: "02"
        key: Sonarr
        value: Sitcom
    filters:
      release.after: 2014-01-01
    sort_title: +021_Sitcom_Modern_Collection
    summary: "Modern sitcoms from the streaming era (2014 onwards)."

  Sports Collection:
    template:
      - name: genre
        section_number: "02"
        key: Sonarr
        value: Sports
    summary: "Live competitions, game coverage, and documentaries exploring athletes, teams, and sporting culture."

  Superheroes Collection:
    template:
      - name: genre
        section_number: "02"
        key: Sonarr
        value: Superhero-Mystery
    summary: "Gritty superhero stories with a strong investigative or noir element."

  Supernatural Collection:
    template:
      - name: genre
        section_number: "02"
        key: Sonarr
        value: Supernatural-Mystery
    summary: "Mysteries fueled by the unexplainable, from the otherworldly to the metaphysical."

  True Crime Collection:
    template:
      - name: genre
        section_number: "02"
        key: Sonarr
        value: True-Crime
    summary: "Real-life cases of crime, murder, and justice, retold with documentary detail."
