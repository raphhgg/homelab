collections:
  4K HDR10+ or DV Shows:
    plex_search:
      any:
        hdr: true
        dovi: true
    filters:
      filepath.regex: 'HDR10\+|HDR10P|DV|Dolby[ ._-]?Vision'
    collection_order: episode_release.desc
    sort_title: +040_4K_HDR+_DV_Quality_Collection
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: false

