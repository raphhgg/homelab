templates:  
  Language:
    plex_all: true
    filters:
      original_language: <<original_language>>
    collection_order: year.desc
    label: <<collection_name>> Collection
    sort_title: +020_<<tag>>_Shows
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: false

collections:
  Non-English Shows:
    plex_all: true
    filters:
      original_language.not: en,ja,ko,fr # Remove languages already in specific collections
    collection_order: year.desc
    label: <<collection_name>> Collection
    sort_title: +021_Non-English_Shows
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: false
  
  French Shows:
    template: { name: Language, original_language: fr } 
  
  Asian Shows:
    plex_all: true
    filters:
      original_language: ja,ko
      collection.not: Anime Shows
    collection_order: year.desc
    label: <<collection_name>> Collection
    sort_title: +020_Asian_Shows
    sync_mode: sync
    visible_home: false
    visible_shared: false
    visible_library: false