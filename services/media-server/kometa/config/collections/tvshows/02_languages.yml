external_templates:
  - file: /config-repo/collections/templates/base_templates.yml
  - file: /config-repo/collections/templates/recommended_templates.yml

collections:
  Language Collections:
    template: { name: separator, section_number: "02" }

  Non-English Collection:
    template:
      - name: language_exclude
        excluded_languages: en,ja,ko,fr
        section_number: "02"

  French Collection:
    template:
      - name: language_include
        languages: fr
        section_number: "02"

  Asian Collection:
    template:
      - name: language_include
        languages: ja,ko
        section_number: "02"
    filters:
      collection.not: Anime Collection  # Exclude anime (already in separate collection)
