external_templates:
  - file: /config-repo/collections/templates/base_templates.yml
  - file: /config-repo/collections/templates/recommended_templates.yml

collections:
  Concert Collection:
    template:
    - name: genre
      section_number: "01"
      key: Radarr
      value: Concert
    summary: "Concert films and performances capturing artists and bands playing live."

  Music Documentary Collection:
    template:
    - name: genre
      section_number: "01"
      key: Radarr
      value: Documentary-Music
    summary: "Documentaries focused on musicians, music history, and cultural impact of sound."