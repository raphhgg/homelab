external_templates:
  default: templates
  template_variables:
    default:
      vertical_offset: 50
      horizontal_align: left
    conditionals:
      file:
        conditions:
          - key: [DV, DV_HDR, DV_HDR_Plus]
            value: /config-repo/custom_overlays/images/media_info/codec/DV_small.png
          - key: HDR
            value: /config-repo/custom_overlays/images/media_info/codec/HDR_small.png
          - key: HDR_Plus
            value: /config-repo/custom_overlays/images/media_info/codec/Plus_small.png
          - type: codec
            value: /config-repo/custom_overlays/images/media_info/codec/<<key>>.png
          - type: resolution
            value: /config-repo/custom_overlays/images/media_info/resolution/<<key>>.png
      final_use:
        conditions:
          - codec_only.exists: true
            type: resolution
            value: false
          - resolution_only.exists: true
            type: codec
            value: false
      suppress_overlays:
        conditions:
          - type: codec
            value: []
      vertical_align:
        conditions:
          - type: resolution
            value: top
          - type: codec
            value: top
      vertical_offset:
        default: 70 #60 #50
        conditions:
          - type: codec
            value: 90 #80 #70
      horizontal_offset:
        default: 60 #50 #25
        conditions:
          - type: codec
            value: 210 #205
      group:
        conditions:
          - type: resolution
            value: <<type>>
          - type: codec
            value: <<type>>

templates:
  codec_info:
    conditionals:
      regex:
        conditions:
          - key: DV
            value: '(?i)\bDV\b(?!.*HDR)'
          - key: HDR
            value: '(?i)\bHDR10\b'
          - key: HDR_Plus
            value: '(?i)\bHDR10Plus\b'
          - key: DV_HDR
            value: '(?i)\bDV[ .]HDR10\b'
          - key: DV_HDR_Plus
            value: '(?i)\bDV[ .]HDR10Plus\b'
    optional:
      - use_<<type>>
      - use_codec
    run_definition:
      - <<use_<<type>>>>
      - <<use_codec>>
    ignore_blank_results: true
    plex_all: true
    filters:
      filepath.regex: <<regex>>

  resolution_info:
    conditionals:
      suppress_overlays:
        conditions:
          - use_<<key>>.exists: true
            value:
              - <<key>>
      resolution:
        conditions:
          - key: 1080P
            value: 1080p
          - key: Ultra-HD
            value: 4k
    optional:
      - use_<<key>>
      - use_<<type>>
    run_definition:
      - <<use_<<key>>>>
      - <<use_<<type>>>>
    ignore_blank_results: true
    plex_search:
      all:
        resolution: <<resolution>>

  backdrop:
    conditionals:
      file:
        conditions:
          - key: gradient_top
            builder_level: episode
            value: /config-repo/custom_overlays/images/gradients/gradient_episode_top.png
          - key: gradient_top
            value: /config-repo/custom_overlays/images/gradients/gradient_top.png
          - key: gradient_bottom
            builder_level: episode
            value: /config-repo/custom_overlays/images/gradients/gradient_episode_bottom.png
          - key: gradient_bottom
            value: /config-repo/custom_overlays/images/gradients/gradient_bottom.png
    optional:
      - builder_level
      - use_<<key>>
    run_definition:
      - <<use_<<key>>>>
    builder_level: <<builder_level>>
    plex_all: true
    overlay:
      name: <<overlay_name>>
      file: <<file>>

overlays:
  gradient_top:
    variables: { key: gradient_top }
    template: [ name: backdrop ]
  gradient_bottom:
    variables: { key: gradient_bottom }
    template: [ name: backdrop ]

  DV:
    variables: { key: DV, weight: 220, type: codec }
    template: [ name: standard, name: codec_info ]
  HDR:
    variables: { key: HDR, weight: 230, type: codec }
    template: [ name: standard, name: codec_info ]
  HDR_Plus:
    variables: { key: HDR_Plus, weight: 240, type: codec }
    template: [ name: standard, name: codec_info ]
  DV_HDR:
    variables: { key: DV_HDR, weight: 250, type: codec }
    template: [ name: standard, name: codec_info ]
  DV_HDR_Plus:
    variables: { key: DV_HDR_Plus, weight: 260, type: codec }
    template: [ name: standard, name: codec_info ]

  HD:
    variables: { key: 1080P, weight: 490, type: resolution }
    template: [ name: standard, name: resolution_info ]
  4K:
    variables: { key: Ultra-HD, weight: 500, type: resolution }
    template: [ name: standard, name: resolution_info ]
