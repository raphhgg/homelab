external_templates:
  default: templates

templates:
  user_rating_with_star:
    default:
      horizontal_align: right
      vertical_align: bottom
      horizontal_offset: 50
      vertical_offset: 50

      star_position: left        
      star_offset: 10            
      star_height: 45

      font_size: 45
      font_color: "#FFFFFF"

      back_color: "#00000099"   # Semi-transparent black background
      back_width: 120
      back_height: 60
      back_radius: 30
      back_padding: 15
      back_align: center

      builder_level: ""

    optional:
      - builder_level

    overlay:
      name: text(<<user_rating/>>)
      file: /config-repo/custom_overlays/images/rating/star.png
      addon_position: <<star_position>>
      addon_offset: <<star_offset>>
      scale_height: <<star_height>>
      horizontal_align: <<horizontal_align>>
      vertical_align: <<vertical_align>>
      horizontal_offset: <<horizontal_offset>>
      vertical_offset: <<vertical_offset>>
      font_size: <<font_size>>
      font_color: <<font_color>>
      back_color: <<back_color>>
      back_width: <<back_width>>
      back_height: <<back_height>>
      back_radius: <<back_radius>>
      back_padding: <<back_padding>>
      back_align: <<back_align>>

    builder_level: <<builder_level>>
    plex_all: true

overlays:
  user_rating_star:
    template:
      name: user_rating_with_star