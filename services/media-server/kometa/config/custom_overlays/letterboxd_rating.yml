external_templates:
  default: templates

templates:
  letterboxd_rating:
    default:
      horizontal_align: right
      vertical_align: bottom
      horizontal_offset: 50
      vertical_offset: 50

      image_height: 45
      builder_level: ""

    optional:
      - builder_level

    conditionals:
      file:
        conditions:
          - rating: "1"
            value: /config-repo/custom_overlays/images/letterboxd_overlays/.5 Stars.png
          - rating: "2"
            value: /config-repo/custom_overlays/images/letterboxd_overlays/1 Stars.png
          - rating: "3"
            value: /config-repo/custom_overlays/images/letterboxd_overlays/1.5 Stars.png
          - rating: "4"
            value: /config-repo/custom_overlays/images/letterboxd_overlays/2 Stars.png
          - rating: "5"
            value: /config-repo/custom_overlays/images/letterboxd_overlays/2.5 Stars.png
          - rating: "6"
            value: /config-repo/custom_overlays/images/letterboxd_overlays/3 Stars.png
          - rating: "7"
            value: /config-repo/custom_overlays/images/letterboxd_overlays/3.5 Stars.png
          - rating: "8"
            value: /config-repo/custom_overlays/images/letterboxd_overlays/4 Stars.png
          - rating: "9"
            value: /config-repo/custom_overlays/images/letterboxd_overlays/4.5 Stars.png
          - rating: "10"
            value: /config-repo/custom_overlays/images/letterboxd_overlays/5 Stars.png

    plex_search:
      all:
        user_rating.gte: <<rating>>
        user_rating.lte: <<rating>>

    builder_level: <<builder_level>>
    ignore_blank_results: true

    overlay:
      name: <<overlay_name>>
      file: <<file>>
      scale_height: <<image_height>>
      horizontal_align: <<horizontal_align>>
      vertical_align: <<vertical_align>>
      horizontal_offset: <<horizontal_offset>>
      vertical_offset: <<vertical_offset>>

overlays:
  letterboxd_0.5:
    variables: { rating: "1" }
    template: { name: letterboxd_rating }
  letterboxd_1.0:
    variables: { rating: "2" }
    template: { name: letterboxd_rating }
  letterboxd_1.5:
    variables: { rating: "3" }
    template: { name: letterboxd_rating }
  letterboxd_2.0:
    variables: { rating: "4" }
    template: { name: letterboxd_rating }
  letterboxd_2.5:
    variables: { rating: "5" }
    template: { name: letterboxd_rating }
  letterboxd_3.0:
    variables: { rating: "6" }
    template: { name: letterboxd_rating }
  letterboxd_3.5:
    variables: { rating: "7" }
    template: { name: letterboxd_rating }
  letterboxd_4.0:
    variables: { rating: "8" }
    template: { name: letterboxd_rating }
  letterboxd_4.5:
    variables: { rating: "9" }
    template: { name: letterboxd_rating }
  letterboxd_5.0:
    variables: { rating: "10" }
    template: { name: letterboxd_rating }