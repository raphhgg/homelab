external_templates:
  default: templates

templates:
  audience_score:
    default:
      horizontal_offset: 50
      horizontal_align: right
      vertical_offset: 50
      vertical_align: bottom
      back_radius: 50
      back_padding: 20
    conditionals:
      back_color:
        conditions:
          - key: audience_score_high
            value: "#00E05488"
          - key: audience_score_mid
            value: "#F5C518AA"
          - key: audience_score_low
            value: "#CC000088"
      audience_rating.gte:
        conditions:
          - key: audience_score_high
            value: 8.0
          - key: audience_score_mid
            value: 6.0
          - key: audience_score_low
            value: 0
      names:
        default: <<overlay_name>>
        conditions:
          - key: [audience_score_high, audience_score_mid, audience_score_low]
            value: text(<<audience_rating>>)
    optional:
      - builder_level
    plex_all: true
    filters:
      audience_rating.gte: <<audience_rating.gte>>
    builder_level: <<builder_level>>
    overlay:
      name: <<names>>
      group: <<group>>
      weight: <<weight>>
      back_color: <<back_color>>
      back_radius: <<back_radius>>
      back_padding: <<back_padding>>
      horizontal_offset: <<horizontal_offset>>
      horizontal_align: <<horizontal_align>>
      vertical_offset: <<vertical_offset>>
      vertical_align: <<vertical_align>>
      back_width: 52
      back_height: 52
      back_align: center
      font_color: "#ffffff"
      font: /config-repo/custom_overlays/fonts/AvenirNextLTPro-Bold.ttf
      font_size: 37

overlays:
  audience_score_high:
    variables: { key: audience_score_high, weight: 500, group: score }
    template: [ name: audience_score ]
  audience_score_mid:
    variables: { key: audience_score_mid, weight: 400, group: score }
    template: [ name: audience_score ]
  audience_score_low:
    variables: { key: audience_score_low, weight: 300, group: score }
    template: [ name: audience_score ]