overlays:
  rating_episode_high:
    builder_level: episode
    overlay:
      font_color: "#FFFFFF" #C3F0B8
      back_color: "#00E05488" # "#4c9539DD"
      name: text(<<audience_rating>>)
      font_size: 60
      back_radius: 30
      back_padding: 30
      back_height: 60
      horizontal_offset: 50
      horizontal_align: right
      vertical_offset: 50 #40
      vertical_align: bottom
    plex_search:
      type: episode
      all:
        episode_audience_rating.gte: 8.0

  rating_episode_mid:
    builder_level: episode
    overlay:
      font_color: "#FFFFFF" #7A4200
      back_color: "#F5C518AA" #"#e5a00dDD"
      name: text(<<audience_rating>>)
      font_size: 60
      back_radius: 30
      back_padding: 30
      back_height: 60
      horizontal_offset: 50
      horizontal_align: right
      vertical_offset: 50 
      vertical_align: bottom
    plex_search:
      type: episode
      all:
        episode_audience_rating.gte: 5.0
        episode_audience_rating.lte: 7.9

  rating_episode_low:
    builder_level: episode
    overlay:
      font_color: "#FFFFFF" #FFB3C0
      back_color: "#CC000088" # "#cc0000DD"
      name: text(<<audience_rating>>)
      font_size: 60
      back_radius: 30
      back_padding: 30
      back_height: 60
      horizontal_offset: 50
      horizontal_align: right
      vertical_offset: 50 #40
      vertical_align: bottom
    plex_search:
      type: episode
      all:
        episode_audience_rating.gte: 0
        episode_audience_rating.lte: 4.9