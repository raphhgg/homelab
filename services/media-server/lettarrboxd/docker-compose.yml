services:
  lettarrboxd:
    image: ryanpage/lettarrboxd:latest
    container_name: lettarrboxd
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - LETTERBOXD_URL=${LETTERBOXD_URL}
      - RADARR_API_URL=http://radarr:7878
      - RADARR_API_KEY=${RADARR_API_KEY}
      - RADARR_QUALITY_PROFILE=2160p Efficient
      - RADARR_ROOT_FOLDER_ID=28
      - CHECK_INTERVAL_MINUTES=10
      - RADARR_MINIMUM_AVAILABILITY=released
      - RADARR_ADD_UNMONITORED=false
      - DRY_RUN=true
    volumes:
      - ${DOCKER_APPDATA_PATH}/lettarrboxd:/data
    restart: always
    labels:
      com.centurylinklabs.watchtower.enable: true
      glance.name: Lettarrboxd
      glance.description: Sync Letterboxd watchlist to radarr
      glance.id: lettarrboxd
    networks:
      - media

  lettarrboxd-new-releases:
    image: ryanpage/lettarrboxd:latest
    container_name: lettarrboxd-new-releases
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - LETTERBOXD_URL=${LETTERBOXD_URL_NEW_RELEASES}
      - RADARR_API_URL=http://radarr:7878
      - RADARR_API_KEY=${RADARR_API_KEY}
      - RADARR_QUALITY_PROFILE=2160p Quality
      - RADARR_ROOT_FOLDER_ID=28
      - CHECK_INTERVAL_MINUTES=10
      - RADARR_MINIMUM_AVAILABILITY=announced
      - RADARR_ADD_UNMONITORED=false
      # - DRY_RUN=true
    volumes:
      - ${DOCKER_APPDATA_PATH}/lettarrboxd-new-releases:/data
    restart: always
    labels:
      com.centurylinklabs.watchtower.enable: true
      glance.parent: lettarrboxd
      glance.id: lettarrboxd-new-releases
    networks:
      - media

networks:
  media:
    external: true
