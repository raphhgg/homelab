services:
  pulsarr:
    image: lakker/pulsarr:node
    container_name: pulsarr
    networks:
      - media
      - traefik_socket_net
    ports:
      - 3010:3003
    volumes:
      - ${DOCKER_APPDATA_PATH}/pulsarr/data:/app/data
      - .env:/app/.env
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_socket_net"
      - "traefik.http.routers.pulsarr.rule=Host(`${PULSARR_HOST}`)"
      - "traefik.http.routers.pulsarr.entrypoints=websecure"
      - "traefik.http.routers.pulsarr.tls.certresolver=cloudflare"
      - "traefik.http.routers.pulsarr.middlewares=allow-default-apps@file,tinyauth@file"
      - "traefik.http.services.pulsarr.loadbalancer.server.port=3003"
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  media:
    external: true
  traefik_socket_net:
    external: true
