version: '3.8'
services:
  pulsarr:
    image: lakker/pulsarr:node
    container_name: pulsarr
    networks:
      - main
    ports:
      - 3010:3003
    volumes:
      - ${DOCKER_APPDATA_PATH}/pulsarr/data:/app/data
      - .env:/app/.env
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  main:
    external: true
