services:
  wizarr:
    image: ghcr.io/wizarrrr/wizarr:latest
    container_name: wizarr
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - DISABLE_BUILTIN_AUTH=${WIZARR_DISABLE_BUILTIN_AUTH}
    volumes:
      - ${DOCKER_APPDATA_PATH}/wizarr:/data
      - ./user-plex-login.html:/app/app/templates/user-plex-login.html:ro
    networks:
      - media
      - traefik_socket_net
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_socket_net"
      - "traefik.http.routers.wizarr.rule=Host(`${WIZARR_HOST}`)"
      - "traefik.http.routers.wizarr.entrypoints=websecure"
      - "traefik.http.routers.wizarr.tls.certresolver=cloudflare"
      - "traefik.http.services.wizarr.loadbalancer.server.port=5690"
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  media:
    external: true
  traefik_socket_net:
    external: true
