services:
  daps:
    image: drazzilb08/daps:latest
    container_name: daps
    hostname: daps
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - 8002:8000
    volumes:
      - ${DOCKER_APPDATA_PATH}/daps:/config:rw
      - ${DOCKER_APPDATA_PATH}/daps/posters:/posters:rw
      - ${DOCKER_APPDATA_PATH}/kometa/assets:/kometa:rw
      - /mnt/data/media:/data/medias
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_socket_net"
      - "traefik.http.routers.daps.rule=Host(`${DAPS_HOST}`)"
      - "traefik.http.routers.daps.entrypoints=websecure"
      - "traefik.http.routers.daps.tls.certresolver=cloudflare"
      - "traefik.http.routers.daps.middlewares=allow-default-apps@file,tinyauth@file"
      - "traefik.http.services.daps.loadbalancer.server.port=8000"
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - media
      - traefik_socket_net

  daps-ui:
    image: monster117/daps-ui:nightly
    container_name: daps-ui
    hostname: daps-ui
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - APP_MODE=WEB
      - UMASK=${UMASK}
      - BORDER_SIZE=26
    ports:
      - 8001:8000
    volumes:
      - ${DOCKER_APPDATA_PATH}/daps-ui:/config:rw
      - ${DOCKER_APPDATA_PATH}/daps/posters:/posters:rw
      - ${DOCKER_APPDATA_PATH}/kometa/assets:/assets:rw
      - ${DOCKER_APPDATA_PATH}/kometa/assets/tmp:/config/original_posters
      - ${DOCKER_APPDATA_PATH}/daps-ui/border_replacerr.py:/code/DapsEX/border_replacerr.py:ro

    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_socket_net"
      - "traefik.http.routers.daps-ui.rule=Host(`${DAPS_UI_HOST}`)"
      - "traefik.http.routers.daps-ui.entrypoints=websecure"
      - "traefik.http.routers.daps-ui.tls.certresolver=cloudflare"
      - "traefik.http.routers.daps-ui.middlewares=allow-default-apps@file,tinyauth@file"
      - "traefik.http.services.daps-ui.loadbalancer.server.port=8000"
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - media
      - traefik_socket_net

networks:
  media:
    external: true
  traefik_socket_net:
    external: true
