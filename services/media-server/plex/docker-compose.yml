version: '3.8'

services:
  plex:
    image: ghcr.io/hotio/plex
    container_name: plex
    network_mode: host
    # mem_limit: 8g
    # mem_reservation: 2g
    # memswap_limit: 10g
    # cpu_shares: 1024
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
      - PLEX_CLAIM=${PLEX_CLAIM}
      - PLEX_ADVERTISE_URL=${PLEX_ADVERTISE_URL}
      - PLEX_NO_AUTH_NETWORKS=${PLEX_NO_AUTH_NETWORKS}
      - PLEX_BETA_INSTALL=false
      - PLEX_PURGE_CODECS=true
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:32400/web
    volumes:
      - ${DOCKER_APPDATA_PATH}/plex/config:/config
      - ${DOCKER_APPDATA_PATH}/plex/transcode:/transcode
      - ${MEDIAS_PATH:-/volume3/data/medias}:/data/medias
    ports:
      - 32400:32400
    devices:
      - /dev/dri:/dev/dri
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"