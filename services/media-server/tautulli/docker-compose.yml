services:
  tautulli:
    image: ghcr.io/hotio/tautulli
    container_name: tautulli
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=${UMASK}
      - WEBUI_PORTS=8181/tcp,8181/udp
    volumes:
      - ${DOCKER_APPDATA_PATH}/tautulli:/config
    networks:
      - media
      - traefik_socket_net
    ports:
      - 8181:8181
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_socket_net"
      - "traefik.http.routers.tautulli.rule=Host(`${TAUTULLI_HOST}`)"
      - "traefik.http.routers.tautulli.entrypoints=websecure"
      - "traefik.http.routers.tautulli.tls.certresolver=cloudflare"
      - "traefik.http.routers.tautulli.middlewares=allow-default-apps@file,tinyauth@file"
      - "traefik.http.routers.tautulli-internal.rule=Host(`${TAUTULLI_INTERNAL_HOST}`)"
      - "traefik.http.routers.tautulli-internal.entrypoints=websecure"
      - "traefik.http.routers.tautulli-internal.tls.certresolver=cloudflare"
      - "traefik.http.routers.tautulli-internal.middlewares=allow-default-apps@file"
      - "traefik.http.services.tautulli.loadbalancer.server.port=8181"
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  media:
    external: true
  traefik_socket_net:
    external: true
