services:
  posterflow:
    image: dweagle/posterflow:develop
    container_name: posterflow
    hostname: posterflow
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - 127.0.0.1:8357:8000
    volumes:
      - ${DOCKER_APPDATA_PATH}/posterflow:/config:rw
      - ${DOCKER_APPDATA_PATH}/daps/posters:/posters:rw
      - ${DOCKER_APPDATA_PATH}/kometa/assets:/assets:rw
      - ${DOCKER_APPDATA_PATH}/daps-ui/sa.json:/run/secrets/daps-ui-service-account.json:ro
      - ${DOCKER_APPDATA_PATH}/posterflow/patches/plex.py:/app/util/media_server/plex.py:ro
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_socket_net"
      - "traefik.http.routers.posterflow.rule=Host(`${POSTERFLOW_HOST}`)"
      - "traefik.http.routers.posterflow.entrypoints=websecure"
      - "traefik.http.routers.posterflow.tls.certresolver=cloudflare"
      - "traefik.http.routers.posterflow.middlewares=allow-default-apps@file,tinyauth@file"
      - "traefik.http.services.posterflow.loadbalancer.server.port=8000"
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - media
      - traefik_socket_net

networks:
  media:
    external: true
  traefik_socket_net:
    external: true
