services:
  plexboxd:
    image: ghcr.io/nichtlegacy/plexboxd:latest
    container_name: plexboxd
    restart: always
    shm_size: 2g
    env_file:
      - .env
    volumes:
      - ${DOCKER_APPDATA_PATH}/plexboxd/logs:/app/src/logs
      - ${DOCKER_APPDATA_PATH}/plexboxd/data:/app/data
      - ./entrypoint.sh:/app/entrypoint.sh:ro
      - ./sitecustomize.py:/usr/local/lib/python3.12/site-packages/sitecustomize.py:ro
    networks:
      - media
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  media:
    external: true
