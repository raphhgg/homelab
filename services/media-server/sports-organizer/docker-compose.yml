version: '3.8'
services:
  sports-organizer:
    image: ghcr.io/s0len/sports-organizer:latest
    container_name: sports-organizer
    networks:
      - main
    ports:
      - 2876:2875
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
      - SRC_DIR=/data/medias/downloads/torrents/complete/sports
      - DEST_DIR=/data/medias/sports
      - PROCESS_INTERVAL=60
      - PUSHOVER_NOTIFICATION=false
      # Optional Pushover notification settings
      # - PUSHOVER_USER_KEY=your_user_key
      # - PUSHOVER_API_TOKEN=your_api_token
      - DEBUG=false
    volumes:
      # - /path/to/actual/data:/data
      - ${MEDIAS_PATH}:/data/medias:rw
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  main:
    external: true