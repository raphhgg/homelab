services:
  wizarr-invite-broker:
    build: .
    image: wizarr-invite-broker:latest
    container_name: wizarr-invite-broker
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - DB_PATH=/data/invites.db
      - BROKER_PUBLIC_URL=${BROKER_PUBLIC_URL}
      - BROKER_ADMIN_API_KEY=${BROKER_ADMIN_API_KEY}
      - POCKET_ID_BASE_URL=${POCKET_ID_BASE_URL}
      - POCKET_ID_API_KEY=${POCKET_ID_API_KEY}
      - POCKET_SIGNUP_TOKEN_TTL=${POCKET_SIGNUP_TOKEN_TTL}
      - INVITE_TOKEN_TTL_HOURS=${INVITE_TOKEN_TTL_HOURS}
      - POCKET_SIGNUP_USER_GROUP_IDS=${POCKET_SIGNUP_USER_GROUP_IDS}
      - WIZARR_BASE_URL=${WIZARR_BASE_URL}
      - WIZARR_PUBLIC_URL=${WIZARR_PUBLIC_URL}
      - WIZARR_API_KEY=${WIZARR_API_KEY}
      - WIZARR_DEFAULT_SERVER_IDS=${WIZARR_DEFAULT_SERVER_IDS}
      - WIZARR_DEFAULT_LIBRARY_IDS=${WIZARR_DEFAULT_LIBRARY_IDS}
      - WIZARR_DEFAULT_EXPIRES_IN_DAYS=${WIZARR_DEFAULT_EXPIRES_IN_DAYS}
      - WIZARR_DEFAULT_DURATION=${WIZARR_DEFAULT_DURATION}
      - WIZARR_DEFAULT_UNLIMITED=${WIZARR_DEFAULT_UNLIMITED}
      - WIZARR_DEFAULT_ALLOW_DOWNLOADS=${WIZARR_DEFAULT_ALLOW_DOWNLOADS}
      - WIZARR_DEFAULT_ALLOW_LIVE_TV=${WIZARR_DEFAULT_ALLOW_LIVE_TV}
      - WIZARR_DEFAULT_ALLOW_MOBILE_UPLOADS=${WIZARR_DEFAULT_ALLOW_MOBILE_UPLOADS}
    volumes:
      - ${DOCKER_APPDATA_PATH}/wizarr-invite-broker:/data
    networks:
      - traefik_socket_net
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_socket_net"
      - "traefik.http.routers.wizarr-invite-broker.rule=Host(`${WIZARR_BROKER_HOST}`)"
      - "traefik.http.routers.wizarr-invite-broker.entrypoints=websecure"
      - "traefik.http.routers.wizarr-invite-broker.tls.certresolver=cloudflare"
      - "traefik.http.routers.wizarr-invite-broker.middlewares=wizarr-invite-broker-public-rate"
      - "traefik.http.middlewares.wizarr-invite-broker-public-rate.ratelimit.average=${BROKER_PUBLIC_RATE_AVERAGE}"
      - "traefik.http.middlewares.wizarr-invite-broker-public-rate.ratelimit.burst=${BROKER_PUBLIC_RATE_BURST}"
      - "traefik.http.routers.wizarr-invite-broker-admin.rule=Host(`${WIZARR_BROKER_HOST}`) && PathPrefix(`/api/admin`)"
      - "traefik.http.routers.wizarr-invite-broker-admin.entrypoints=websecure"
      - "traefik.http.routers.wizarr-invite-broker-admin.tls.certresolver=cloudflare"
      - "traefik.http.routers.wizarr-invite-broker-admin.priority=200"
      - "traefik.http.routers.wizarr-invite-broker-admin.middlewares=wizarr-invite-broker-admin-ip,wizarr-invite-broker-admin-rate"
      - "traefik.http.middlewares.wizarr-invite-broker-admin-ip.ipallowlist.sourcerange=${BROKER_ADMIN_ALLOWED_CIDRS}"
      - "traefik.http.middlewares.wizarr-invite-broker-admin-rate.ratelimit.average=${BROKER_ADMIN_RATE_AVERAGE}"
      - "traefik.http.middlewares.wizarr-invite-broker-admin-rate.ratelimit.burst=${BROKER_ADMIN_RATE_BURST}"
      - "traefik.http.services.wizarr-invite-broker.loadbalancer.server.port=8080"
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  traefik_socket_net:
    external: true
