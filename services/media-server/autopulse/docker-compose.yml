version: '3.8'
services:
  autopulse:
    image: ghcr.io/dan-online/autopulse:latest-sqlite
    container_name: autopulse
    networks:
      - main
    ports:
      - 2875:2875
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
      - AUTOPULSE__APP__DATABASE_URL=sqlite:///app/data/autopulse.db
      - AUTOPULSE__APP__USERNAME=${AUTOPULSE_USERNAME}
      - AUTOPULSE__APP__PASSWORD=${AUTOPULSE_PASSWORD}
    volumes:
      - ${DOCKER_APPDATA_PATH}/autopulse/config.yaml:/app/config.yaml
      - ${DOCKER_APPDATA_PATH}/autopulse/data:/app/data
      - ${MEDIAS_PATH}:/data/medias:ro
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  main:
    external: true
