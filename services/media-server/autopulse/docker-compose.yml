services:
  autopulse:
    image: danonline/autopulse:latest
    container_name: autopulse
    networks:
      - media
    ports:
      - 127.0.0.1:2875:2875
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
      - AUTOPULSE__APP__DATABASE_URL=sqlite:///app/data/autopulse.db
      - AUTOPULSE__APP__USERNAME=${AUTOPULSE_USERNAME}
      - AUTOPULSE__APP__PASSWORD=${AUTOPULSE_PASSWORD}
    volumes:
      - ${DOCKER_APPDATA_PATH}/autopulse/config.yaml:/app/config.yaml
      - ${DOCKER_APPDATA_PATH}/autopulse/data:/app/data
      - ${DOCKER_APPDATA_PATH}/autopulse/scripts:/app/scripts
      - /mnt/data/media:/data/medias:ro
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  media:
    external: true
