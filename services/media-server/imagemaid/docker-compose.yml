services:
  imagemaid:
    image: kometateam/imagemaid
    container_name: imagemaid
    # Scheduled to run daily at 04:00 (after Kometa night cycle completes at ~03:00)
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PLEX_URL=${PLEX_URL}
      - PLEX_TOKEN=${PLEX_TOKEN}
      - SCHEDULE=04:00|daily
      - MODE=remove
      - EMPTY_TRASH=True
      - CLEAN_BUNDLES=True
      - OPTIMIZE_DB=True
      - PHOTO_TRANSCODER=True
      - DISCORD=${DISCORD_WEBHOOK_URL}
    volumes:
      - ${DOCKER_APPDATA_PATH}/imagemaid/config:/config
      - ${DOCKER_APPDATA_PATH}/plex/config:/plex
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - main

networks:
  main:
    external: true