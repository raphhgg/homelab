services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
      - PORT=5055 #optional
    ports:
      - 5055:5055
    volumes:
      - ${DOCKER_APPDATA_PATH}/seerr/config:/app/config
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_socket_net"
      - "traefik.http.routers.seerr.rule=Host(`${SEERR_HOST}`)"
      - "traefik.http.routers.seerr.entrypoints=websecure"
      - "traefik.http.routers.seerr.tls.certresolver=cloudflare"
      - "traefik.http.routers.seerr.middlewares=allow-default-apps@file"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - media
      - traefik_socket_net

networks:
  media:
    external: true
  traefik_socket_net:
    external: true
